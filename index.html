  ex:"문화의 특수성은 존중하되 각 문화를 보편 규범에 비추어 성찰하는 태도가 중요하다. 이 성인식(바누아투의 번지점프)은 안전장치가 없어 크게 다치거나 목숨을 잃기도 한다. (교과서 134쪽, 지도서 169쪽)" },
{ id:"G10", u:"G", p:"135", t:"mc", d:2, tag:"보편 규범과 문화 성찰",
  ps:"○○족 여성들은 어릴 때부터 무거운 황동 고리를 목에 걸어 목을 조금씩 늘인다. 건강에 좋지 않지만, 부족의 전통이자 관광객을 끄는 생계 수단이어서 오늘날까지 이어지고 있다.",
  q:"이 문화를 보편 규범에 비추어 성찰할 때 가장 적절한 판단은?",
  c:["몸에 손상과 고통을 주고 여성에게만 강요되므로 인간 존엄성과 평등에 어긋나 개선이 필요하다.","전통이므로 무조건 존중해야 한다.","관광 수입이 있으므로 계속 권장해야 한다.","다른 나라의 문화이므로 우리 문화보다 열등하다.","문화는 평가할 수 없으므로 어떤 판단도 하면 안 된다."], a:1,
  ex:"생명 존중, 인간 존엄성, 인권, 자유, 평등 같은 보편 규범에 비추어 문화를 성찰해야 한다. 이때 특정 문화를 무분별하게 비하해서는 안 된다. (교과서 135쪽, 지도서 169쪽)" },
{ id:"G11", u:"G", p:"134", t:"mc", d:1, tag:"보편 규범과 문화 성찰",
  q:"문화를 성찰할 때 기준으로 삼는 ‘보편 규범’으로 보기 어려운 것은?",
  c:["생명 존중","인간 존엄성","인권","평등","특정 부족만의 전통 풍습"], a:5,
  ex:"보편 규범은 사람들이 보편적으로 추구하는 생명 존중, 인간 존엄성, 인권, 자유, 평등 등이다. (교과서 134~135쪽)" },
{ id:"G12", u:"G", p:"136", t:"mc", d:2, tag:"다문화 사회의 도덕적 문제",
  ps:"엄지손가락을 치켜세우는 손동작은 우리에게 ‘잘했다’는 뜻이지만 중동 지역에서는 상대를 모욕하는 동작이다. 고개를 위아래로 끄덕이는 것은 우리에게 ‘예’이지만 인도에서는 ‘아니요’를 뜻한다.",
  q:"이런 차이 때문에 생길 수 있는 다문화 사회의 도덕적 문제는?",
  c:["소통 부족과 무지로 인한 문제","정체성 혼란으로 인한 문제","디지털 중독 문제","지식 재산권 침해 문제","문화 사대주의로 인한 문제"], a:1,
  ex:"다른 문화에 대해 잘 모르거나 충분히 소통하지 않으면 같은 행동도 다르게 해석해 오해와 갈등이 생길 수 있다. (교과서 136쪽)" },
{ id:"G13", u:"G", p:"137", t:"mc", d:2, tag:"다문화 사회의 도덕적 문제", fixed:true,
  q:"문화권에 따라 달리 해석되는 행동에 대한 설명으로 옳지 않은 것은?",
  c:["프랑스에서는 손가락 ‘OK’ 표시가 ‘가치가 없다’는 뜻이 되기도 한다.","이슬람 국가에서는 머리를 신성하게 여겨 함부로 머리를 만지면 불쾌해한다.","베트남에서는 웃어른 앞에서 팔짱을 끼는 것이 존경의 표현이다.","몽골에서는 사람을 손가락으로 가리키면 실례가 되므로 손바닥을 위로 펴서 가리킨다.","같은 행동은 어느 문화권에서나 반드시 같은 뜻으로 해석된다."], a:5,
  ex:"문화권마다 가치관, 역사, 예절, 관습이 다르므로 같은 행동도 다르게 해석될 수 있다. (교과서 137쪽, 지도서 171쪽, 177쪽)" },
{ id:"G14", u:"G", p:"137", t:"short", d:3, tag:"외집단에 대한 편견",
  ps:"“동양인들은 다 똑같이 생겼다.”라는 말에는 불편해하면서도 “외국 사람들은 다 똑같이 생겼다.”라고 말하는 사람이 있다. 자기 집단 사람들은 저마다 개성이 있다고 보면서, 외집단 구성원은 모두 같은 특성을 지닌다고 생각하는 것이다.",
  q:"‘우리는 다양하지만, 그들은 닮았다.’라고 생각하는 이러한 현상을 무엇이라고 하는지 쓰시오.",
  a:"외집단 동질성 가설", acc:["외집단동질성가설","외집단 동질성","외집단동질성"],
  ex:"외집단 동질성 가설은 하나의 특성으로 외집단 전체를 규정하는 일종의 편견이며, 외집단을 부정적으로 규정하면 집단 간 갈등을 일으킬 수 있다. (교과서 137쪽)" },
{ id:"G15", u:"G", p:"136", t:"mc", d:2, tag:"다문화 사회의 도덕적 문제",
  q:"다음 중 ‘외집단 배척과 편견으로 인한 문제’에 해당하는 사례로 가장 적절한 것은?",
  c:["이주 노동자를 단지 노동력을 얻기 위한 수단으로 보고 차별한다.","외국인 친구의 고개 끄덕임을 ‘예’로 오해했다.","부모님의 문화가 달라 어디에 속해야 할지 혼란스럽다.","처음 가 본 나라의 식사 예절을 몰라 실수했다.","다른 나라 음식을 맛보고 좋아하게 되었다."], a:1,
  ex:"이주민은 모두 존엄한 인간이자 사회의 소중한 구성원이다. 외집단에 편견을 갖고 무시하는 태도는 조화로운 사회 통합을 가로막는다. (교과서 136쪽)" },
{ id:"G16", u:"G", p:"136", t:"mc", d:2, tag:"다문화 사회의 도덕적 문제",
  ps:"지아는 어머니가 베트남, 아버지가 한국 출신이다. 친구들이 “너는 어느 나라 사람이야?”라고 자꾸 묻고 다르게 대할 때마다, 지아는 자신이 어디에 속해야 하는지, 어떤 가치관을 가져야 하는지 혼란스러워진다.",
  q:"지아가 겪는 문제와 그 문제를 더 심하게 만드는 원인을 옳게 짝지은 것은?",
  c:["정체성 혼란 - 주변 사람들의 배타적인 태도","소통 부족 - 지아의 한국어 실력","디지털 중독 - 스마트폰 사용","문화 사대주의 - 베트남 문화","지식 재산권 침해 - 친구들의 질문"], a:1,
  ex:"새로운 문화권에서 살아가는 청소년은 부모의 문화가 다를 때 정체성 혼란을 겪기도 하며, 주변 사람들이 배타적인 태도를 보이면 더 심해질 수 있다. (교과서 136쪽)" },
{ id:"G17", u:"G", p:"136", t:"mc", d:2, tag:"외집단에 대한 편견",
  q:"지도서에 소개된 ‘제노포비아’에 대한 설명으로 옳지 않은 것은?",
  c:["‘이방인’과 ‘공포’를 뜻하는 말이 합쳐진 말이다.","외국인이나 이민족 집단을 혐오하고 배척하는 것을 뜻한다.","대중 매체의 부정적인 묘사로 왜곡된 정보를 배워 생기기도 한다.","조화로운 다문화 사회 형성과 사회 통합을 방해한다.","외국인을 직접 많이 만나 본 경험 때문에 주로 생긴다."], a:5,
  ex:"제노포비아는 외국인을 직접 접해 볼 기회가 부족한 상태에서 매체의 부정적 묘사로 두려움과 적대감을 갖게 되며 생긴다. 즉 편견이 낳은 결과이다. (지도서 171쪽)" },
{ id:"G18", u:"G", p:"136", t:"mc", d:2, tag:"다문화 사회의 도덕적 문제", fig:"ethFamily",
  q:"그림은 지도서에 소개된 통계 자료이다. 이 자료에 대한 설명으로 옳은 것은?",
  c:["다문화 가족이 겪는 가장 큰 어려움은 언어 문제이다.","외로움을 가장 큰 어려움으로 꼽은 비율이 가장 높다.","자녀 양육·교육 문제는 경제적 어려움보다 비율이 높다.","다문화 가족은 한국 생활에서 어려움을 겪지 않는다.","네 가지 어려움의 비율은 모두 같다."], a:1,
  ex:"언어 문제(22.9%), 경제적 어려움(21%), 외로움(19.6%), 자녀 양육·교육(16.5%) 순이다. 소통의 어려움과 외로움은 다문화 사회에서 함께 해결해야 할 문제이다. (지도서 171쪽)" },
{ id:"G19", u:"G", p:"136", t:"mc", d:2, tag:"외집단에 대한 편견",
  ps:"인도에서 온 대학 교수 ○○ 씨는 버스에서 한 승객에게 인종 차별적인 말을 듣고 말다툼을 벌였다. 출동한 경찰에게 자신이 대학 교수라고 말했지만, 경찰마저 믿어 주지 않았다.",
  q:"○○ 씨가 겪은 일의 원인으로 가장 적절한 것은?",
  c:["특정 국가 출신 외국인에 대한 편견","○○ 씨의 한국어 실력 부족","○○ 씨가 한국 문화를 존중하지 않은 것","버스 안의 좌석 부족","경찰의 업무 방식"], a:1,
  ex:"○○ 씨가 겪은 차별은 무엇보다 특정 인종이나 국가의 사람에 대한 편견 때문에 생긴 문제이다. (교과서 136쪽, 지도서 182쪽)" },
{ id:"G20", u:"G", p:"134", t:"mc", d:3, tag:"문화를 바라보는 관점", fixed:true,
  ps:"㉠ 자문화 중심주의는 자기 문화를 기준으로 다른 문화를 낮게 평가한다. ㉡ 문화 사대주의는 특정 문화를 맹목적으로 추종하며 자기 문화를 업신여길 수 있다. ㉢ 문화 절대주의는 차별과 갈등을 불러일으킬 수 있다. ㉣ 문화 상대주의를 따른다면 인권을 침해하는 문화도 무조건 존중해야 한다. ㉤ 문화의 특수성을 존중하되 보편 규범에 비추어 성찰하는 태도가 중요하다.",
  q:"밑줄 친 ㉠~㉤ 중 옳지 않은 것은?",
  c:UL5, a:4,
  ex:"인류 보편적 가치를 침해하는 문화까지 무조건 인정하는 것은 ‘극단적’ 문화 상대주의로, 경계해야 할 태도이다. (교과서 134쪽)" },
{ id:"G21", u:"G", p:"134", t:"mc", d:2, tag:"문화를 바라보는 관점",
  ps:"남반구가 위쪽에 있는 ‘거꾸로 세계 지도’를 처음 보면 무척 낯설게 느껴진다. 북반구가 위에 있는 지도만 당연하다고 여겨 왔기 때문이다.",
  q:"이 지도가 다른 문화를 이해하는 데 주는 교훈으로 가장 적절한 것은?",
  c:["익숙한 틀에서 벗어나 다른 관점에서 생각해 보아야 한다.","익숙한 것이 언제나 옳다.","지도는 한 가지 방식으로만 그려야 한다.","다른 나라의 관점은 알 필요가 없다.","낯선 것은 모두 틀린 것이다."], a:1,
  ex:"다른 문화를 이해하려면 내가 가진 틀에서 벗어나 다른 관점에서 생각해 보는 것이 필요하다. 문화적 차이는 ‘틀림’이 아니라 ‘다름’이다. (교과서 134쪽, 지도서 168~169쪽)" },
{ id:"G22", u:"G", p:"134", t:"essay", d:2, tag:"보편 규범과 문화 성찰",
  q:"문화 상대주의의 관점이 필요하지만, 극단적 문화 상대주의는 경계해야 하는 까닭을 서술하시오.",
  a:"극단적 문화 상대주의는 각 문화의 특수성만 강조하여 모든 문화를 조건 없이 인정한다. 이를 따르면 인간 존엄성, 인권, 생명 존중, 평등 같은 인류의 보편적 가치를 훼손하는 문화까지 인정해야 하므로 경계해야 한다.",
  rb:"① 모든 문화를 무조건 인정한다는 극단적 문화 상대주의의 뜻\n② 인권·인간 존엄성 등 보편 가치를 침해하는 문화까지 인정하게 된다는 문제점",
  ex:"(교과서 134쪽 / 지도서 182쪽 서술형 3번)" },
{ id:"G23", u:"G", p:"134-135", t:"essay", d:3, tag:"보편 규범과 문화 성찰",
  ps:"갑: 각 문화의 고유한 가치를 인정하고, 그 문화의 특수성을 무조건 존중해야 해.\n을: 모든 문화를 무조건 존중해야 하는 것은 아니야. (          )",
  q:"괄호에 들어갈 을의 말을, 보편 규범에 따른 성찰이 필요한 까닭과 구체적인 예를 들어 서술하시오.",
  a:"당사자의 뜻과 상관없는 조혼이나 생명을 위협하는 행위를 강요하는 문화, 특정 성별의 자유를 억압하는 문화는 인간 존엄성과 인권을 침해해. 그러니 생명 존중, 인권 같은 보편 규범에 비추어 문화를 성찰하고 개선해야 해.",
  rb:"① 성찰이 필요한 문화의 구체적인 예 (목 고리, 위험한 성인식, 조혼, 명예살인 등)\n② 그 문화의 문제점과 보편 규범(생명 존중, 인간 존엄성, 인권, 평등 등)",
  ex:"(교과서 134~135쪽, 145쪽 서술형 2번 / 지도서 181쪽 채점 요소)" },

/* ── Ⅲ-2-3 다양한 문화와 공존하는 자세 ── */
{ id:"H1", u:"H", p:"138", t:"mc", d:1, tag:"다문화 정책 모델",
  q:"한 사회의 주류 문화에 이민자의 소수 문화가 섞여 새로운 문화를 만들어 냄으로써 사회를 통합하는 다문화 정책 방식은?",
  c:["용광로 모델","샐러드 볼 모델","국수 대접 모델","모자이크 모델","문화 상대주의"], a:1,
  ex:"여러 금속을 용광로에 넣으면 녹아 원래 모습이 사라지듯, 용광로 모델은 이민자의 언어와 문화를 주류 문화로 동화하는 정책을 취한다. (교과서 138쪽)" },
{ id:"H2", u:"H", p:"138", t:"mc", d:2, tag:"다문화 정책 모델", fig:"ethModels", fixed:true,
  q:"그림 (가)~(다)가 나타내는 다문화 정책 모델을 순서대로 옳게 짝지은 것은?",
  c:["용광로 - 샐러드 볼 - 국수 대접","샐러드 볼 - 용광로 - 국수 대접","국수 대접 - 샐러드 볼 - 용광로","용광로 - 국수 대접 - 샐러드 볼","샐러드 볼 - 국수 대접 - 용광로"], a:1,
  ex:"(가) 모두 녹아 하나가 됨(용광로), (나) 각 재료가 고유한 모양과 맛을 유지하며 조화(샐러드 볼), (다) 주류 문화(국수) 위에 비주류 문화(고명)를 얹음(국수 대접). (교과서 138쪽)" },
{ id:"H3", u:"H", p:"138", t:"mc", d:2, tag:"다문화 정책 모델", fixed:true,
  q:"샐러드 볼 모델의 특징으로 옳은 것만을 〈보기〉에서 고른 것은?",
  bg:["ㄱ. 주류 문화를 우선으로 두고 이주민의 문화를 받아들인다.","ㄴ. 각자가 소중하게 생각하는 문화를 동등하게 존중한다.","ㄷ. 다양한 인종, 민족, 집단의 고유한 문화적 정체성을 유지할 수 있다.","ㄹ. 소수 문화가 주류 문화에 녹아 새로운 하나의 문화가 된다."],
  c:BG4, a:3,
  ex:"ㄱ은 국수 대접 모델, ㄹ은 용광로 모델의 특징이다. 샐러드 볼 모델은 외부에서 들어온 문화도 동등한 가치가 있음을 인정한다. (교과서 138쪽, 지도서 183쪽)" },
{ id:"H4", u:"H", p:"138", t:"mc", d:2, tag:"다문화 정책 모델",
  q:"다문화 정책 모델의 장단점에 대한 설명으로 옳은 것은?",
  c:["용광로 모델은 사회 통합을 유지하기 쉽지만 소수 집단의 일방적인 희생과 노력이 필요하다.","용광로 모델은 소수 문화를 가장 동등하게 존중한다.","샐러드 볼 모델은 사회 통합이 가장 강하게 유지된다는 장점이 있다.","국수 대접 모델은 이주민의 문화를 주류 문화와 완전히 동등하게 본다.","샐러드 볼 모델은 고유한 문화적 정체성을 잃게 된다는 단점이 있다."], a:1,
  ex:"샐러드 볼 모델은 사회 통합이 약화될 수 있다는 단점이 있지만 고유한 문화적 정체성을 유지할 수 있다. 국수 대접 모델은 이주민 문화를 주류 문화와 동등하게 보지 않는다. (교과서 138쪽)" },
{ id:"H5", u:"H", p:"138", t:"mc", d:2, tag:"다문화 정책 모델",
  q:"국수 대접 모델에 대한 설명으로 가장 적절한 것은?",
  c:["주류 문화를 국수로, 비주류 문화를 고명으로 보아 주류 문화를 우선으로 두면서 다양성도 인정한다.","모든 문화를 녹여 하나의 새로운 문화로 만든다.","주류 문화와 비주류 문화를 구분하지 않고 완전히 동등하게 본다.","이주민의 문화를 전혀 인정하지 않는다.","주류 문화를 없애고 비주류 문화만 남긴다."], a:1,
  ex:"국수 대접 모델은 샐러드 볼처럼 문화의 공존을 주장하지만 이주민 문화를 주류 문화와 동등하게 보지 않고, 용광로처럼 주류 문화 중심으로 통합하지만 다양성을 인정한다. (교과서 138쪽)" },
{ id:"H6", u:"H", p:"144", t:"mc", d:2, tag:"다문화 정책 모델", fixed:true,
  q:"다문화 정책에 대한 접근 방식과 모델의 연결로 옳은 것은?",
  c:["동화주의 - 용광로 모델 / 다문화주의 - 샐러드 볼 모델 / 문화 다원주의 - 국수 대접 모델","동화주의 - 샐러드 볼 모델 / 다문화주의 - 용광로 모델 / 문화 다원주의 - 국수 대접 모델","동화주의 - 국수 대접 모델 / 다문화주의 - 샐러드 볼 모델 / 문화 다원주의 - 용광로 모델","동화주의 - 용광로 모델 / 다문화주의 - 국수 대접 모델 / 문화 다원주의 - 샐러드 볼 모델","동화주의 - 샐러드 볼 모델 / 다문화주의 - 국수 대접 모델 / 문화 다원주의 - 용광로 모델"], a:1,
  ex:"동화주의적 접근의 용광로 모델, 다문화주의적 접근의 샐러드 볼 모델, 문화 다원주의적 접근의 국수 대접 모델이다. (교과서 144쪽)" },
{ id:"H7", u:"H", p:"139", t:"mc", d:2, tag:"다문화 정책 사례",
  ps:"캐나다는 1971년 최초로 다문화주의를 국가 정책으로 채택하였다. 경찰이나 군인처럼 유니폼을 입는 직업에서도 종교적 이유가 있으면 터번 등을 착용할 수 있게 하였다. 그 결과 여론 조사 응답자의 95%가 ‘이민자 역시 좋은 캐나다 시민인 것 같다.’라고 답했다.",
  q:"캐나다의 정책과 가장 가까운 다문화 정책 모델은?",
  c:["샐러드 볼 모델","용광로 모델","국수 대접 모델","동화주의 모델","자문화 중심주의"], a:1,
  ex:"각자의 문화를 동등하게 존중하는 다문화주의 정책으로, 샐러드 볼 모델에 가깝다. 캐나다는 인종·민족 간 갈등을 극복하고 포용적인 선진 국가의 이미지를 얻었다. (교과서 139쪽, 지도서 175쪽)" },
{ id:"H8", u:"H", p:"138", t:"mc", d:2, tag:"다문화 정책 사례",
  q:"지도서에 소개된 우리나라 다문화 정책의 변화로 가장 적절한 것은?",
  c:["과거에는 이주민에게 한국 문화를 받아들이도록 요구하는 동화주의 정책을 썼지만, 오늘날에는 서로의 문화를 존중하는 사회 환경 만들기에 힘쓰고 있다.","과거부터 지금까지 이주민 문화를 전혀 고려하지 않는다.","처음부터 샐러드 볼 모델만 사용해 왔다.","오늘날에는 이주민에게 한국어 배우기를 금지한다.","다문화 정책을 아예 시행하지 않는다."], a:1,
  ex:"과거 우리나라는 한국어·한국 음식 배우기처럼 이주민에게 일방적인 희생을 요구했지만, 동화주의의 문제점을 인식하고 ‘상호 문화를 존중하는 사회 환경 만들기’로 정책 방향을 바꾸었다. (지도서 175쪽)" },
{ id:"H9", u:"H", p:"138", t:"mc", d:3, tag:"다문화 정책 사례",
  q:"지도서에 소개된 ‘이주자 통합 정책 지수’에 대한 설명으로 옳은 것은?",
  c:["우리나라는 필요에 부응하는 교육 제도가 가장 뛰어나고, 이주민을 위한 건강·보건 시스템이 가장 취약한 것으로 나타났다.","한 나라의 이주민 수만을 세어 비교하는 지수이다.","우리나라는 모든 영역에서 가장 낮은 점수를 받았다.","이주민의 정치 참여 기회는 평가하지 않는다.","이주민의 취업 기회만 평가한다."], a:1,
  ex:"이 지수는 국적 접근성, 차별 보호, 교육, 가족 재결합, 보건, 취업, 영주권, 정치 참여 등 8개 영역을 평가한다. 우리나라는 2020년 기준 평균보다 약간 높았다. (지도서 175쪽)" },
{ id:"H10", u:"H", p:"140", t:"mc", d:2, tag:"공존하는 자세",
  ps:"중국에서 온 시원이는 여러 문화적 배경을 가진 청소년 봉사 동아리에서 활동한다. 동아리 친구들과 도서관에 새로 들어온 외국 책을 읽고 한국어와 그 나라 언어로 소개 글을 써서, 책 추천에 어려움을 겪던 사서 선생님께 큰 도움을 드렸다.",
  q:"이 사례에 가장 잘 드러난 다문화 사회의 바람직한 자세는?",
  c:["함께 도우며 살아가는 동반자적 자세","자문화 중심주의적 자세","외집단을 배척하는 자세","주류 문화에 무조건 맞추는 자세","문화 사대주의적 자세"], a:1,
  ex:"특정 인종이나 문화·종교와 관계없이 모두가 우리 사회의 일원이자 서로에게 도움을 주는 존재이다. 다양한 문화적 배경을 가진 사람들을 이웃으로 환대하고 더 큰 우리가 되어야 한다. (교과서 140쪽)" },
{ id:"H11", u:"H", p:"140", t:"short", d:1, tag:"공존하는 자세",
  q:"다양한 문화적 배경을 가진 사람들을 함께 살아갈 이웃으로 ‘반갑게 맞아 정성껏 후하게 대접함’을 뜻하는 말을 쓰시오.",
  a:"환대", acc:[],
  ex:"다문화 사회에서는 동반자적 자세로 다른 문화의 사람들을 이웃으로 환대해야 한다. (교과서 140쪽)" },
{ id:"H12", u:"H", p:"140", t:"mc", d:2, tag:"공존하는 자세", fixed:true,
  q:"다양한 문화와 공존하기 위한 ‘사회적 차원’의 노력만을 〈보기〉에서 있는 대로 고른 것은?",
  bg:["ㄱ. 학교에서 다문화 체험 주간을 만들고 문화 다양성 교육을 한다.","ㄴ. 길에서 마주치는 이주민을 외집단으로 여기지 않고 이웃으로 환대한다.","ㄷ. 지방 자치 단체에서 외국인 주민과 함께하는 체육 대회를 연다.","ㄹ. 시립 도서관에 다문화 도서를 늘리고 독서 프로그램을 운영한다."],
  c:BG34, a:3,
  ex:"ㄴ은 개인적 차원의 노력이다. 다문화 교육과 제도의 폭넓은 실시, 제도 정비, 배타적 태도를 용납하지 않는 분위기 조성은 사회적 차원의 노력이다. (교과서 140쪽, 지도서 183쪽)" },
{ id:"H13", u:"H", p:"140", t:"mc", d:2, tag:"공존하는 자세",
  q:"바람직한 다문화 사회를 위한 사회적 차원의 노력으로 적절하지 않은 것은?",
  c:["다문화 교육으로 다른 문화를 접하고 이해할 장을 마련한다.","현재의 다문화 관련 제도가 적합한지 살펴 보완한다.","배타적 태도를 용납하지 않는 사회 분위기를 만든다.","외집단에 대한 혐오 행위를 절제하도록 돕는다.","다른 문화를 배척하는 발언도 개인의 자유이므로 모두 허용한다."], a:5,
  ex:"타 문화에 대한 무지와 이해 부족은 편견을 낳고 차별로 이어질 수 있으므로, 교육과 제도 정비, 배타적 태도를 용납하지 않는 분위기 조성이 필요하다. (교과서 140쪽)" },
{ id:"H14", u:"H", p:"139", t:"mc", d:2, tag:"공존하는 자세",
  ps:"누군가 이슬람 사원 벽에 빨간 스프레이로 ‘너희 나라로 돌아가라.’라고 낙서했다. 이를 본 시민들이 하나둘 모여 낙서를 지우고, ‘가지 마세요. 여기가 당신 집입니다.’라는 메시지를 남겼다.",
  q:"시민들의 행동에 담긴 의미로 가장 적절한 것은?",
  c:["배타적 태도를 용납하지 않고 서로를 따뜻하게 감싸는 사회 분위기를 보여 준다.","다른 종교를 배척하는 태도를 지지한다.","이슬람교로 개종할 것을 권한다.","낙서한 사람의 표현의 자유를 존중한다.","갈등을 모른 척하는 것이 바람직함을 보여 준다."], a:1,
  ex:"누군가 혐오를 드러낼 때 주위 사람들이 모른 척하지 않는 것, 즉 배타적 태도를 용납하지 않는 사회 분위기는 혐오 행위를 줄이는 데 도움을 준다. (교과서 139~140쪽)" },
{ id:"H15", u:"H", p:"141", t:"mc", d:2, tag:"공존하는 자세",
  ps:"한 방송 실험에서 서양인 참가자가 한국이 낯선 척하자 행인들이 친절하게 지하철 노선을 알려 주었다. 그런데 비슷한 상황에서 동남아시아 출신 참가자에게는 설명해 주는 사람이 적었고, 길을 물으면 고개를 저으며 모른다고 했다.",
  q:"두 참가자가 다른 경험을 한 까닭으로 가장 적절한 것은?",
  c:["피부색과 출신 지역에 따른 인종적 편견","두 참가자의 한국어 실력 차이","지하철 노선이 바뀌었기 때문","행인들이 바빴기 때문","실험 장소가 달랐기 때문"], a:1,
  ex:"타이어에 박힌 못이 바람을 빼듯, ‘편견의 못’은 우리가 세상을 바르게 보지 못하게 한다. 우리가 가진 편견의 못을 찾아 없애야 한다. (교과서 141쪽, 지도서 177쪽)" },
{ id:"H16", u:"H", p:"140", t:"mc", d:3, tag:"공존하는 자세",
  q:"지도서에 소개된 데리다의 ‘환대’와 하버마스의 ‘관용’에 대한 설명으로 옳은 것은?",
  c:["데리다는 이방인에게 조건 없이 집을 내어 주는 환대를 주장했고, 하버마스는 이러한 절대적 환대는 실천하기 어렵다며 조건적인 관용을 강조했다.","데리다와 하버마스 모두 이방인을 배척해야 한다고 보았다.","하버마스는 조건 없는 절대적 환대를 주장했다.","데리다는 이방인에게 조건을 붙여야만 받아들일 수 있다고 보았다.","두 사람은 다문화 사회와 관계없는 주장을 했다."], a:1,

const PROFILES_KEY = "exam-solo-profiles", CURRENT_KEY = "exam-solo-current";

  loadProfile(name);

}

/* ═════════════ 기록 · 점수 ═════════════ */
function qStats() {
  const m = {};
  for (const e of S().log) {
    const s = m[e.q] || (m[e.q] = { tries: 0, correct: 0, wrong: 0, streak: 0, last: 0 });
    s.tries++; s.last = e.t;
    if (e.r === "correct") { s.correct++; s.streak++; } else { s.wrong++; s.streak = 0; }
  }
  return m;
}
/* 진도: 단원별로 풀어 본 문항 수와 한 번 이상 맞힌 문항 수 */
function progressOf(code, db) {
  const bank = BANKS[code], log = ((db || DB).subj[code] || {}).log || [];
  const tried = new Set(log.map(e => e.q)), right = new Set(log.filter(e => e.r === "correct").map(e => e.q));
  const units = {};
  Object.keys(bank.units).forEach(k => { units[k] = { total: 0, tried: 0, right: 0 }; });
  bank.qs.forEach(q => { const u = units[q.u]; if (!u) return; u.total++; if (tried.has(q.id)) u.tried++; if (right.has(q.id)) u.right++; });
  const all = { total: 0, tried: 0, right: 0 };
  Object.values(units).forEach(u => { all.total += u.total; all.tried += u.tried; all.right += u.right; });
  return { units, ...all };
}
function nextUnit(code) { const e = Object.entries(progressOf(code).units).find(([, u]) => u.tried < u.total); return e ? e[0] : null; }
function progBar(tried, right, total) {
  return `<span class="pbar" aria-hidden="true"><i style="width:${total ? tried / total * 100 : 0}%"></i><b style="width:${total ? right / total * 100 : 0}%"></b></span>`;
}
function wrongList(includeMastered) {
  return Object.entries(qStats()).filter(([id, s]) => QMAP[id] && s.wrong > 0 && (includeMastered || s.streak < 2))
    .map(([id, s]) => ({ id, ...s, mastered: s.streak >= 2 })).sort((a, b) => b.wrong - a.wrong || b.last - a.last);
}
function groupStats(keyFn) {
  const m = {};
  for (const e of S().log) { const q = QMAP[e.q]; if (!q) continue; const k = keyFn(q); const s = m[k] || (m[k] = { k, n: 0, c: 0 }); s.n++; s.c += score(e.r); }
  return Object.values(m).map(s => ({ ...s, rate: s.c / s.n }));
}

/* 문제 한 개를 채점 기록하고 점수·콤보·도장을 계산 */
function record(qid, r, opts = {}) {
  const q = QMAP[qid];
  S().log.push({ q: qid, r, t: Date.now() });
  if (!G.days.includes(today())) G.days.push(today());
  let pts = r === "correct" ? 10 + (q.d - 1) * 5 : r === "partial" ? 5 : 2;
  if (!opts.silentCombo) {
    if (r === "correct") { G.combo++; if (G.combo >= 3) pts += 5; } else G.combo = 0;
    G.best = Math.max(G.best, G.combo);
  }
  const before = levelOf(G.xp);
  G.xp += pts; addWeekXp(pts);
  const up = levelOf(G.xp) > before ? levelOf(G.xp) : null;
  const newB = checkBadges();
  save();
  return { pts, combo: G.combo, up, newB };
}
function checkBadges(extra = []) {
  const got = [];
  const give = id => { if (!G.badges[id]) { G.badges[id] = Date.now(); got.push(id); } };
  const log = S().log, st = qStats();
  if (log.length) give("first");
  if (G.best >= 5) give("combo5");
  if (G.best >= 10) give("combo10");
  if (log.filter(e => e.r === "correct" && QMAP[e.q]?.d === 3).length >= 10) give("hard10");
  if (log.filter(e => e.r === "correct" && QMAP[e.q] && (QMAP[e.q].bg || QMAP[e.q].ps)).length >= 20) give("bogi10");
  if (log.filter(e => e.r === "correct" && QMAP[e.q]?.t === "essay").length >= 5) give("essay5");
  if (wrongList(true).filter(w => w.mastered).length >= 10) give("redeem10");
  if (Object.keys(UNITS).some(u => QS.filter(q => q.u === u).every(q => st[q.id]?.correct))) give("unit");
  if (QS.every(q => st[q.id])) give("all");
  if (dayStreak() >= 3) give("days3");
  if (dayStreak() >= 7) give("days7");
  extra.forEach(give);
  return got;
}
function celebrate(res) {

  res.newB.forEach((id, i) => setTimeout(() => banner(`새 도장: ${BMAP[id].name}`, BMAP[id].desc, BMAP[id].seal.replace("\n", "<br>")), 600 + i * 1400));

}

/* ═════════════ 랭킹 ═════════════ */
/* 온라인 랭킹: GitHub Pages 버전에서 web/online-config.json에 Supabase 주소·키를 넣고

const ONLINE = { url: "", key: "", group: "" };
const SOLO = true;   // 혼자용 링크(build-solo.mjs)에서만 true: 랭킹을 숨김
const onlineOn = () => !!(ONLINE.url && ONLINE.key);
const GROUP = () => ONLINE.group || "all";   // 모임 코드를 따로 정하지 않으면 이 앱을 쓰는 모든 사람이 한 랭킹
const PTS_PER_Q = 15;   // 문제 하나를 맞히면 받는 평균 점수 (따라잡기 안내용)
function weekId(d = new Date()) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y = t.getUTCFullYear(), w = Math.ceil(((t - Date.UTC(y, 0, 1)) / 864e5 + 1) / 7);
  return `${y}-W${String(w).padStart(2, "0")}`;
}
function addWeekXp(pts) { const w = weekId(); if (!G.week || G.week.id !== w) G.week = { id: w, xp: 0 }; G.week.xp += pts; }
function streakOf(days) {
  const set = new Set(days || []); let n = 0; const d = new Date();
  if (!set.has(today())) d.setDate(d.getDate() - 1);
  while (set.has(`${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`)) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
/* 한 사람의 기록을 랭킹용 숫자로 요약 */
function summary(db, name) {
  const g = db.game || {}; let n = 0, c = 0, solved = 0;
  for (const k in db.subj || {}) {
    const log = db.subj[k].log || []; n += log.length;
    c += log.reduce((a, e) => a + score(e.r), 0); solved += new Set(log.map(e => e.q)).size;
  }
  return { name, xp: g.xp || 0, week_xp: g.week && g.week.id === weekId() ? g.week.xp : 0, level: levelOf(g.xp || 0) + 1,
    solved, accuracy: n ? c / n : null, streak: streakOf(g.days),
    progress: Object.fromEntries(Object.keys(BANKS).map(code => { const p = progressOf(code, db); return [code, { tried: p.tried, right: p.right, total: p.total, units: p.units }]; })) };
}

let boardCache = { rows: null, at: 0, err: null }, lastPush = 0;
function apiHeaders(extra) { return Object.assign({ apikey: ONLINE.key, Authorization: `Bearer ${ONLINE.key}` }, extra || {}); }
async function pushScore(force) {

      body: JSON.stringify({ group_code: GROUP(), name: who, xp: s.xp, week_id: weekId(), week_xp: s.week_xp, level: s.level,
        solved: s.solved, accuracy: s.accuracy, streak: s.streak, progress: s.progress, updated_at: new Date().toISOString() }),

}
/* 관리자 화면(admin.html)용 활동 기록: 접속과 끝낸 세트를 한 줄씩 보냄.
   인터넷이 끊기면 이 기기에 모아 두었다가 다음에 함께 보냄. 읽기는 관리자 계정만 가능. */
const LOGQ_KEY = "exam-solo-logq";
function deviceKind() { const u = navigator.userAgent; return /iPad|Tablet|Android(?!.*Mobile)/i.test(u) || (/Macintosh/.test(u) && navigator.maxTouchPoints > 1) ? "태블릿" : /Mobi|iPhone|Android/i.test(u) ? "휴대폰" : "컴퓨터"; }
let flushing = false;
async function logActivity(row) {

  const q = readJSON(LOGQ_KEY, []);
  if (row) q.push({ group_code: GROUP(), device: deviceKind(), created_at: new Date().toISOString(), ...row });
  writeJSON(LOGQ_KEY, q.slice(-300));

  flushing = true;
  try {
    const batch = readJSON(LOGQ_KEY, []);
    const r = await fetch(`${ONLINE.url}/rest/v1/activity_log`, {
      method: "POST", headers: apiHeaders({ "Content-Type": "application/json", Prefer: "return=minimal" }), body: JSON.stringify(batch),
    });
    if (r.ok) writeJSON(LOGQ_KEY, readJSON(LOGQ_KEY, []).slice(batch.length));

const visited = new Set();

}

  logActivity({ name: who, kind: "session", subject, mode: s.mode, n: s.qids.length, score: sessScore(s),
    units: [...new Set(s.qids.map(id => QMAP[id]?.u).filter(Boolean))], duration_ms: s.end - s.start, xp: s.xp || 0, items });
}
async function fetchBoard() {

  if (!r.ok) throw new Error(`랭킹 서버 응답 오류 (${r.status})`);
  const rows = await r.json();
  const wk = weekId();
  boardCache = { rows: rows.map(x => ({ ...x, week_xp: x.week_id === wk ? x.week_xp : 0 })), at: Date.now(), err: null };
  return boardCache.rows;
}
/* 지금 보여 줄 명단: 온라인 명단(있으면) + 이 기기 사람들의 최신 기록 */
function currentBoard(scope) {
  const local = localBoard();
  if (scope !== "online" || !boardCache.rows) return local;
  const map = new Map(boardCache.rows.map(r => [r.name, { ...r }]));
  local.forEach(l => { if (l.name === who || map.has(l.name)) map.set(l.name, { ...map.get(l.name), ...l }); });
  return [...map.values()];
}
function ranked(rows, key) {
  const list = rows.slice().sort((a, b) => (b[key] || 0) - (a[key] || 0) || (b.xp || 0) - (a.xp || 0) || String(a.name).localeCompare(b.name));
  let prev = null, rank = 0;
  list.forEach((r, i) => { const v = r[key] || 0; if (v !== prev) { rank = i + 1; prev = v; } r.rank = rank; });
  return list;
}

  return `${p.ahead.name}님까지 ${p.gap + 1}점! 약 ${k}문제만 더 맞히면 ${p.rank - 1}등으로 올라가요.`;

/* 결과 화면·첫 화면용 한 줄 요약. 순위가 오르면 배너로 축하 */

/* ═════════════ 오늘의 복습 · 시험 계획 ═════════════ */
/* 오늘의 복습: 마지막으로 푼 날부터, 연속으로 맞힌 횟수에 따라 간격을 두고 다시 낸다.
   틀림 1일 → 1번 맞힘 2일 → 2번 4일 → 3번 7일 → 4번 이상 14일 */
const GAPS = [1, 2, 4, 7, 14], DAY = 864e5;
function dayStart(t) { const d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }
function subjOf(code) { return DB.subj[code] || (DB.subj[code] = { log: [], sessions: [], current: null }); }
function dueList(code = subject) {
  const ids = new Set(BANKS[code].qs.map(q => q.id)), m = {};
  for (const e of (DB.subj[code] || {}).log || []) {
    if (!ids.has(e.q)) continue;
    const s = m[e.q] || (m[e.q] = { streak: 0, last: 0 });
    s.last = e.t; s.streak = e.r === "correct" ? s.streak + 1 : 0;
  }
  const now = dayStart(Date.now());
  return Object.entries(m).map(([id, s]) => ({ id, due: dayStart(s.last) + GAPS[Math.min(s.streak, GAPS.length - 1)] * DAY }))
    .filter(x => x.due <= now).sort((a, b) => a.due - b.due).map(x => x.id);
}
/* 시험까지 남은 날 (시험 날짜가 없으면 null, 오늘이 시험이면 0) */
function examDate(code = subject) { const ex = (DB.subj[code] || {}).exam; if (!ex) return null; const [y, m, d] = ex.split("-").map(Number); return new Date(y, m - 1, d); }
function daysLeft(code = subject) { const d = examDate(code); return d ? Math.round((d - dayStart(Date.now())) / DAY) : null; }
function isoToday() { const d = new Date(), p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; }
function fmtExam(d) { return `${d.getMonth() + 1}월 ${d.getDate()}일(${"일월화수목금토"[d.getDay()]})`; }
/* 오늘 공부할 단원: 아직 다 풀어 보지 않은 단원을 남은 날에 나눔 (시험 전날은 모의고사·오답 정리).
   하루 동안은 계획을 고정해서, 단원을 끝내도 목표가 바뀌지 않게 함 */
function todayPlan(code = subject) {
  const st = subjOf(code), dl = daysLeft(code);
  if (dl == null || dl < 0) return null;
  const p = progressOf(code);
  const left = Object.keys(BANKS[code].units).filter(u => p.units[u].tried < p.units[u].total);
  const studyDays = dl >= 2 ? dl - 1 : 1;
  if (!st.plan || st.plan.day !== today() || st.plan.exam !== st.exam) {
    st.plan = { day: today(), exam: st.exam, units: dl === 0 ? [] : left.slice(0, Math.ceil(left.length / studyDays)) };
    save();
  }
  return { dl, units: st.plan.units, left: left.length, perDay: Math.ceil(left.length / studyDays), wrap: dl === 1 || (dl > 1 && !left.length) };
}
/* 허브·과목 화면에 쓰는 한 줄 요약 */
function todaySummary(code) {
  const plan = todayPlan(code), due = dueList(code).length, p = progressOf(code), parts = [];
  if (plan?.dl === 0) parts.push("오늘 시험!");
  const undone = plan ? plan.units.filter(u => p.units[u].tried < p.units[u].total).length : 0;
  if (undone) parts.push(`단원 ${undone}개`);
  if (plan?.wrap) parts.push("모의고사·오답 정리");
  if (due) parts.push(`복습 ${due}문제`);
  return { dl: plan ? plan.dl : null, text: parts.join(" · ") };
}
function ddayText(dl) { return dl === 0 ? "D-day" : `D-${dl}`; }

let examEdit = false;
function todayCard() {
  const st = S(), dl = daysLeft(), plan = todayPlan(), due = dueList(), p = progressOf(subject);

    : dl < 0 ? "시험 날짜가 지났어요. 다음 시험 날짜를 넣어 주세요."
    : dl === 0 ? `${fmtExam(ed)} 시험`
    : `${fmtExam(ed)} 시험 · ${plan.left ? `남은 단원 ${plan.left}개, 하루 ${plan.perDay}단원씩` : "모든 단원을 한 번씩 풀어 봤어요"}${dl >= 2 ? " · 시험 전날은 모의고사·오답 정리" : ""}`;
  return `<section class="sheet stack today">
    <div class="row"><h2 style="font-size:1.1rem">오늘 할 일</h2>${dl != null && dl >= 0 ? `<span class="dday">${ddayText(dl)}</span>` : ""}<span class="spacer"></span>

    <p class="small muted" style="margin:0">${info}</p>
    ${rows.length ? `<ul class="todos">${rows.join("")}</ul>` : dl != null && dl >= 0 ? `<div class="okbox">오늘 할 일을 다 했어요! 더 하고 싶으면 아래에서 단원을 골라 풀어요.</div>` : ""}

function bindTodayCard() {

    if (!v) return toast("시험 날짜를 골라 주세요.");
    S().exam = v; S().plan = null; examEdit = false; save(); home();
  };
  if ($("#t-clear")) $("#t-clear").onclick = () => { delete S().exam; S().plan = null; examEdit = false; save(); home(); };
  if ($("#t-cancel")) $("#t-cancel").onclick = () => { examEdit = false; home(); };
  $$("[data-note-u]").forEach(b => b.onclick = () => go("notes", b.dataset.noteU));
  $$("[data-start-u]").forEach(b => b.onclick = () => startUnit(b.dataset.startU));
  if ($("#t-mock")) $("#t-mock").onclick = () => $("#m-mock").click();
  if ($("#t-review")) $("#t-review").onclick = () => startSession("review", dueList().slice(0, 20));
}
/* 틀린 문제에서 그 단원 요약으로 바로 가기 */
function noteLink(q) { return NOTES[subject]?.[q.u] ? `<button class="btn small" data-note="${q.u}">이 단원 요약 보기</button>` : ""; }

/* ═════════════ 사회 첫 화면 ═════════════ */
let pickCount = 20, pickLevel = "all";
function pool() {

}
function home() {

  const weak = groupStats(q => q.tag).filter(t => t.n >= 2 && t.rate < 1).sort((a, b) => a.rate - b.rate || b.n - a.n).slice(0, 5);
  const counts = Object.fromEntries(Object.keys(UNITS).map(u => [u, QS.filter(q => q.u === u).length]));

    ${todayCard()}
    <section class="sheet stack prog">

      ${progBar(prog.tried, prog.right, prog.total)}
      <div class="small muted">진도율 <b>${Math.round(prog.tried / prog.total * 100)}%</b> (한 번 이상 풀어 본 문항) · 정복률 <b>${Math.round(prog.right / prog.total * 100)}%</b> (한 번 이상 맞힌 문항) <span class="legend"><i></i>풀어 봄 <b></b>맞힘</span></div>

    </section>
    <div class="tiles">
      <div class="tile"><b>${answered}<span class="small"> / ${QS.length}</span></b><span>풀어 본 문항</span></div>

    </div>

        <button class="btn ghost small" id="all">${pickUnits.size === Object.keys(UNITS).length ? "모두 해제" : "모두 선택"}</button></div>
      <div class="units">
        ${Object.entries(UNITS).map(([k, u]) => `<div class="urow"><button class="unit ${pickUnits.has(k) ? "on" : ""}" data-u="${k}" aria-pressed="${pickUnits.has(k)}">
          <span class="roman">${u.big}</span><span class="nm">${u.name}<span class="uprog">${progBar(prog.units[k].tried, prog.units[k].right, counts[k])}<span class="small muted">${prog.units[k].tried}/${counts[k]} 풀어 봄 · 맞힘 ${prog.units[k].right}${prog.units[k].tried === counts[k] ? " · 완주" : ""}</span></span></span><span class="pg">${u.pages}쪽</span><span class="box">✓</span></button>${NOTES[subject]?.[k] ? `<button class="sumbtn" data-sum="${k}" aria-label="${esc(u.name)} 내용 요약 보기">내용 요약</button>` : ""}</div>`).join("")}
      </div>
      <div class="row"><span class="muted small" style="min-width:4em">난이도</span>

          <button data-l="basic" class="${pickLevel === "basic" ? "on" : ""}">개념 다지기</button>

      <div class="row"><span class="muted small" style="min-width:4em">문항 수</span>

    </section>
    <div class="modes">
      <button class="mode" id="m-wrong"><strong>오답 복습</strong><span>${wrongN ? `틀린 문제 ${wrongN}개를 다시 풀어요. 연속 2번 맞히면 졸업!` : "아직 틀린 문제가 없어요."}</span></button>
      <button class="mode" id="m-mock"><strong>모의고사</strong><span>실제 시험처럼 25문항을 45분 안에 풀고 100점 만점으로 채점해요.</span></button>
    </div>
    ${weak.length ? `<section class="sheet"><h2 style="font-size:1.05rem;margin-bottom:6px">약한 개념 TOP ${weak.length}</h2>
      <ol style="margin:0;padding-left:1.3em">${weak.map(t => `<li><b>${esc(t.k)}</b> <span class="small muted">정답률 ${pct(t.rate)} · ${t.n}번 풀이</span></li>`).join("")}</ol></section>` : ""}

  $$(".unit").forEach(b => b.onclick = () => { const u = b.dataset.u; pickUnits.has(u) ? pickUnits.delete(u) : pickUnits.add(u); home(); });
  $$("[data-sum]").forEach(b => b.onclick = () => go("notes", b.dataset.sum));
  bindTodayCard();
  $("#all").onclick = () => { pickUnits = pickUnits.size === Object.keys(UNITS).length ? new Set() : new Set(Object.keys(UNITS)); home(); };
  $$("[data-n]").forEach(b => b.onclick = () => { pickCount = +b.dataset.n; home(); });
  $$("[data-l]").forEach(b => b.onclick = () => { pickLevel = b.dataset.l; home(); });
  if ($("#go-next")) $("#go-next").onclick = () => startUnit($("#go-next").dataset.u);
  $("#start").onclick = () => {
    const st = qStats();
    const p = shuffle(pool()).sort((a, b) => (st[a.id]?.tries || 0) - (st[b.id]?.tries || 0));
    if (!p.length) return toast("단원을 하나 이상 골라 주세요.");
    startSession("normal", shuffle(p.slice(0, pickCount)).map(q => q.id));
  };
  $("#m-wrong").onclick = () => { const w = wrongList(false); if (!w.length) return toast("복습할 오답이 없어요!"); startSession("wrong", shuffle(w.slice(0, 20).map(x => x.id))); };
  $("#m-mock").onclick = () => {
    const ord = { mc: 0, short: 1, essay: 2 };
    const mcs = QS.filter(q => q.t === "mc");
    const hard = shuffle(mcs.filter(isApplied)).slice(0, 10), rest = shuffle(mcs.filter(q => !hard.includes(q))).slice(0, 9);
    const pick = [...hard, ...rest, ...shuffle(QS.filter(q => q.t === "short")).slice(0, 4), ...shuffle(QS.filter(q => q.t === "essay")).slice(0, 2)];
    startSession("mock", pick.sort((a, b) => ord[a.t] - ord[b.t] || a.id.localeCompare(b.id, "en", { numeric: true })).map(q => q.id));
  };
  if (cur) {
    $("#resume").onclick = () => go("quiz");
    const d = $("#drop");
    d.onclick = () => {
      if (d.dataset.armed) { s.current = null; save(); home(); return; }
      d.dataset.armed = "1"; d.textContent = "한 번 더 누르면 그만둬요";
      setTimeout(() => { if (d.isConnected) { delete d.dataset.armed; d.textContent = "그만두기"; } }, 3500);
    };
  }
}

/* 한 단원 문제를 덜 풀어 본 것부터 골라 풀기 */
function startUnit(u) {
  const st = qStats();
  const p = shuffle(QS.filter(q => q.u === u)).sort((a, b) => (st[a.id]?.tries || 0) - (st[b.id]?.tries || 0));
  startSession("normal", shuffle(p.slice(0, pickCount)).map(q => q.id));
}

/* ═════════════ 단원 내용 요약 ═════════════ */
let noteHide = false;                       // 가리고 외우기: 용어 뜻을 가렸다가 누르면 보여 줌
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
function notes(k) {
  const keys = Object.keys(UNITS).filter(u => NOTES[subject]?.[u]);
  if (!keys.includes(k)) k = keys[0];
  const u = UNITS[k], n = NOTES[subject][k], i = keys.indexOf(k);

  const resume = `<button class="btn primary" data-resume>풀던 문제로 돌아가기 (${Object.keys(cur?.ans || {}).length} / ${cur?.qids.length}문항)</button>`;
  app.innerHTML = `
  <div class="stack notes">

    <nav class="nchips" aria-label="단원 바로 가기">${keys.map((x, j) => `<button data-nk="${x}" class="${x === k ? "on" : ""}" ${x === k ? `aria-current="true"` : ""}>${j + 1}. ${esc(UNITS[x].name)}</button>`).join("")}</nav>
    <section class="hero">
      <span class="label">${BANKS[subject].name} 내용 요약 · ${u.big} · 교과서 ${u.pages}쪽</span>

    <section class="sheet stack">
      <div class="row"><h2 style="font-size:1.1rem">핵심 용어</h2><span class="spacer"></span>
        <div class="seg" role="group" aria-label="보기 방식"><button data-hide="0" class="${noteHide ? "" : "on"}">모두 보기</button><button data-hide="1" class="${noteHide ? "on" : ""}">가리고 외우기</button></div></div>
      ${noteHide ? `<p class="small muted" style="margin:0">뜻을 먼저 떠올려 본 뒤, 카드를 눌러 확인해요.</p>` : ""}
      <div class="terms">${n.terms.map(([t, d]) => noteHide
        ? `<button class="term hid" aria-expanded="false"><b>${esc(t)}</b><span class="def">${fmt(d)}</span><span class="peek">눌러서 뜻 보기</span></button>`
        : `<div class="term"><b>${esc(t)}</b><span class="def">${fmt(d)}</span></div>`).join("")}</div>
    </section>
    ${n.secs.map(s => `<section class="sheet stack">
      <h2 style="font-size:1.1rem">${esc(s.h)}</h2>
      ${s.li ? `<ul class="nlist">${s.li.map(x => `<li>${fmt(x)}</li>`).join("")}</ul>` : ""}
      ${s.tb ? `<div class="scroll"><table class="ntable${s.tb.r.length === 1 ? " plain" : ""}"><thead><tr>${s.tb.h.map(x => `<th scope="col">${esc(x)}</th>`).join("")}</tr></thead>
        <tbody>${s.tb.r.map(r => `<tr>${r.map(c => `<td>${fmt(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : ""}
    </section>`).join("")}
    <section class="ntrap stack">

        : `<div class="row"><span>다 읽었으면 바로 확인해 볼까요? <span class="small muted">(이 단원 ${p.total}문항 · 풀어 봄 ${p.tried})</span></span><span class="spacer"></span>
        <button class="btn primary" id="n-quiz">이 단원 문제 풀기</button></div>`}
    </section>

      ${prev ? `<button class="btn" data-nk="${prev}">← ${esc(UNITS[prev].name)}</button>` : ""}<span class="spacer"></span>

    </div>

  if ($("#n-back")) $("#n-back").onclick = () => go("home");
  $$("[data-resume]").forEach(b => b.onclick = () => go("quiz"));

/* ═════════════ 퀴즈 ═════════════ */
function startSession(mode, qids) {
  const orders = {};
  for (const id of qids) { const q = QMAP[id]; if (q.t === "mc") orders[id] = q.fixed ? [1, 2, 3, 4, 5] : shuffle([1, 2, 3, 4, 5]); }
  S().current = { id: Date.now(), mode, qids, orders, ans: {}, idx: 0, start: Date.now(), limit: mode === "mock" ? MOCK_SEC : null, xp: 0 };
  G.combo = 0; save(); go("quiz");
}
function gradeAuto(q, ua) {
  if (q.t === "mc") return +ua === q.a ? "correct" : "wrong";
  if (q.t === "short") { const u = norm(ua); return u && [q.a, ...(q.acc || [])].some(a => norm(a) === u) ? "correct" : "wrong"; }
  return "pending";
}
function qHead(q, n) {
  return `<div class="row"><span class="qno">${n}</span><span class="tag ${q.t}">${kind(q)}</span>
    <span class="tag">${esc(UNITS[q.u].name)}</span><span class="spacer"></span><span class="small muted" aria-label="난이도 ${q.d}">${stars(q.d)}</span></div>`;
}
function qBody(q) {
  return (q.fig && FIGS[q.fig] ? `<figure class="fig">${FIGS[q.fig]()}</figure>` : "") + (q.ps ? `<div class="passage">${esc(q.ps)}</div>` : "") + `<div class="stem">${esc(q.q)}</div>` +
    (q.bg ? `<div class="bogi"><span class="bl">보기</span><ul>${q.bg.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "");
}
function answerInput(q, s, a) {
  const locked = a && a.r !== undefined && s.mode !== "mock";
  if (q.t === "mc") return `<div class="choices">${s.orders[q.id].map((orig, i) => `<button class="choice ${a && +a.ua === orig ? "sel" : ""}" data-v="${orig}" ${locked ? "disabled" : ""}>
      <span class="bubble">${i + 1}</span><span>${esc(q.c[orig - 1])}</span></button>`).join("")}</div>`;
  if (q.t === "short") return `<label class="small muted" for="ans">답</label><input class="answer" id="ans" autocomplete="off" value="${esc(a?.ua || "")}" ${locked ? "disabled" : ""} placeholder="낱말로 쓰세요">`;
  return `<label class="small muted" for="ans">답안</label><textarea class="answer" id="ans" ${locked ? "disabled" : ""} placeholder="조건에 맞게 문장으로 써 보세요">${esc(a?.ua || "")}</textarea>`;
}
function bindChoices(onPick) { $$(".choice").forEach(b => b.onclick = () => { $$(".choice").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); onPick(b.dataset.v); }); }
function answerText(q, ua, s) {
  if (!ua) return "(답 없음)";
  if (q.t === "mc") { const pos = s ? s.orders[q.id].indexOf(+ua) : +ua - 1; return `${NUM[pos] || ""} ${q.c[+ua - 1] || ""}`; }
  return ua;
}
function rightText(q, s) {
  if (q.t === "mc") { const pos = s ? s.orders[q.id].indexOf(q.a) : q.a - 1; return `${NUM[pos]} ${q.c[q.a - 1]}`; }
  return q.a;
}

function quiz() {
  const s = S().current;
  if (!s) return go("home");
  if (s.mode === "mock") return mockView(s);
  if (s.idx >= s.qids.length) return finish();
  const qid = s.qids[s.idx], q = QMAP[qid], a = s.ans[qid];
  app.innerHTML = `
  <div class="stack">
    <div class="progress"><div class="bar"><i style="width:${s.idx / s.qids.length * 100}%"></i></div>
      ${G.combo >= 2 ? `<span class="combo">${G.combo}연속</span>` : ""}<div class="count">${s.idx + 1} / ${s.qids.length}</div></div>
    <article class="sheet stack qcard" id="card" aria-live="polite">
      ${qHead(q, s.idx + 1)}${qBody(q)}${answerInput(q, s, a)}
      <div id="fb"></div>
      <div class="row" id="act"><span class="spacer"></span><button class="btn primary big" id="submit">제출</button></div>
    </article>
    <p class="small muted" style="margin:0">객관식은 키보드 숫자 1~5로도 고를 수 있어요.</p>
  </div>`;
  let picked = null;
  bindChoices(v => { picked = v; });
  const inp = $(".answer");
  if (inp && q.t === "short") inp.addEventListener("keydown", e => { if (e.key === "Enter") $("#submit")?.click(); });
  if (a && a.r !== undefined) return showFeedback(s, q, null);
  $("#submit").onclick = () => {
    const ua = q.t === "mc" ? picked : inp.value.trim();
    if (!ua) return toast(q.t === "mc" ? "답을 골라 주세요." : "답을 써 주세요.");
    const r = gradeAuto(q, ua);
    s.ans[qid] = { ua, r };
    let res = null;
    if (r !== "pending") { res = record(qid, r); s.xp += res.pts; }
    save(); showFeedback(s, q, res);
  };
}

const PRAISE = ["참 잘했어요", "훌륭해요", "정확해요", "멋져요"];
function feedbackHtml(q, a, res) {
  if (q.t === "essay" && a.r === "pending") {
    return `<div class="fb pending">
      <div><span class="mark">?</span> <b>모범답안·채점 기준과 비교해서 스스로 채점해 보세요</b></div>
      <dl class="kv"><dt>모범답안</dt><dd>${esc(q.a)}</dd><dt>채점 기준</dt><dd>${esc(q.rb)}</dd></dl>
      <div class="self" role="group" aria-label="스스로 채점"><button data-self="correct">O 다 썼어요</button><button data-self="partial">△ 일부만</button><button data-self="wrong">X 못 썼어요</button></div></div>`;
  }
  const head = a.r === "correct"
    ? `<span class="mark">O</span> <b>정답!</b> ${res ? `<span class="gain">+${res.pts}점</span>${res.combo >= 3 ? ` <span class="combo">${res.combo}연속 콤보 보너스!</span>` : ""}` : ""}`
    : a.r === "partial" ? `<span class="mark">△</span> <b>조금만 더!</b> ${res ? `<span class="gain">+${res.pts}점</span>` : ""}`
    : `<span class="mark">X</span> <b>아깝다!</b> <span class="small">오답노트에 저장했어요. 해설을 읽으면 다음엔 맞힐 수 있어요.</span> ${res ? `<span class="gain">+${res.pts} 도전 점수</span>` : ""}`;
  return `<div class="fb ${a.r}">
    <div>${head}</div>
    ${q.t !== "mc" ? `<dl class="kv"><dt>${q.t === "essay" ? "모범답안" : "정답"}</dt><dd>${esc(q.a)}</dd>
      ${q.t === "short" && q.acc?.length ? `<dt>인정 답</dt><dd>${esc(q.acc.join(", "))}</dd>` : ""}
      ${q.rb ? `<dt>채점 기준</dt><dd>${esc(q.rb)}</dd>` : ""}</dl>` : ""}
    <div><b>해설</b> ${esc(q.ex)}</div>
    ${a.r !== "correct" && noteLink(q) ? `<div class="row">${noteLink(q)}<span class="small muted">개념을 다시 보고 오면 기억에 더 오래 남아요.</span></div>` : ""}
    ${q.t === "short" && a.r === "wrong" && a.ua ? `<div><button class="btn small" id="accept">뜻이 같은 답이면 정답으로 바꾸기</button></div>` : ""}
  </div>`;
}
function showFeedback(s, q, res) {
  const a = s.ans[q.id];
  if (q.t === "mc") $$(".choice").forEach(b => {
    b.disabled = true;
    if (+b.dataset.v === q.a) b.classList.add("right"); else if (+b.dataset.v === +a.ua) b.classList.add("wrong");
  });
  else $(".answer").disabled = true;
  $("#fb").innerHTML = feedbackHtml(q, a, res);
  const card = $("#card");
  $$(".stamp", card).forEach(x => x.remove());
  if (res) {
    if (a.r === "correct") {
      card.insertAdjacentHTML("beforeend", `<div class="stamp" aria-hidden="true">${PRAISE[Math.floor(Math.random() * PRAISE.length)].replace(" ", "<br>")}</div>`);
      sfx("ok"); if (res.combo >= 3 && res.combo % 3 === 0) confetti();
    } else if (a.r === "wrong") { sfx("bad"); card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake"); }
    celebrate(res);
  } else if (a.r === "correct") card.insertAdjacentHTML("beforeend", `<div class="stamp" aria-hidden="true">참<br>잘했어요</div>`);
  $$("[data-self]").forEach(b => b.onclick = () => { a.r = b.dataset.self; const r2 = record(q.id, a.r); s.xp += r2.pts; save(); showFeedback(s, q, r2); });
  bindNoteLinks();
  const acc = $("#accept");
  if (acc) acc.onclick = () => {
    a.r = "correct";
    const log = S().log;
    for (let i = log.length - 1; i >= 0; i--) if (log[i].q === q.id) { log[i].r = "correct"; break; }
    const bonus = 10 + (q.d - 1) * 5 - 2; G.xp += bonus; addWeekXp(bonus); s.xp += bonus;
    save(); showFeedback(s, q, { pts: bonus, combo: G.combo, up: null, newB: checkBadges() }); toast("정답으로 바꿨어요.");
  };
  const last = s.idx === s.qids.length - 1;
  $("#act").innerHTML = a.r === "pending" ? "" : `<span class="spacer"></span><button class="btn primary big" id="next">${last ? "결과 보기" : "다음 문제"}</button>`;
  const nx = $("#next");
  if (nx) { nx.focus({ preventScroll: true }); nx.onclick = () => { s.idx++; save(); if (s.idx >= s.qids.length) finish(); else quiz(); window.scrollTo(0, 0); }; }
}

/* 모의고사 */
function mockView(s) {
  const n = s.qids.length;
  if (s.idx >= n) s.idx = n - 1;
  const qid = s.qids[s.idx], q = QMAP[qid];
  const done = s.qids.filter(id => (s.ans[id]?.ua || "").trim()).length;
  app.innerHTML = `
  <div class="stack">
    <div class="progress"><div class="bar"><i style="width:${done / n * 100}%"></i></div><span class="timer" id="timer"></span></div>
    <article class="sheet stack">
      ${qHead(q, s.idx + 1)}${qBody(q)}${answerInput(q, s, s.ans[qid])}
      <div class="row"><button class="btn" id="prev" ${s.idx === 0 ? "disabled" : ""}>이전</button><span class="spacer"></span>
        ${s.idx < n - 1 ? `<button class="btn primary" id="next">다음</button>` : ""}</div>
    </article>
    <section class="sheet stack">
      <div class="row"><b>답안지</b><span class="small muted">${done} / ${n} 작성</span></div>
      <div class="palette">${s.qids.map((id, i) => `<button class="${(s.ans[id]?.ua || "").trim() ? "done" : ""} ${i === s.idx ? "cur" : ""}" data-i="${i}" aria-label="${i + 1}번">${i + 1}</button>`).join("")}</div>
      <button class="btn primary big block" id="submit-all">제출하고 채점하기</button>
    </section>
  </div>`;
  const put = v => { s.ans[qid] = { ua: v }; save(); };
  bindChoices(v => { put(v); mockView(s); });
  const inp = $(".answer");
  if (inp) inp.addEventListener("input", () => put(inp.value));
  const moveTo = i => { s.idx = i; save(); mockView(s); window.scrollTo(0, 0); };
  $("#prev").onclick = () => moveTo(s.idx - 1);
  if ($("#next")) $("#next").onclick = () => moveTo(s.idx + 1);
  $$(".palette button").forEach(b => b.onclick = () => moveTo(+b.dataset.i));
  const sub = $("#submit-all");
  sub.onclick = () => {
    const left = n - s.qids.filter(id => (s.ans[id]?.ua || "").trim()).length;
    if (left && !sub.dataset.armed) { sub.dataset.armed = "1"; sub.textContent = `${left}문항이 비어 있어요. 한 번 더 누르면 제출`; return; }
    finish();
  };
  clearInterval(timerId);
  const el = $("#timer");
  const tick = () => {
    const left = Math.max(0, Math.round(s.limit - (Date.now() - s.start) / 1000));
    el.textContent = `${String(Math.floor(left / 60)).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`;
    el.classList.toggle("low", left <= 300);
    if (left <= 0) { clearInterval(timerId); toast("시간이 끝나서 자동으로 제출했어요."); finish(); }
  };
  tick(); timerId = setInterval(tick, 1000);
}

function finish() {
  clearInterval(timerId);
  const st = S(), s = st.current; if (!s) return go("home");
  const before = levelOf(G.xp), gotB = [];
  if (s.mode === "mock") {
    G.combo = 0;
    for (const id of s.qids) {
      const q = QMAP[id], ua = (s.ans[id]?.ua || "").trim();
      const r = q.t === "essay" ? (ua ? "pending" : "wrong") : gradeAuto(q, ua);
      s.ans[id] = { ua, r };
      if (r !== "pending") { const res = record(id, r); s.xp += res.pts; gotB.push(...res.newB); }
    }
  } else {
    for (const id of s.qids) if (!s.ans[id]) { s.ans[id] = { ua: "", r: "wrong" }; const res = record(id, "wrong"); s.xp += res.pts; }
  }
  s.end = Date.now();
  st.sessions.unshift(s); st.sessions = st.sessions.slice(0, 60);
  st.current = null; save(); pushScore(true); logSession(s);
  const up = levelOf(G.xp) > before ? levelOf(G.xp) : null;
  go("result", s.id);
  if (up != null || gotB.length) celebrate({ up, newB: gotB });
}

/* ═════════════ 결과 ═════════════ */
function sessScore(s) { return s.qids.reduce((a, id) => a + score(s.ans[id]?.r), 0); }
function result(sid) {
  const s = S().sessions.find(x => x.id === sid);
  if (!s) return go("home");
  const sc = sessScore(s), n = s.qids.length, hundred = Math.round(sc / n * 100);
  const notRight = s.qids.filter(id => s.ans[id]?.r !== "correct");
  const pending = s.qids.filter(id => s.ans[id]?.r === "pending").length;
  if (s.mode === "mock" && !pending) {
    const extra = []; if (hundred >= 80) extra.push("mock80"); if (hundred === 100) extra.push("mock100");
    const nb = checkBadges(extra); if (nb.length) { save(); celebrate({ up: null, newB: nb }); }
  }
  const msg = hundred >= 90 ? "완벽에 가까워요!" : hundred >= 70 ? "잘했어요! 틀린 것만 다시 보면 돼요." : hundred >= 50 ? "절반 넘게 맞혔어요. 오답을 정리해 봐요." : "해설을 읽고 다시 도전하면 쑥 올라요.";
  app.innerHTML = `
  <div class="stack">
    <section class="sheet score">
      <span class="label">${MODE[s.mode]} 결과</span>
      ${s.mode === "mock" ? `<div class="big"><em>${hundred}</em>점</div><div class="muted">${fmtScore(sc)} / ${n}문항</div>` : `<div class="big"><em>${fmtScore(sc)}</em> / ${n}</div>`}
      <div><b>${msg}</b></div>
      <div class="muted small">정답률 ${hundred}% · 걸린 시간 ${fmtDur(s.end - s.start)} · 이번에 얻은 점수 <span class="gain">+${s.xp || 0}</span></div>
      ${(rl => rl ? `<div class="small">${rl}</div>` : "")(SOLO ? null : rankLine())}
      ${pending ? `<div class="notice" style="margin-top:6px">서술형 ${pending}문항은 아래에서 모범답안과 비교해 스스로 채점해 주세요.</div>` : ""}
      <div class="row" style="justify-content:center;margin-top:8px">
        ${notRight.length ? `<button class="btn primary" id="retry">틀린 문제 다시 풀기 (${notRight.length})</button>` : ""}
        <button class="btn" id="to-wrong">오답노트</button><button class="btn" id="to-home">처음으로</button></div>
    </section>
    <div class="row"><b>문항별 결과</b><span class="spacer"></span>
      <label class="small row" style="gap:6px"><input type="checkbox" id="only-wrong"> 틀린 문제만</label></div>
    <div class="stack" id="items">${s.qids.map((id, i) => itemHtml(QMAP[id], s.ans[id], s, i + 1)).join("")}</div>
  </div>`;
  if (s.mode !== "mock" && hundred >= 90 && !pending) confetti();
  $("#to-home").onclick = () => go("home");
  $("#to-wrong").onclick = () => go("wrong");
  bindNoteLinks();
  if ($("#retry")) $("#retry").onclick = () => startSession("retry", shuffle(notRight));
  $("#only-wrong").onchange = e => $$(".item").forEach(el => el.hidden = e.target.checked && el.classList.contains("correct"));
  $$("[data-self]").forEach(b => b.onclick = () => {
    const id = b.closest("[data-q]").dataset.q;
    s.ans[id].r = b.dataset.self; const res = record(id, b.dataset.self, { silentCombo: true }); s.xp = (s.xp || 0) + res.pts; save();
    result(sid); celebrate(res);
  });
}
function itemHtml(q, a, s, n) {
  a = a || { r: "wrong", ua: "" };
  return `<article class="sheet item ${a.r} stack" data-q="${q.id}">
    <div class="row"><span class="ox ${a.r}">${MARK[a.r]}</span><b>${n}번</b><span class="tag ${q.t}">${kind(q)}</span><span class="tag">${esc(q.tag)}</span></div>
    ${qBody(q)}
    ${q.t === "mc" ? `<ol class="choice-list">${(s ? s.orders[q.id] : [1, 2, 3, 4, 5]).map((o, i) => `<li class="${o === q.a ? "ans" : ""}">${NUM[i]} ${esc(q.c[o - 1])}</li>`).join("")}</ol>` : ""}
    <dl class="kv"><dt>내 답</dt><dd>${esc(answerText(q, a.ua, s))}</dd><dt>${q.t === "essay" ? "모범답안" : "정답"}</dt><dd>${esc(rightText(q, s))}</dd>
      ${q.rb ? `<dt>채점 기준</dt><dd>${esc(q.rb)}</dd>` : ""}</dl>
    ${a.r === "pending" ? `<div class="self" role="group" aria-label="스스로 채점"><button data-self="correct">O 다 썼어요</button><button data-self="partial">△ 일부만</button><button data-self="wrong">X 못 썼어요</button></div>` : ""}
    <details ${a.r !== "correct" ? "open" : ""}><summary>해설</summary><p style="margin:0">${esc(q.ex)}</p></details>
    ${a.r !== "correct" && a.r !== "pending" && noteLink(q) ? `<div>${noteLink(q)}</div>` : ""}
  </article>`;
}

/* ═════════════ 오답노트 ═════════════ */
let showMastered = false;
function wrongView() {
  const list = wrongList(showMastered);
  const masteredN = wrongList(true).filter(w => w.mastered).length;
  app.innerHTML = `
  <div class="stack">
    <section class="hero"><span class="label">오답노트</span><h1>틀린 문제 모아 보기</h1>
      <p>연속 2번 맞히면 ‘졸업’해서 목록에서 빠져요. 지금까지 졸업한 문제: <b>${masteredN}개</b></p></section>
    <div class="row"><label class="small row" style="gap:6px"><input type="checkbox" id="mastered" ${showMastered ? "checked" : ""}> 졸업한 문제도 보기</label>
      <span class="spacer"></span><button class="btn primary" id="review" ${wrongList(false).length ? "" : "disabled"}>오답 복습 시작</button></div>
    ${list.length ? list.map(w => {
      const q = QMAP[w.id];
      return `<article class="sheet item ${w.mastered ? "correct" : "wrong"} stack">
        <div class="row"><span class="tag" style="color:var(--bad)">${w.wrong}번 틀림</span>
          ${w.mastered ? `<span class="tag" style="color:var(--ok)">졸업</span>` : w.streak ? `<span class="tag" style="color:var(--ok)">졸업까지 ${2 - w.streak}번</span>` : ""}
          <span class="tag ${q.t}">${kind(q)}</span><span class="tag">${esc(q.tag)}</span></div>
        ${qBody(q)}
        ${q.t === "mc" ? `<ol class="choice-list">${q.c.map((c, i) => `<li>${NUM[i]} ${esc(c)}</li>`).join("")}</ol>` : ""}
        <details><summary>정답과 해설</summary>
          <dl class="kv"><dt>정답</dt><dd>${esc(rightText(q))}</dd>${q.rb ? `<dt>채점 기준</dt><dd>${esc(q.rb)}</dd>` : ""}</dl>
          <p style="margin:8px 0 0">${esc(q.ex)}</p></details>
        ${w.mastered ? "" : noteLink(q) ? `<div>${noteLink(q)}</div>` : ""}
      </article>`;
    }).join("") : `<div class="sheet empty">틀린 문제가 없어요. 문제를 풀면 여기에 모여요.</div>`}
  </div>`;
  $("#mastered").onchange = e => { showMastered = e.target.checked; wrongView(); };
  bindNoteLinks();
  $("#review").onclick = () => { const w = wrongList(false); if (w.length) startSession("wrong", shuffle(w.slice(0, 20).map(x => x.id))); };
}

/* ═════════════ 기록 ═════════════ */
function records() {
  const us = Object.fromEntries(groupStats(q => q.u).map(s => [s.k, s]));
  const ks = groupStats(kind).sort((a, b) => a.rate - b.rate);
  const tags = groupStats(q => q.tag).sort((a, b) => a.rate - b.rate || b.n - a.n);
  const sess = S().sessions;
  app.innerHTML = `
  <div class="stack">
    <section class="hero"><span class="label">기록</span><h1>얼마나 알고 있을까</h1>
      <p>이 기기에서 푼 기록이에요. 부모님도 이 화면에서 확인할 수 있어요.</p></section>
    <section class="sheet stack"><h2 style="font-size:1.05rem">단원별 정답률</h2>
      <div class="scroll"><table><thead><tr><th>단원</th><th class="num">풀어 봄</th><th class="num">맞힘</th><th class="num">정답률</th><th></th></tr></thead><tbody>
      ${Object.entries(UNITS).map(([k, u]) => { const s = us[k]; const r = s ? s.rate : null;
        const pu = progressOf(subject).units[k];
        return `<tr><td>${u.big} ${esc(u.name)}</td><td class="num">${pu.tried}/${pu.total}</td><td class="num">${pu.right}</td><td class="num">${pct(r)}</td><td style="width:28%"><div class="meter"><i style="width:${r == null ? 0 : r * 100}%"></i></div></td></tr>`; }).join("")}
      </tbody></table></div></section>
    ${ks.length ? `<section class="sheet stack"><h2 style="font-size:1.05rem">문제 유형별 정답률</h2>
      <div class="scroll"><table><thead><tr><th>유형</th><th class="num">풀이</th><th class="num">정답률</th></tr></thead><tbody>
      ${ks.map(t => `<tr><td>${esc(t.k)}</td><td class="num">${t.n}</td><td class="num">${pct(t.rate)}</td></tr>`).join("")}</tbody></table></div></section>` : ""}
    ${tags.length ? `<section class="sheet stack"><h2 style="font-size:1.05rem">개념별 정답률 <span class="small muted">낮은 순</span></h2>
      <div class="scroll"><table><thead><tr><th>개념</th><th class="num">풀이</th><th class="num">정답률</th></tr></thead><tbody>
      ${tags.slice(0, 12).map(t => `<tr><td>${esc(t.k)}</td><td class="num">${t.n}</td><td class="num">${pct(t.rate)}</td></tr>`).join("")}</tbody></table></div></section>` : ""}
    <section class="sheet stack"><h2 style="font-size:1.05rem">회차별 점수</h2>
      ${sess.length ? `<div class="scroll"><table><thead><tr><th>날짜</th><th>종류</th><th class="num">점수</th><th class="num">시간</th><th></th></tr></thead><tbody>
      ${sess.map(s => `<tr><td>${fmtDate(s.start)}</td><td>${MODE[s.mode]}</td><td class="num"><b>${fmtScore(sessScore(s))}</b> / ${s.qids.length}</td><td class="num">${fmtDur(s.end - s.start)}</td>
        <td><button class="btn small" data-s="${s.id}">보기</button></td></tr>`).join("")}</tbody></table></div>` : `<p class="muted" style="margin:0">아직 끝낸 회차가 없어요.</p>`}</section>
    <div class="row"><span class="spacer"></span><button class="btn ghost small" id="reset" style="color:var(--bad)">${BANKS[subject].name} 기록 모두 지우기</button></div>
  </div>`;
  $$("[data-s]").forEach(b => b.onclick = () => go("result", +b.dataset.s));
  const r = $("#reset");
  r.onclick = () => {
    if (r.dataset.armed) { DB.subj[subject] = { log: [], sessions: [], current: null, exam: S().exam }; save(); toast(`${BANKS[subject].name} 기록을 지웠어요. 레벨과 도장은 그대로예요.`); records(); return; }
    r.dataset.armed = "1"; r.textContent = "정말 지울까요? 한 번 더 누르세요";
    setTimeout(() => { if (r.isConnected) { delete r.dataset.armed; r.textContent = `${BANKS[subject].name} 기록 모두 지우기`; } }, 3500);
  };
}

/* ═════════════ 도장판 ═════════════ */
function stamps() {
  const n = Object.keys(G.badges).length;
  app.innerHTML = `
  <div class="stack">
    <section class="hero"><span class="label">도장판</span><h1>${n}개의 도장을 모았어요</h1>
      <p>목표를 이루면 선생님 채점 도장처럼 쾅! 찍혀요. 남은 도장: ${BADGES.length - n}개</p></section>
    <section class="sheet"><div class="stamps">
      ${BADGES.map(b => { const got = G.badges[b.id];
        return `<div class="badge ${got ? "" : "locked"}"><div class="seal">${got ? b.seal.replace("\n", "<br>") : "?"}</div>
          <b>${esc(b.name)}</b><span>${esc(b.desc)}</span>${got ? `<span>${fmtDate(got)}</span>` : ""}</div>`; }).join("")}
    </div></section>
  </div>`;
}

/* 객관식 숫자키 1~5 */
document.addEventListener("keydown", e => {
  if (view !== "quiz" || e.target.matches("input, textarea")) return;
  const n = +e.key;
  if (n >= 1 && n <= 5) { const b = $$(".choice")[n - 1]; if (b && !b.disabled) b.click(); }
});

if (SOLO) $("#nav-rank").remove();
if (who) { checkBadges(); save(); }
render();
</script>
