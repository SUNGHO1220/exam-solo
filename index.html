<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#d2473f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='none' stroke='%23d2473f' stroke-width='6'/%3E%3Ctext x='32' y='42' font-size='28' text-anchor='middle' fill='%23d2473f' font-family='sans-serif' font-weight='bold'%3EO%3C/text%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>나만의 시험 연습장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root {
  --ground: #f3f5f8;
  --paper: #ffffff;
  --ink: #1d2433;
  --ink-soft: #5d6677;
  --line: #dfe3ea;
  --omr: #d2473f;          /* OMR 답안지·채점 도장의 붉은색 */
  --omr-tint: #fbeceb;
  --omr-line: #f0c3bf;
  --ok: #1d8a5a;
  --ok-tint: #e3f4ec;
  --warn: #b7791f;
  --warn-tint: #fbf1de;
  --bad: #c43a33;
  --bad-tint: #fbe7e5;
  --focus: #2d6cdf;
  --gold: #c8901a;
  --s-kor: #b5523b; --s-eng: #2e6fb0; --s-math: #6a4fb3; --s-soc: #d2473f; --s-sci: #1f8a6d; --s-eth: #9a6a1f;
  --display: "Black Han Sans", "IBM Plex Sans KR", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #151922; --paper: #1f2430; --ink: #e8ebf1; --ink-soft: #a1a9b8; --line: #343b4a;
    --omr: #f07a70; --omr-tint: #3a2527; --omr-line: #6b3a37;
    --ok: #5cc995; --ok-tint: #1c3429; --warn: #e4b35c; --warn-tint: #3a3020;
    --bad: #f07a70; --bad-tint: #3a2527; --focus: #7aa7ff; --gold: #e8b64a;
    --s-kor: #e08a74; --s-eng: #79a9e0; --s-math: #a893e6; --s-soc: #f07a70; --s-sci: #5cc9a6; --s-eth: #d9a65a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #151922; --paper: #1f2430; --ink: #e8ebf1; --ink-soft: #a1a9b8; --line: #343b4a;
  --omr: #f07a70; --omr-tint: #3a2527; --omr-line: #6b3a37;
  --ok: #5cc995; --ok-tint: #1c3429; --warn: #e4b35c; --warn-tint: #3a3020;
  --bad: #f07a70; --bad-tint: #3a2527; --focus: #7aa7ff; --gold: #e8b64a;
  --s-kor: #e08a74; --s-eng: #79a9e0; --s-math: #a893e6; --s-soc: #f07a70; --s-sci: #5cc9a6; --s-eth: #d9a65a;
}
* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.65; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 0 72px; }
.wrap > *, .stack > *, .sheet { min-width: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* 상단 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ground); display: flex; align-items: center; gap: 10px; padding-block: 12px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.brand { font-family: var(--display); font-size: 1.3rem; background: none; border: 0; padding: 0; white-space: nowrap; }
.brand .sub { color: var(--omr); }
.lvchip { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: .82rem; font-weight: 700; background: var(--paper); border: 1px solid var(--line); border-radius: 99px; padding: 4px 6px 4px 12px; white-space: nowrap; }
.lvchip .xpbar { width: 54px; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.lvchip .xpbar i { display: block; height: 100%; background: var(--gold); }
.whochip { border: 1px solid var(--line); background: var(--paper); border-radius: 99px; height: 38px; padding: 0 12px; font-weight: 700; font-size: .85rem; max-width: 7.5em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: none; }
.people { display: grid; gap: 10px; }
.person { display: flex; align-items: center; gap: 8px; background: var(--paper); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 8px 10px 8px 8px; }
.person.me { border-color: var(--omr); }
.person .pick { flex: 1; display: flex; align-items: center; gap: 12px; border: 0; background: none; text-align: left; min-height: 56px; padding: 0; min-width: 0; }
.avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--omr); color: #fff; display: grid; place-items: center; font-family: var(--display); font-size: 1.3rem; flex: none; }
.pinfo { display: grid; min-width: 0; }
.pinfo b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { border: 1px solid var(--line); background: var(--paper); border-radius: 99px; width: 38px; height: 38px; display: grid; place-items: center; font-size: .8rem; font-weight: 700; flex: none; }
.subnav { display: flex; gap: 4px; margin: -6px 0 16px; overflow-x: auto; }
.subnav button { border: 1px solid var(--line); background: var(--paper); padding: 6px 14px; border-radius: 99px; color: var(--ink-soft); font-weight: 500; min-height: 42px; white-space: nowrap; }
.subnav button.on { color: #fff; background: var(--omr); border-color: var(--omr); }

/* 공통 */
.sheet { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
.stack { display: grid; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.muted { color: var(--ink-soft); }
.small { font-size: .86rem; }
.label { font-size: .78rem; letter-spacing: .08em; color: var(--omr); font-weight: 700; }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 12px; padding: 10px 18px; min-height: 48px; font-weight: 500; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--omr); border-color: var(--omr); color: #fff; font-weight: 700; }
.btn.ghost { background: transparent; }
.btn.big { min-height: 58px; font-size: 1.08rem; padding-inline: 24px; }
.btn.block { width: 100%; }
.btn.small { min-height: 38px; padding: 4px 12px; font-size: .88rem; }
.spacer { flex: 1; }
.tag { display: inline-block; font-size: .76rem; font-weight: 700; padding: 2px 9px; border-radius: 99px; background: var(--ground); color: var(--ink-soft); border: 1px solid var(--line); white-space: nowrap; }
.tag.mc { color: var(--focus); }
.tag.short { color: var(--warn); }
.tag.essay { color: var(--omr); }
.tag.hard { color: var(--omr); border-color: var(--omr-line); }

/* 허브 */
.hero { display: grid; gap: 6px; padding-block: 6px 4px; }
.hero h1 { font-family: var(--display); font-size: clamp(1.7rem, 5.5vw, 2.3rem); font-weight: 400; line-height: 1.25; }
.hero p { margin: 0; color: var(--ink-soft); }
.player { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.medal { width: 76px; height: 76px; border-radius: 50%; border: 3px double var(--gold); display: grid; place-items: center; text-align: center; font-family: var(--display); color: var(--gold); line-height: 1.05; font-size: 1.05rem; }
.medal small { display: block; font-family: var(--body); font-size: .62rem; font-weight: 700; letter-spacing: .1em; }
.bigbar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bigbar i { display: block; height: 100%; background: var(--gold); transition: width .5s; }
.stats3 { display: flex; gap: 16px; flex-wrap: wrap; font-size: .86rem; color: var(--ink-soft); }
.stats3 b { color: var(--ink); font-variant-numeric: tabular-nums; }
.subjects { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.subj { border: 1.5px solid var(--line); background: var(--paper); border-radius: 18px; padding: 16px 12px; min-height: 132px; display: grid; justify-items: center; align-content: center; gap: 6px; text-align: center; position: relative; }
.subj .glyph { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-family: var(--display); font-size: 1.6rem; color: #fff; background: var(--c); }
.subj .nm { font-weight: 700; font-size: 1.05rem; }
.subj .st { font-size: .76rem; color: var(--ink-soft); }
.subj.open { border-color: var(--c); }
.subj.soon .glyph { opacity: .4; }
.subj .ribbon { position: absolute; top: 8px; right: 8px; font-size: .66rem; font-weight: 700; color: #fff; background: var(--c); padding: 1px 7px; border-radius: 99px; }

/* 과목 첫 화면 */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.tile b { display: block; font-family: var(--display); font-weight: 400; font-size: 1.55rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile span { font-size: .82rem; color: var(--ink-soft); }
.units { display: grid; gap: 8px; }
.unit { display: flex; gap: 12px; align-items: center; text-align: left; border: 1.5px solid var(--line); background: var(--paper); border-radius: 12px; padding: 10px 14px; min-height: 56px; width: 100%; }
.unit .roman { font-family: var(--display); color: var(--ink-soft); width: 1.6em; flex: none; }
.unit .nm { flex: 1; font-weight: 500; overflow-wrap: anywhere; }
.unit .pg { font-size: .78rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; text-align: right; }
.unit .box { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--line); flex: none; display: grid; place-items: center; font-size: .8rem; color: transparent; }
.unit.on { border-color: var(--omr); background: var(--omr-tint); }
.unit.on .box { background: var(--omr); border-color: var(--omr); color: #fff; }
.urow { display: flex; gap: 6px; align-items: stretch; }
.urow .unit { flex: 1; min-width: 0; }
.sumbtn { flex: none; width: 64px; border: 1.5px solid var(--line); background: var(--paper); border-radius: 12px; font-size: .8rem; font-weight: 700; line-height: 1.3; color: var(--ink-soft); padding: 4px; }
.sumbtn:hover { border-color: var(--ink-soft); color: var(--ink); }
/* 오늘 할 일 */
.dday { font-family: var(--display); font-size: .95rem; color: #fff; background: var(--omr); border-radius: 8px; padding: 1px 9px; line-height: 1.5; white-space: nowrap; }
.todos { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.todo { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; border: 1px solid var(--line); background: var(--ground); border-radius: 12px; padding: 10px 12px; }
.todo .ck { width: 24px; height: 24px; flex: none; border-radius: 7px; border: 2px solid var(--line); background: var(--paper); display: grid; place-items: center; font-size: .8rem; font-weight: 700; color: var(--omr); }
.todo.done .ck { background: var(--ok); border-color: var(--ok); color: #fff; }
.todo.done .tx b { text-decoration: line-through; color: var(--ink-soft); }
.todo .tx { flex: 1 1 200px; display: grid; min-width: 0; overflow-wrap: anywhere; }
.todo .acts { display: flex; gap: 6px; margin-left: auto; }
.todayrows { display: grid; gap: 6px; }
.todayrow { display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--line); background: var(--ground); border-radius: 12px; padding: 8px 12px; min-height: 52px; width: 100%; }
.todayrow .tx { flex: 1; min-width: 0; }
.glyph.sm { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-family: var(--display); color: #fff; background: var(--c); flex: none; }
/* 내용 요약 */
.nchips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.nchips button { flex: none; border: 1px solid var(--line); background: var(--paper); border-radius: 99px; padding: 6px 14px; min-height: 40px; font-size: .86rem; color: var(--ink-soft); white-space: nowrap; }
.nchips button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 700; }
.ncore { background: var(--paper); border: 1.5px solid var(--omr-line); border-left: 6px solid var(--omr); border-radius: var(--radius); padding: 14px 18px; display: grid; gap: 6px; justify-items: start; }
.ncore p { margin: 0; font-size: 1.05rem; }
.ncore b, .nlist b, .ntable b, .term .def b { color: var(--omr); }
.terms { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.term { display: grid; gap: 4px; align-content: start; text-align: left; border: 1px solid var(--line); background: var(--ground); border-radius: 12px; padding: 10px 14px; overflow-wrap: anywhere; }
.term > b { font-size: 1rem; }
.term .def { font-size: .92rem; }
.term .peek { display: none; font-size: .82rem; color: var(--ink-soft); }
.term.hid { min-height: 70px; }
.term.hid:not(.open) .def { display: none; }
.term.hid:not(.open) .peek { display: block; }
.term.hid.open { border-color: var(--ok); background: var(--ok-tint); }
.nlist { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.ntable td { vertical-align: top; overflow-wrap: anywhere; }
.ntable td:first-child { font-weight: 700; white-space: nowrap; }
.ntable.plain td:first-child { font-weight: 400; }
.ntable.plain td, .ntable.plain th { text-align: center; font-variant-numeric: tabular-nums; }
.ntrap { background: var(--warn-tint); border-radius: var(--radius); padding: 18px 20px; }
.ntrap h2::before { content: "!"; display: inline-grid; place-items: center; width: 1.3em; height: 1.3em; margin-right: 6px; border-radius: 50%; background: var(--warn); color: var(--paper); font-size: .85em; }
@media (max-width: 560px) {
  .urow { flex-direction: column; gap: 0; }
  .urow .unit { border-radius: 12px 12px 0 0; }
  .sumbtn { width: 100%; min-height: 40px; border-top: 0; border-radius: 0 0 12px 12px; font-size: .86rem; }
  .ntable td:first-child { white-space: normal; }
  .ntable { font-size: .86rem; }
  .ntable th, .ntable td { padding: 6px 7px; }
}
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--paper); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 10px 16px; min-height: 46px; font-weight: 500; font-variant-numeric: tabular-nums; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--ink); color: var(--paper); }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mode { text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: var(--radius); padding: 16px; min-height: 108px; display: grid; gap: 4px; align-content: start; }
.mode strong { font-size: 1.05rem; }
.mode span { font-size: .86rem; color: var(--ink-soft); }
.resume { border: 1.5px dashed var(--omr); background: var(--omr-tint); border-radius: var(--radius); padding: 14px 16px; }

/* 문제 */
.progress { display: flex; align-items: center; gap: 12px; }
.bar { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--omr); transition: width .25s; }
.count { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 4.5em; text-align: right; }
.combo { font-weight: 700; color: var(--omr); font-size: .9rem; white-space: nowrap; }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; padding: 4px 10px; border-radius: 8px; background: var(--paper); border: 1px solid var(--line); }
.timer.low { color: var(--bad); border-color: var(--bad); }
.qno { font-family: var(--display); font-size: 1.5rem; font-weight: 400; color: var(--omr); line-height: 1; }
.qcard { position: relative; }
.passage { border: 1px solid var(--line); background: var(--ground); border-radius: 10px; padding: 12px 14px; white-space: pre-wrap; font-size: .96rem; overflow-wrap: anywhere; }
.bogi { border: 1.5px solid var(--ink); border-radius: 8px; padding: 16px 14px 10px; position: relative; margin-top: 6px; }
.bogi .bl { position: absolute; top: -11px; left: 50%; transform: translateX(-50%); background: var(--paper); padding: 0 10px; font-weight: 700; font-size: .86rem; }
.bogi ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; font-size: .96rem; }
.stem { font-weight: 700; font-size: 1.08rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.choices { display: grid; gap: 8px; }
.choice { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; border: 1.5px solid var(--line); background: var(--paper); border-radius: 12px; padding: 12px 14px; min-height: 54px; }
.choice > span:last-child { min-width: 0; overflow-wrap: anywhere; }
.bubble { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--omr-line); color: var(--omr); display: grid; place-items: center; font-weight: 700; font-size: .9rem; font-variant-numeric: tabular-nums; margin-top: -1px; }
.choice.sel { border-color: var(--ink); }
.choice.sel .bubble { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.choice.right { border-color: var(--ok); background: var(--ok-tint); }
.choice.right .bubble { background: var(--ok); border-color: var(--ok); color: #fff; }
.choice.wrong { border-color: var(--bad); background: var(--bad-tint); }
.choice.wrong .bubble { background: var(--bad); border-color: var(--bad); color: #fff; }
.choice:disabled { cursor: default; }
input.answer, textarea.answer { width: 100%; font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 52px; }
textarea.answer { min-height: 140px; resize: vertical; }
.fb { border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; position: relative; }
.fb.correct { background: var(--ok-tint); }
.fb.wrong { background: var(--bad-tint); }
.fb.partial, .fb.pending { background: var(--warn-tint); }
.fb .mark { font-family: var(--display); font-size: 1.5rem; font-weight: 400; line-height: 1; }
.fb.correct .mark { color: var(--ok); }
.fb.wrong .mark { color: var(--bad); }
.fb.partial .mark, .fb.pending .mark { color: var(--warn); }
.gain { font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: .95rem; margin: 0; }
.kv dt { color: var(--ink-soft); font-weight: 500; }
.kv dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.self { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.self button { border: 1.5px solid var(--line); background: var(--paper); border-radius: 12px; min-height: 52px; font-weight: 700; }
.palette { display: flex; flex-wrap: wrap; gap: 6px; }
.palette button { width: 42px; height: 42px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--paper); font-variant-numeric: tabular-nums; font-weight: 500; }
.palette button.done { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.palette button.cur { outline: 3px solid var(--omr); outline-offset: 1px; }

/* 채점 도장 · 효과 */
.stamp { position: absolute; top: -18px; right: 10px; width: 92px; height: 92px; border-radius: 50%; border: 3px solid var(--omr); color: var(--omr); display: grid; place-items: center; text-align: center; font-family: var(--display); font-size: .8rem; line-height: 1.2; padding: 10px; word-break: keep-all; transform: rotate(-14deg); background: color-mix(in srgb, var(--paper) 70%, transparent); animation: stampIn .38s cubic-bezier(.2, 1.6, .4, 1) both; pointer-events: none; }
.stamp::before { content: ""; position: absolute; inset: 5px; border-radius: 50%; border: 1.5px solid var(--omr); }
@keyframes stampIn { from { transform: rotate(-14deg) scale(2.2); opacity: 0; } to { transform: rotate(-14deg) scale(1); opacity: .92; } }
.shake { animation: shake .42s; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
.confetti i { position: absolute; width: 9px; height: 13px; border-radius: 2px; animation: fall 1.1s ease-out forwards; }
@keyframes fall { from { transform: translate(0, 0) rotate(0); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; } }

  q:"개인이 수행해야 하는 다양한 역할들이 서로 충돌하여, 어떤 역할을 우선적으로 수행해야 할지 갈등을 겪는 것을 무엇이라고 하는지 쓰시오.",
  a:"역할 갈등", acc:["역할갈등"],
  ex:"(교과서 134쪽)" },
{ id:"B23", u:"B", p:"134", t:"mc", d:2, tag:"역할 갈등",
  ps:"소방관인 김 씨는 오늘 딸의 초등학교 졸업식에 꼭 가겠다고 약속했다. 그런데 출근길에 큰 화재가 일어나 모든 대원은 즉시 출동하라는 연락을 받았다.",
  q:"김 씨가 처한 상황에 대한 설명으로 가장 적절한 것은?",
  c:["두 귀속 지위 사이에서 생긴 편견이다.","소방관이라는 지위와 아버지라는 지위에 따른 역할이 서로 충돌하는 역할 갈등이다.","사회화가 제대로 이루어지지 않아 생긴 문제이다.","한 가지 지위만 가진 사람에게 나타나는 문제이다.","역할 갈등은 개인이 해결할 수 없으므로 고민할 필요가 없다."], a:2,
  ex:"여러 지위에 따른 역할이 동시에 충돌해 어떤 역할을 먼저 할지 갈등하는 것이 역할 갈등이다. 원인을 파악하고 우선순위를 따져 중요한 것부터 수행해야 한다. (교과서 134쪽)" },
{ id:"B9", u:"B", p:"134", t:"mc", d:2, tag:"역할 갈등 대응",
  q:"역할 갈등을 원만하게 해결하는 방법으로 적절하지 않은 것은?",
  c:["갈등의 원인이 무엇인지 명확히 한다.","여러 역할 중 우선순위를 고려한다.","중요하지 않은 역할부터 먼저 수행한다.","관련된 사람들과 충분히 대화하여 이해를 구한다.","많은 사람이 공통으로 겪는 역할 갈등은 사회 제도를 마련해 해결한다."], a:3,
  ex:"우선순위를 고려하여 ‘중요한 것부터’ 수행해야 한다. (교과서 134~135쪽)" },
{ id:"B24", u:"B", p:"134", t:"mc", d:3, tag:"역할 갈등 대응", fixed:true,
  q:"역할 갈등에 대한 대응 방안 중 ‘개인적 차원’의 방안만을 〈보기〉에서 고른 것은?",
  bg:["ㄱ. 갈등의 원인이 무엇인지 명확히 한다.","ㄴ. 직장 내 보육 시설을 늘린다.","ㄷ. 여러 역할의 우선순위를 따져 중요한 것부터 수행한다.","ㄹ. 일하는 부모를 위한 돌봄 제도를 만든다."],
  c:BG4, a:2,
  ex:"ㄱ, ㄷ은 개인이 할 수 있는 대응이다. ㄴ, ㄹ처럼 많은 사람이 비슷한 역할 갈등을 겪을 때는 사회적 차원의 제도 마련이 필요하다. (교과서 134쪽)" },
{ id:"B10", u:"B", p:"134", t:"mc", d:2, tag:"역할 갈등 대응",
  q:"육아와 직장 일을 함께 해야 하는 많은 부모가 겪는 역할 갈등을 해결하기 위한 ‘사회적 차원’의 노력으로 가장 적절한 것은?",
  c:["직장 내 보육 시설을 늘린다.","한 사람이 하나의 지위만 갖도록 법으로 정한다.","각자 알아서 해결하도록 둔다.","부모가 직장을 그만두도록 권한다.","자녀 돌봄을 모두 조부모에게 맡기도록 한다."], a:1,
  ex:"여러 사람이 비슷한 역할 갈등을 겪으면 직장 내 보육 시설 확충 같은 사회적 제도가 필요하다. (교과서 134쪽)" },
{ id:"B11", u:"B", p:"134", t:"mc", d:2, tag:"역할 갈등",
  q:"역할 갈등에 대한 설명으로 옳은 것은?",
  c:["일부 특정 개인에게만 나타나는 현상이다.","사회가 복잡해질수록 역할 갈등은 줄어든다.","한 사람이 가진 여러 역할이 서로 충돌할 때 나타난다.","원만하게 해결하지 못해도 사회적 관계에는 영향이 없다.","한 가지 지위만 가진 사람에게 주로 나타난다."], a:3,
  ex:"사회가 복잡해지며 사람들은 많은 지위를 갖게 되었고 그만큼 역할 갈등도 많아졌다. 해결하지 못하면 심리적 불안과 관계 악화가 생길 수 있다. (교과서 134쪽)" },
{ id:"B12", u:"B", p:"143", t:"mc", d:3, tag:"사회적 지위와 역할",
  ps:"대학교수인 ○○ 씨는 자신의 전문 분야에 관한 생방송 온라인 인터뷰 중에 두 자녀가 놀아 달라며 방으로 들어오자 당황하였다.",
  q:"○○ 씨가 이 상황에서 가진 사회적 지위와 그에 따른 역할을 옳게 연결한 것은?",
  c:["대학교수 - 자녀 돌보기","아버지 - 전문 분야에 관한 인터뷰하기","대학교수 - 전문 분야에 관한 인터뷰하기","아버지 - 학생 가르치기","대학교수 - 가족과 놀아 주기"], a:3,
  ex:"‘대학교수’에는 전문 분야 활동이, ‘아버지’에는 자녀를 돌보는 역할이 기대된다. (교과서 143쪽)" },
{ id:"B25", u:"B", p:"134-135", t:"essay", d:3, tag:"역할 갈등 대응",
  ps:"“나는 학교 합창단 단장이야. 그런데 합창 대회 전 마지막 연습 날이 사촌 동생 돌잔치와 겹쳤어. 어떻게 하지?”",
  q:"(1) 이 학생의 상황을 ‘지위’와 ‘역할’이라는 낱말을 넣어 설명하고, (2) 개인적 차원에서 할 수 있는 대응 방안을 서술하시오.",
  a:"(1) 합창단 단장이라는 지위에 따라 마지막 연습에 참여해야 하는 역할과, 사촌(가족)이라는 지위에 따라 돌잔치에 참석해야 하는 역할이 충돌하는 역할 갈등을 겪고 있다.\n(2) 갈등의 원인을 명확히 하고, 여러 역할의 우선순위를 따져 중요한 것부터 수행한다. 참석하지 못하는 쪽에는 사정을 설명해 이해를 구한다.",
  rb:"① 두 지위와 각각의 역할이 충돌한다는 설명 (역할 갈등)\n② 원인 파악, 우선순위를 따져 중요한 것부터 수행\n③ (더 좋음) 관련된 사람과 대화하여 이해 구하기",
  ex:"(교과서 134~135쪽)" },

{ id:"C1", u:"C", p:"137", t:"mc", d:1, tag:"내집단과 외집단",
  q:"자신이 그 집단에 속해 있으면서 소속감과 안정감을 느끼는 집단을 무엇이라고 하는가?",

{ id:"C24", u:"C", p:"137", t:"mc", d:3, tag:"편견과 차별",
  ps:"체육 대회 날, 3반 학생들은 우리 반을 목이 터져라 응원하며 뿌듯함을 느꼈다. 결승에서 5반과 만나자 3반 몇몇 학생들 사이에서 “5반은 원래 반칙을 잘해.”라는 말이 돌았다. 하지만 5반이 반칙을 한 적은 한 번도 없었다.",
  q:"이 사례에 대한 설명으로 옳은 것은?",
  c:["3반 학생들에게 3반은 외집단이다.","3반 학생들에게 5반은 내집단이다.","“5반은 원래 반칙을 잘해.”는 부족한 정보로 판단한 편견이다.","사람들은 보통 외집단 구성원에게 더 긍정적인 감정을 느낀다.","편견은 차별로 이어질 가능성이 전혀 없다."], a:3,
  ex:"3반 학생에게 3반은 내집단, 5반은 외집단이다. 외집단을 부족한 정보로 판단하면서 편견이 생기고, 편견은 차별로 이어지기 쉽다. (교과서 137쪽)" },
{ id:"C3", u:"C", p:"137", t:"mc", d:2, tag:"편견과 차별",
  q:"편견과 차별에 대한 설명으로 옳은 것은?",
  c:["편견은 충분한 정보를 바탕으로 한 공정한 생각이다.","사람들은 내집단보다 외집단 구성원에게 더 긍정적인 감정을 느낀다.","부족한 정보로 외집단 구성원을 판단하는 과정에서 편견이 생기기도 한다.","편견과 차별은 서로 아무 관련이 없다.","차별은 그 사람의 능력이 부족할 때에만 나타난다."], a:3,
  ex:"부정적인 편견은 그 집단에 속한다는 이유만으로 개인을 부당하게 대우하는 차별로 이어질 수 있다. (교과서 137쪽)" },
{ id:"C4", u:"C", p:"137", t:"short", d:1, tag:"편견과 차별",
  q:"어떤 사회 집단에 속한다는 이유만으로 어떤 개인을 부정적으로 평가하며 부당하게 대우하는 것을 무엇이라고 하는지 쓰시오.",
  a:"차별", acc:[],
  ex:"(교과서 137쪽)" },
{ id:"C5", u:"C", p:"137", t:"mc", d:2, tag:"편견과 차별",
  ps:"인형을 만드는 ‘○○ 회사’는 과거에 금발과 파란 눈의 백인 인형만 만들어 왔다. 그러나 비판을 받은 뒤 휠체어에 앉아 있는 인형, 의족을 한 인형, 다양한 인종의 인형 등을 만들었다.",
  q:"○○ 회사가 이러한 노력을 한 까닭으로 가장 적절한 것은?",
  c:["인형 제작 비용을 줄이기 위해","‘백인만 아름답다’는 편견을 줄이고 다양성을 존중하게 하기 위해","특정 인종의 인형만 많이 팔기 위해","전통 인형 문화를 지키기 위해","다른 나라 회사를 그대로 따라 하기 위해"], a:2,
  ex:"다양한 인형은 세상에 다양한 사람이 있고 각자 매력적이라는 것을 알려 준다. (교과서 137쪽)" },
{ id:"C21", u:"C", p:"137-138", t:"mc", d:2, tag:"사회적 갈등", fixed:true,
  q:"갈등과 차별에 대한 설명으로 옳은 것만을 〈보기〉에서 고른 것은?",
  bg:["ㄱ. 구성원을 차별하는 행위는 구성원 간 신뢰를 강화한다.","ㄴ. 어떤 집단에 대한 부정적인 편견은 차별로 이어지기 쉽다.","ㄷ. 사회는 갈등을 합리적으로 조정하고 해결하는 과정에서 발전한다.","ㄹ. 우리 사회의 차별 문제는 외국인에게만 나타난다."],
  c:BG4, a:3,
  ex:"ㄱ. 차별은 신뢰를 약화하고 소통을 어렵게 한다. ㄹ. 외국인 차별, 성차별, 장애인 차별, 지역 차별 등 다양한 차별이 있다. (교과서 137~138쪽)" },
{ id:"C6", u:"C", p:"138", t:"mc", d:2, tag:"사회적 갈등",
  q:"우리 사회의 갈등에 대한 설명으로 가장 적절한 것은?",
  c:["갈등은 어떤 경우에도 사회 발전을 막는다.","여러 집단은 서로 다른 가치를 추구하거나 경쟁하는 과정에서 갈등을 겪을 수 있다.","갈등은 같은 사회 안에서는 생기지 않는다.","차별로 인한 갈등은 구성원 간 신뢰를 높인다.","갈등을 조정하는 과정은 사회에 필요 없다."], a:2,
  ex:"사회는 갈등을 합리적으로 조정·해결하는 과정에서 발전한다. (교과서 138쪽)" },
{ id:"C7", u:"C", p:"138", t:"mc", d:2, tag:"차별 사례",
  q:"다음 중 우리 사회에서 나타나는 차별의 사례로 보기 어려운 것은?",

{ id:"C8", u:"C", p:"138", t:"short", d:2, tag:"편견과 차별",
  q:"잘 변하지 않는 의식, 혹은 어떤 집단의 사람들에 대한 지나치게 일반화된 생각을 무엇이라고 하는지 쓰시오.",
  a:"고정 관념", acc:["고정관념"],

{ id:"C25", u:"C", p:"138", t:"mc", d:2, tag:"편견과 차별",

  ex:"성 역할에 대한 편견이나 잘못된 고정 관념은 성차별로 나타나기도 하고, 성별 갈등을 조장해 사회 혼란을 일으킬 수 있다. (교과서 138쪽)" },
{ id:"C9", u:"C", p:"138", t:"mc", d:2, tag:"편견과 차별",

  q:"이 사례가 보여 주는 사실로 가장 적절한 것은?",
  c:["편견과 차별이 나타나는 곳에서는 누구도 자유와 안전을 보장받기 어렵다.","차별은 우리나라 사람과는 관계없는 문제이다.","감염병은 차별을 줄이는 계기가 된다.","해외에서는 인종 차별이 일어나지 않는다.","편견은 외국에 나가면 저절로 사라진다."], a:1,

{ id:"C23", u:"C", p:"138-140", t:"mc", d:2, tag:"차별 사례",
  ps:"○○ 씨는 한 회사의 서류 전형에 합격했지만, 회사는 뒤늦게 ○○ 씨가 청각 장애인이라는 것을 알고 면접 기회를 주지 않았다. ○○ 씨는 보청기를 사용해 업무에 전혀 지장이 없다고 설명하였다.",

  c:["능력이 부족한 지원자를 걸러 낸 정당한 결정이다.","장애가 있다는 이유만으로 부당하게 대우한 장애인 차별이다.","한 사람의 여러 역할이 충돌한 역할 갈등의 사례이다.","다른 나라 문화를 동경하는 문화 사대주의의 사례이다.","회사 내부의 일이므로 시민이 관심을 가질 필요가 없다."], a:2,

{ id:"C12", u:"C", p:"139", t:"mc", d:2, tag:"시민의 자질",

{ id:"C13", u:"C", p:"139", t:"essay", d:2, tag:"시민의 자질",

{ id:"C26", u:"C", p:"138-139", t:"essay", d:3, tag:"사회적 갈등",

  c:["민속춤의 표현이 제각기 다른 것은 문화의 보편성을 보여 준다.","어느 사회에나 민속춤이 있는 것은 문화의 특수성을 보여 준다.","요즘 강강술래를 추는 모습을 보기 어려워진 것은 문화의 축적성과 관련된다.","그 사회 구성원들이 함께 민속춤을 즐기고 동작을 맞출 수 있는 것은 문화의 공유성과 관련된다.","민속춤은 각 지역의 환경이나 생활과 관련이 없다."], a:4,

{ id:"D24", u:"D", p:"149", t:"mc", d:2, tag:"문화의 속성",
  ps:"우리나라에서는 예로부터 머리를 숙여 인사해 왔다. 그런데 서양에서 전해진 악수로 인사하는 사람도 많아졌고, 인터넷이 발달하면서 새로운 인사말과 온라인 인사 예절도 생겨났다.",

{ id:"D23", u:"D", p:"149-150", t:"mc", d:3, tag:"문화의 속성", fixed:true,
  ps:"(가) 김치는 맛이 강해 처음엔 먹기 힘들지만, 어릴 때부터 먹다 보면 즐기게 된다.\n(나) 겨울이 오기 전 우리나라의 많은 가정에서 김장을 한다.\n(다) 아파트에서는 김치를 땅에 묻을 수 없어 김치냉장고를 쓰게 되었다.\n(라) 김치 담그는 법이 문헌에 기록되어 전해지고, 이를 바탕으로 새로운 김치도 나오고 있다.",
  q:"(가)~(라)와 가장 관련 깊은 문화의 속성을 옳게 연결한 것은?",
  c:["(가) - 공유성","(나) - 학습성","(다) - 전체성(총체성)","(라) - 변동성","(가) - 축적성"], a:3,
  ex:"(가) 학습성, (나) 공유성, (다) 주거 형태 변화가 보관 방식 변화로 이어졌으므로 전체성, (라) 축적성이다. (교과서 149~150쪽)" },
{ id:"D11", u:"D", p:"150", t:"mc", d:3, tag:"문화의 속성",
  q:"아파트에서는 김치를 땅에 묻어 보관할 수 없어 김치냉장고를 사용하게 되었다. 이처럼 주거 형태의 변화가 음식 보관 방식의 변화로 이어진 것과 가장 관련 깊은 문화의 속성은?",
  c:["공유성","학습성","축적성","전체성(총체성)","보편성"], a:4,
  ex:"문화 요소들은 서로 연결되어 있어 한 부분이 변하면 다른 부분도 변한다. (교과서 149~150쪽)" },
{ id:"D12", u:"D", p:"150", t:"mc", d:2, tag:"문화의 속성",
  q:"김치 담그는 법이 오래전부터 문헌에 기록되어 전해 내려왔고, 이 기록을 토대로 새로운 김치도 등장하고 있다. 이와 가장 관련 깊은 문화의 속성은?",

{ id:"D13", u:"D", p:"150", t:"mc", d:2, tag:"문화의 속성",

{ id:"D14", u:"D", p:"148-149", t:"mc", d:3, tag:"문화의 속성",
  q:"문화의 특징과 속성에 대한 설명으로 옳은 것은?",
  c:["보편성과 특수성은 문화의 다섯 가지 속성에 포함된다.","문화는 공유성, 학습성, 축적성, 변동성, 전체성의 속성을 지닌다.","문화의 각 속성은 서로 관련 없이 따로따로 나타난다.","문화는 한번 형성되면 절대 변하지 않는다.","문화의 특수성은 모든 사회의 문화에 공통된 특성이 나타나는 것이다."], a:2,
  ex:"보편성·특수성은 ‘특징’, 공유성 등 다섯 가지는 ‘속성’이다. 속성들은 서로 긴밀하게 연결되어 있다. (교과서 148~149쪽)" },
{ id:"D15", u:"D", p:"147", t:"essay", d:2, tag:"문화의 의미",

  rb:"① 네 낱말을 모두 사용\n② ‘구성원이 환경에 적응하며 공유한 생활양식’이라는 뜻이 드러남",

{ id:"D26", u:"D", p:"148, 150", t:"essay", d:3, tag:"문화의 보편성과 특수성",
  ps:"“채소를 절여 발효한 음식이 여러 나라에 있습니다. 독일에는 사우어크라우트, 미국에는 피클, 우리나라에는 김치가 있죠.”",
  q:"윗글에서 알 수 있는 문화의 특징 두 가지를 근거를 들어 서술하시오.",
  a:"여러 나라에 채소를 절여 발효한 음식이 있다는 점에서 모든 사회의 문화에 공통된 특성이 나타나는 문화의 보편성을 알 수 있다. 그러나 음식의 이름과 만드는 방식이 나라마다 다르다는 점에서 각 사회의 문화가 고유한 특성을 지니는 문화의 특수성을 알 수 있다.",
  rb:"① 보편성 + 근거(여러 나라에 채소 발효 음식이 있음)\n② 특수성 + 근거(이름·방식이 나라마다 다름)",

  c:["정보의 생산자가 될 수 없게 된다.","제한된 정보만 얻게 되어 편향된 관점을 가질 수 있다.","미디어를 전혀 이용할 수 없게 된다.","문화의 보편성이 사라진다.","광고가 모두 사라진다."], a:2,

/* 입자 모형 상자 */
function particleBox(x, y, kind, label) {
  const w = 104, h = 92; let s = `<rect class="box" x="${x}" y="${y}" width="${w}" height="${h}" rx="6"/>`;
  const dot = (cx, cy) => { s += `<circle class="pt" cx="${x + cx}" cy="${y + cy}" r="7"/>`; };
  if (kind === "solid") { for (let r = 0; r < 4; r++) for (let c = 0; c < 5; c++) dot(18 + c * 17, 30 + r * 17); }
  if (kind === "liquid") { [[16,76],[31,72],[46,77],[61,73],[76,76],[90,72],[22,60],[38,58],[54,61],[70,57],[86,60],[30,44],[62,45]].forEach(([a, b]) => dot(a, b)); }
  if (kind === "gas") {
    [[20,22,1,1],[78,18,-1,1],[50,48,1,-1],[16,74,1,-1],[86,70,-1,-1]].forEach(([a, b, dx, dy]) => {
      dot(a, b); s += `<line class="mv" x1="${x + a + dx * 9}" y1="${y + b + dy * 9}" x2="${x + a + dx * 18}" y2="${y + b + dy * 18}" marker-end="url(#ah)"/>`;
    });
  }
  s += `<text x="${x + w / 2}" y="${y + h + 20}" text-anchor="middle" class="lbl">${label}</text>`;
  return s;
}

function flask(x, y, level, liquidLabel) {

  s += `<rect class="wat" x="${x - 3}" y="${top + 64 - level}" width="6" height="${level + 24}"/>`;
  s += `<path class="ln" d="M${x - 12},${neck} L${x - 12},${neck + 24} L${x - 46},${base} L${x + 46},${base} L${x + 12},${neck + 24} L${x + 12},${neck}"/>`;
  s += `<rect class="ln" x="${x - 13}" y="${neck - 6}" width="26" height="10" rx="2"/>`;
  s += `<rect class="ln" x="${x - 4}" y="${top - 30}" width="8" height="${neck - top + 70}"/>`;
  if (liquidLabel) s += `<text x="${x}" y="${base - 12}" text-anchor="middle">${liquidLabel}</text>`;
  return s;
}

}

  c:["열팽창 정도가 작다 - 물의 비열이 크다","열팽창 정도가 크다 - 물의 비열이 작다","비열이 크다 - 물의 열팽창 정도가 크다","비열이 작다 - 물의 열팽창 정도가 작다","열팽창 정도가 작다 - 물의 비열이 작다"], a:1,

{ id:"C6", u:"C", p:"102", t:"mc", d:3, tag:"열팽창 활용",
  ps:"일반 유리로 만든 컵에 갑자기 뜨거운 물을 부으면 컵이 깨지는 경우가 있다. 내열 유리는 일반 유리보다 열팽창 정도가 작다.",

  c:["컵의 안쪽은 많이 팽창하고 바깥쪽은 조금 팽창하기 때문이다.","유리의 비열이 매우 커서 온도가 변하지 않기 때문이다.","뜨거운 물을 부으면 유리 입자의 크기가 커지기 때문이다.","유리가 열을 받으면 부피가 줄어들기 때문이다.","유리컵 안팎의 온도가 같아지기 때문이다."], a:1,

{ id:"C7", u:"C", p:"99", t:"mc", d:2, tag:"열팽창 활용",

  c:["치아와 열팽창 정도가 비슷한 재료","치아보다 열팽창 정도가 훨씬 큰 재료","비열이 가장 작은 재료","입 안에서 쉽게 증발하는 재료","열을 전혀 전달하지 않는 재료"], a:1,
  ex:"뜨겁고 찬 음식에 따라 입 안 온도가 크게 변하므로, 열팽창 정도가 다르면 충전재가 빠지거나 금이 갈 수 있다. (교과서 99쪽)" },
{ id:"C8", u:"C", p:"102", t:"essay", d:3, tag:"열팽창 활용",

{ id:"D3", u:"D", p:"101", t:"mc", d:2, tag:"열의 이동 방식",
  ps:"난로에 의해 데워진 공기가 이동하면서 방 전체가 골고루 따뜻해진다.",

{ id:"D4", u:"D", p:"102", t:"mc", d:3, tag:"열의 이동 방식", fixed:true,

  q:"(가)~(다)에서 주로 이용한 열의 이동 방식을 순서대로 옳게 짝지은 것은?",

  ex:"구들장과 방바닥이 데워지는 것은 전도, 공기가 흐르는 것은 대류, 햇빛이 비치는 범위를 조절하는 것은 복사이다. (교과서 102쪽)" },
{ id:"D5", u:"D", p:"99", t:"short", d:1, tag:"열의 이동 방식",

  a:"전도", acc:[],
  ex:"(교과서 99쪽)" },
{ id:"D6", u:"D", p:"103", t:"mc", d:2, tag:"비열 활용",

{ id:"E8", u:"E", p:"144", t:"essay", d:3, tag:"증발과 확산의 예",

{ id:"F1", u:"F", p:"116-117", t:"mc", d:2, tag:"입자 모형", fig:"particles",
  q:"그림은 물질의 세 가지 상태를 입자 모형으로 나타낸 것이다. 이에 대한 설명으로 옳은 것은?",
  c:["(가)는 담는 그릇에 따라 모양은 변하지만 부피는 일정하다.","(나)는 입자 배열이 규칙적이다.","(다)는 입자 운동이 가장 활발하다.","(나)는 압력을 가해도 부피가 거의 변하지 않는다.","(다)는 담는 그릇에 따라 모양이 달라진다."], a:1,
  ex:"(가)는 액체, (나)는 기체, (다)는 고체이다. 기체는 압력을 가하면 부피가 쉽게 변하고, 고체는 모양과 부피가 일정하다. (교과서 116~117쪽)" },
{ id:"F2", u:"F", p:"116", t:"mc", d:1, tag:"고체·액체·기체",
  q:"고체 상태의 물질에 대한 설명으로 옳은 것은?",
  c:["입자 배열이 불규칙적이다.","입자가 거의 운동하지 않는다.","입자 사이의 거리가 매우 멀다.","담는 그릇에 따라 모양이 달라진다.","압력을 가하면 부피가 쉽게 변한다."], a:2,
  ex:"고체는 입자 운동이 거의 없고, 배열이 규칙적이며, 입자 사이의 거리가 매우 가깝다. (교과서 116쪽)" },
{ id:"F3", u:"F", p:"116-117", t:"mc", d:3, tag:"고체·액체·기체", fig:"flowchart", fixed:true,
  q:"그림은 물질의 상태를 분류하는 방법이다. 이에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
  bg:["ㄱ. 우유, 간장, 물은 (나)에 해당한다.","ㄴ. (가)는 입자 배열이 매우 불규칙적이다.","ㄷ. (다)는 입자 사이의 거리가 가장 가깝다."],
  c:BG5, a:5,
  ex:"(가)는 기체, (나)는 액체, (다)는 고체이다. (교과서 116~117쪽)" },
{ id:"F4", u:"F", p:"116", t:"mc", d:3, tag:"고체·액체·기체",
  q:"모래는 그릇에 따라 담긴 모양이 달라지고 쏟으면 흘러내리지만 고체로 분류한다. 그 까닭으로 가장 적절한 것은?",
  c:["모래 알갱이 하나하나는 모양과 부피가 일정하기 때문이다.","모래 입자는 운동이 매우 활발하기 때문이다.","모래는 압력을 가하면 부피가 쉽게 줄어들기 때문이다.","모래 입자 사이의 거리가 매우 멀기 때문이다.","모래는 물에 녹기 때문이다."], a:1,
  ex:"가루 물질은 전체 모양이 변해 보여도 알갱이 하나하나의 모양과 부피가 일정한 고체이다. (교과서 116쪽)" },
{ id:"F5", u:"F", p:"116", t:"short", d:2, tag:"고체·액체·기체",
  q:"입자의 운동이 비교적 자유롭고, 입자 배열이 불규칙적이며, 입자 사이의 거리가 고체보다 조금 더 먼 물질의 상태를 쓰시오.",
  a:"액체", acc:["액체상태","액체 상태"],
  ex:"(교과서 116쪽)" },
{ id:"F6", u:"F", p:"114-115", t:"mc", d:2, tag:"입자 모형", fixed:true,
  ps:"(가) 수업 시간: 학생들이 제자리에 앉아 거의 움직이지 않는다.\n(나) 쉬는 시간: 학생들이 교실 안을 비교적 자유롭게 돌아다닌다.\n(다) 하교 시간: 학생들이 넓은 운동장으로 흩어져 멀리 떨어진다.",
  q:"(가)~(다)의 모습을 물질의 세 가지 상태에 비유할 때 옳게 짝지은 것은?",
  c:["고체 - 액체 - 기체","액체 - 고체 - 기체","기체 - 액체 - 고체","고체 - 기체 - 액체","액체 - 기체 - 고체"], a:1,
  ex:"(교과서 114~115쪽)" },
{ id:"F7", u:"F", p:"117", t:"mc", d:2, tag:"입자 모형",

  c:["입자 사이의 거리가 멀어지기 때문이다.","입자 하나하나의 크기가 커지기 때문이다.","입자의 수가 늘어나기 때문이다.","입자의 종류가 바뀌기 때문이다.","질량이 늘어나기 때문이다."], a:1,

{ id:"F8", u:"F", p:"117", t:"essay", d:2, tag:"고체·액체·기체",
  q:"기체 상태의 물질은 압력을 가하면 부피가 쉽게 변하지만, 고체나 액체는 부피가 거의 변하지 않는다. 그 까닭을 ‘입자 사이의 거리’를 넣어 서술하시오.",
  a:"기체는 입자 사이의 거리가 매우 멀어서 압력을 가하면 거리가 쉽게 줄어들지만, 고체와 액체는 입자 사이의 거리가 가까워 더 줄어들 공간이 거의 없기 때문이다.",
  rb:"① 기체는 입자 사이의 거리가 매우 멀다\n② 고체·액체는 입자 사이의 거리가 가까워 부피가 거의 변하지 않는다",
  ex:"(교과서 116~117쪽)" },

  c:["프라이팬 위의 버터가 녹는다.","젖은 빨래가 마른다.","음식 냄새가 멀리까지 퍼진다.","얼음물 컵 표면에 물방울이 맺힌다.","주스를 얼려 아이스바를 만든다."], a:1,

{ id:"H1", u:"H", p:"122-123", t:"mc", d:2, tag:"질량·부피 변화", fig:"dryIce", fixed:true,
  q:"그림은 드라이아이스 조각을 지퍼 백에 넣어 밀봉하고, 마개를 닫은 병에 넣어 질량을 측정한 결과이다. 이에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
  bg:["ㄱ. 드라이아이스를 이루는 입자의 수는 변하지 않았다.","ㄴ. 입자 사이의 거리가 멀어져 부피가 커졌다.","ㄷ. 기체가 되면서 입자의 크기가 커졌다."],
  c:BG5, a:4,
  ex:"승화할 때 입자의 수와 종류는 그대로라 질량이 같고, 입자 사이의 거리가 멀어져 지퍼 백이 부푼다. 입자 크기는 변하지 않는다. (교과서 122~125쪽)" },
{ id:"H2", u:"H", p:"123", t:"mc", d:2, tag:"성질 변화",
  ps:"삼각 플라스크의 물에 푸른색 염화 코발트 종이를 대 보았더니 붉게 변했다. 이 물을 가열하여 끓을 때 입구에서 나오는 수증기에 대 보아도 똑같이 붉게 변했다.",
  q:"두 결과가 같게 나타난 까닭으로 가장 적절한 것은?",
  c:["물은 상태가 변해도 물을 이루는 입자의 종류가 변하지 않기 때문이다.","물이 끓으면 입자의 수가 늘어나기 때문이다.","수증기가 되면 입자의 크기가 커지기 때문이다.","염화 코발트 종이는 무엇에 대도 붉게 변하기 때문이다.","물이 끓으면 새로운 물질이 생기기 때문이다."], a:1,
  ex:"상태가 변해도 입자의 종류와 개수가 변하지 않으므로 물질의 고유한 성질과 질량은 변하지 않는다. (교과서 123쪽, 125쪽)" },
{ id:"H3", u:"H", p:"125", t:"mc", d:2, tag:"질량·부피 변화", fixed:true,
  q:"물질의 상태가 변할 때 부피, 질량, 성질의 변화를 옳게 짝지은 것은?",
  c:["부피 변함 - 질량 변하지 않음 - 성질 변하지 않음","부피 변하지 않음 - 질량 변함 - 성질 변함","부피 변함 - 질량 변함 - 성질 변하지 않음","부피 변하지 않음 - 질량 변하지 않음 - 성질 변함","부피 변함 - 질량 변하지 않음 - 성질 변함"], a:1,
  ex:"입자 배열이 달라져 부피는 변하지만, 입자의 종류와 개수는 그대로이므로 질량과 성질은 변하지 않는다. (교과서 125쪽)" },
{ id:"H4", u:"H", p:"124-125", t:"mc", d:3, tag:"질량·부피 변화", fixed:true,
  ps:"(가) 초콜릿 조각을 물중탕하여 완전히 녹인다.\n(나) 녹은 초콜릿을 모양 틀에 붓고 질량을 잰다.\n(다) 초콜릿이 굳으면 다시 질량을 잰다.",

  c:["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"], a:4,

{ id:"H5", u:"H", p:"122, 125", t:"mc", d:2, tag:"질량·부피 변화",

{ id:"H7", u:"H", p:"122-125", t:"essay", d:3, tag:"질량·부피 변화",
  ps:"냉동식품 택배 상자에 든 드라이아이스 포장지에는 미세한 구멍이 많이 뚫려 있고, “밀폐된 휴지통에 버리지 마세요.”라는 경고 문구가 적혀 있었다.",

function arrowSeg(x1, y1, x2, y2, r, both) {
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
  return `<line class="mv" x1="${x1 + ux * r}" y1="${y1 + uy * r}" x2="${x2 - ux * (r + 4)}" y2="${y2 - uy * (r + 4)}" marker-end="url(#ah)"${both ? ` marker-start="url(#ah)"` : ""}/>`;
}
function hbars(data, max, unit, title, label) {
  let s = `<line class="ax" x1="112" y1="14" x2="112" y2="${22 + data.length * 40}"/>`;
  data.forEach(([n, v], i) => {
    const y = 24 + i * 40, w = v / max * 230;
    s += `<text x="104" y="${y + 17}" text-anchor="end">${n}</text><rect class="barE" x="112" y="${y}" width="${w}" height="24" rx="3"/><text x="${118 + w}" y="${y + 17}" class="mono">${v}${unit}</text>`;
  });
  s += `<text x="210" y="${46 + data.length * 40}" text-anchor="middle" class="small">${title}</text>`;
  return svg(400, 56 + data.length * 40, s, label);
}

  ex:"제시된 1인 미디어(‘사이버 렉카’)는 사생활 노출, 가짜 뉴스, 인격 침해 같은 사회적 문제를 일으킨다. 사용 시간을 조절하지 못하는 것은 개인적 문제인 디지털 중독이다. (교과서 103쪽, 지도서 139쪽, 141쪽)" },
{ id:"B15", u:"B", p:"102", t:"mc", d:2, tag:"타인의 권리 침해", fixed:true,
  q:"가상공간에서 타인의 권리를 침해하는 사례만을 〈보기〉에서 고른 것은?",
  bg:["ㄱ. 허락받은 무료 폰트를 출처를 밝히고 사용했다.","ㄴ. 친구와 함께 찍은 사진을 친구의 동의 없이 SNS에 올렸다.","ㄷ. 내 개인 정보가 담긴 게시물을 비공개로 바꾸었다.","ㄹ. 다른 사람의 창작물을 출처를 밝히지 않고 내 블로그에 올렸다."],
  c:BG4, a:4,
  ex:"ㄴ은 사생활 침해, ㄹ은 지식 재산권 침해이다. 개인 정보 유출, 동의 없는 사진·영상 게시, 유료 폰트 무단 사용, 출처 없는 창작물 사용 등이 권리 침해이다. (교과서 102쪽)" },
{ id:"B16", u:"B", p:"102", t:"mc", d:2, tag:"타인의 권리 침해",
  q:"‘문학, 학술, 예술 등 지적인 창조 활동을 하는 과정에서 생겨나는 재산상의 권리’를 뜻하는 말은?",
  c:["지식 재산권","저작물","사생활","잊힐 권리","정보 자기 결정권"], a:1,
  ex:"저작물(인간의 생각이나 감정을 표현한 창작물)에 정당한 대가를 치르지 않고 무단으로 쓰면 지식 재산권 침해가 된다. (교과서 102쪽)" },
{ id:"B17", u:"B", p:"102", t:"mc", d:2, tag:"가상공간의 폭력",
  q:"가상공간의 폭력 문제에 대한 설명으로 옳지 않은 것은?",
  c:["언어폭력, 명예 훼손, 따돌림 등 다양한 형태로 나타난다.","사진, 영상, 문자 등을 이용해 이루어진다.","정보가 손쉽게 복사·공유되어 순식간에 퍼진다.","피해자의 심리적 고통이 크고 오래 지속될 수 있다.","한 번 퍼진 정보도 쉽게 지울 수 있어 피해가 금방 사라진다."], a:5,
  ex:"가상공간에서는 한 번 유포된 정보는 삭제하기 어렵기 때문에 피해자의 고통이 매우 크고 오래 지속될 수 있다. (교과서 102쪽)" },
{ id:"B18", u:"B", p:"102", t:"mc", d:2, tag:"가상공간의 폭력",
  q:"가상공간에서의 폭력이 가해자가 죄책감을 느끼지 못한 채 더 심해지는 경향이 있는 까닭으로 가장 적절한 것은?",
  c:["가해자와 피해자가 직접 만나지 않은 상태에서 폭력이 이루어지기 때문이다.","가상공간에는 법이 전혀 적용되지 않기 때문이다.","피해자가 모두 가해자를 잘 알고 있기 때문이다.","가상공간의 정보는 곧바로 사라지기 때문이다.","가상공간 이용자는 모두 어른이기 때문이다."], a:1,
  ex:"가상공간에서의 폭력은 직접 만나지 않은 상태에서 이루어져 가해자가 죄책감을 느끼지 못하고 더 큰 폭력을 가하는 경향이 있다. (교과서 102쪽)" },
{ id:"B19", u:"B", p:"103", t:"mc", d:2, tag:"가상공간의 폭력",
  ps:"게임에서 알게 된 사람이 “요즘 힘든 일 없니?” 하며 다정하게 다가왔다. 선물까지 보내 주며 친해진 뒤 얼굴 사진을 보내 달라고 하더니, “부모님이 알면 실망하실걸? 우리끼리 비밀로 하자.”라고 한다.",
  q:"이 상황에서 가장 바람직한 대처는?",
  c:["대화를 멈추고 차단한 뒤, 부모님이나 선생님, 경찰 등 믿을 수 있는 사람에게 알리고 도움을 요청한다.","친해졌으니 사진 한 장 정도는 보내 준다.","부모님이 실망하실 수 있으니 혼자 비밀로 간직한다.","선물을 받았으니 요구를 들어주는 것이 예의이다.","상대의 나이와 주소를 알아내려고 내 정보부터 알려 준다."], a:1,
  ex:"아동·청소년을 유인해 친분을 쌓은 뒤 범죄를 저지르는 ‘그루밍’ 수법이다. 개인 정보를 노출하지 말고, 이유 없이 접근하는 사람을 경계하며, 혼자 해결하기 어렵다면 주변에 알려 적극적으로 도움을 요청해야 한다. (교과서 102~103쪽, 지도서 127쪽)" },
{ id:"B20", u:"B", p:"103", t:"mc", d:2, tag:"가상공간의 폭력", fixed:true,
  q:"가상공간에서 청소년을 대상으로 한 범죄를 예방하는 방법으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
  bg:["ㄱ. 온라인에서 나이, 주소, 아이디 같은 개인 정보를 노출하지 않는다.","ㄴ. 이유 없이 금전적인 대가를 주겠다며 접근하는 사람을 경계한다.","ㄷ. 피해를 당하면 주변에 알리지 않고 혼자서 조용히 해결한다."],
  c:BG5, a:4,
  ex:"개인 정보를 노출하지 않고 이유 없는 금전 제안을 경계해야 한다. 혼자 해결하기 어려운 문제는 주변에 알려 도움을 요청해야 해결할 수 있다. (교과서 102~103쪽)" },
{ id:"B21", u:"B", p:"102", t:"mc", d:3, tag:"사회적 문제", fixed:true,
  ps:"가상공간에서는 ㉠ 딥페이크로 타인의 얼굴과 음성을 조작한 영상을 퍼뜨리는 허위 조작 정보 문제가 생긴다. 또 ㉡ 개인 정보를 유출하거나 남의 사진을 동의 없이 올리는 사생활 침해 문제가 있다. ㉢ 유료 폰트라도 출처만 밝히면 허락 없이 사용해도 된다. ㉣ 가상공간의 폭력은 명예 훼손, 따돌림, 성범죄 등 다양한 형태로 나타난다. 그러므로 ㉤ 가상공간 너머에 실제 사람이 있다는 것을 잊지 말아야 한다.",
  q:"밑줄 친 ㉠~㉤ 중 옳지 않은 것은?",
  c:UL5, a:3,
  ex:"유료 폰트를 허락 없이 이용하거나 출처를 밝히지 않고 타인의 창작물을 사용하는 것 모두 지식 재산권 침해이다. 출처를 밝혀도 허락 없는 유료 폰트 사용은 침해이다. (교과서 102쪽)" },
{ id:"B22", u:"B", p:"102", t:"mc", d:1, tag:"사회적 문제",
  q:"가상공간의 도덕적 문제에 대처하는 자세로 적절하지 않은 것은?",
  c:["수시로 나의 행동을 점검한다.","가상공간 너머에 실제 사람이 있다는 것을 잊지 않는다.","나도 피해자가 될 수 있다는 것을 안다.","피해를 당하면 부끄러우므로 누구에게도 알리지 않는다.","혼자 해결하기 어려우면 주변에 적극적으로 도움을 요청한다."], a:4,
  ex:"혼자 해결하기 어려운 문제 상황에 처했다면 피해 상황을 주변에 알려 도움을 적극적으로 요청해야 한다. (교과서 102쪽)" },
{ id:"B23", u:"B", p:"101", t:"essay", d:2, tag:"필터 버블",
  ps:"(가)는 가상공간의 이용자가 알고리즘으로 추천되는 정보만을 접하게 되면서 자신만의 생각에 갇히는 현상을 뜻한다.",
  q:"(가)에 들어갈 용어를 쓰고, (가)로 인해 생길 수 있는 문제점을 한 가지 서술하시오.",
  a:"(가)는 필터 버블이다. 선호하는 정보만 반복해서 접하면 정보 편식이 심해져 자기 생각만 옳다고 여기게 되고, 고정 관념과 편견에 빠져 다른 의견을 가진 사람을 무시하거나 차별하게 될 수 있다.",
  rb:"① 용어: 필터 버블\n② 문제점: 정보 편식 심화, 고정 관념·편견, 다른 의견 무시·차별, 갈등 중 하나",
  ex:"(교과서 100~101쪽 / 지도서 139쪽 서술형 5번 변형)" },
{ id:"B24", u:"B", p:"102", t:"essay", d:3, tag:"허위 조작 정보",
  q:"허위 조작 정보가 무분별하게 퍼질 때 개인과 사회에 생기는 문제를 각각 한 가지씩 서술하시오.",
  a:"개인: 거짓 정보의 대상이 된 사람의 인격이 침해되고 명예가 훼손되어 큰 상처를 입는다. 사회: 수많은 사회적 갈등과 혼란이 생기고 서로를 신뢰할 수 없는 사회가 된다.",
  rb:"① 개인 차원: 인격 침해, 명예 훼손, 상처 등\n② 사회 차원: 사회적 갈등·혼란, 불신 사회 등",
  ex:"(교과서 102쪽 / 지도서 127쪽, 139쪽)" },

{ id:"C1", u:"C", p:"104", t:"mc", d:2, tag:"가상공간의 도덕적 원칙",
  q:"가상공간에서 지켜야 할 원칙에 대한 설명으로 적절하지 않은 것은?",
  c:["책임성: 건전한 문화를 조성해 미래 세대까지 전달해야 한다.","진정성: 가상공간의 나와 현실의 나를 분리해서 행동해도 된다.","사생활 존중: 다른 사람과 적절한 거리를 유지해야 한다.","자율성: 인공지능이 제공한 정보를 비판 없이 받아들여서는 안 된다.","호혜성: 다른 사람과 도움을 주고받는 관계를 유지해야 한다."], a:2,
  ex:"가상공간에서의 행동은 현실의 자아 정체성에도 영향을 미치므로, 언제나 온전한 자신으로서 진실하고 성실한 자세를 유지하는 진정성을 갖춰야 한다. (교과서 104쪽, 지도서 138쪽)" },
{ id:"C2", u:"C", p:"104", t:"mc", d:2, tag:"가상공간의 도덕적 원칙",
  ps:"단체 대화방에서 친구들이 한 친구를 놀리는 글을 올리자며 나에게도 강요했다. 하지만 나는 누가 시킨다고 따르지 않고, 스스로 옳다고 판단한 대로 거절하였다.",
  q:"‘나’의 행동에 가장 잘 드러난 가상공간의 도덕적 원칙은?",
  c:["자율성","포용성","공정성","호혜성","개방성"], a:1,
  ex:"자율성은 자신의 행동을 주체적인 태도로 결정하는 것이다. 다른 사람의 강요로 원하지 않는 행동을 하거나 인공지능의 정보를 비판 없이 받아들여서는 안 된다. (교과서 104쪽)" },
{ id:"C3", u:"C", p:"104-105", t:"mc", d:2, tag:"가상공간의 도덕적 원칙",
  ps:"주문을 키오스크로만 받는 가게가 늘고 있다. 그런데 디지털 기기에 익숙하지 않은 어르신이나 터치 화면을 쓰기 어려운 시각 장애인은 큰 불편을 겪고 심리적으로 위축되기도 한다. 그래서 글씨를 키우고 사용법을 단순하게 바꾼 키오스크를 만드는 노력이 이어지고 있다.",
  q:"이 노력과 가장 관련이 깊은 가상공간의 도덕적 원칙은?",
  c:["포용성과 공정성","진정성과 자율성","익명성과 개방성","절제력과 문해력","사생활 존중"], a:1,
  ex:"모든 사람은 연령, 성별, 장애 유무와 관계없이 가상공간에 쉽게 접근할 수 있어야 하며, 가상공간 발전의 혜택이 공정하게 분배되도록 노력해야 한다. (교과서 104~105쪽, 지도서 131쪽)" },
{ id:"C4", u:"C", p:"104", t:"mc", d:3, tag:"가상공간의 도덕적 원칙",
  ps:"우리가 쓰는 데이터는 모두 데이터 센터에 저장되는데, 서버를 식히는 데 엄청난 전력이 들어 온실가스를 많이 내보낸다(디지털 탄소). 그래서 불필요한 이메일 정리하기, 화면 밝기 줄이기 같은 작은 실천으로 미래 세대를 위해 디지털 탄소 발자국을 줄이자는 목소리가 나온다.",
  q:"이 주장과 가장 관련이 깊은 가상공간의 도덕적 원칙은?",
  c:["책임성","익명성","개방성","다양성","자율성"], a:1,
  ex:"자신의 행동이 가상공간 전체에 영향을 미칠 수 있음을 이해하고, 건전한 문화를 조성·유지하여 미래 세대까지 전달하는 것이 책임성이다. (교과서 104쪽, 지도서 131쪽)" },
{ id:"C5", u:"C", p:"104", t:"short", d:2, tag:"가상공간의 도덕적 원칙",
  q:"다른 사람의 사적인 영역을 침해하지 않고, 타인과 적절한 거리를 유지하려는 자세를 무엇이라고 하는지 쓰시오.",
  a:"사생활 존중", acc:["사생활존중","사생활 보호"],
  ex:"기술이 발전하면서 가상공간에서 다른 사람과의 거리가 점점 가까워지고 있으므로 서로 적절한 거리를 유지해야 한다. (교과서 104쪽)" },
{ id:"C6", u:"C", p:"104", t:"mc", d:2, tag:"개인정보 보호",
  q:"개인정보에 대한 설명으로 옳은 것은?",
  c:["이름과 전화번호만 개인정보에 해당한다.","홍채·지문 같은 생체 정보와 온라인 활동 정보도 개인정보에 포함된다.","가상공간에서 남긴 정보는 개인정보가 아니다.","개인정보는 다른 사람이 대신 관리해 주는 것이다.","특정한 사람을 알아볼 수 없는 정보만 개인정보이다."], a:2,

{ id:"C25", u:"C", p:"111", t:"essay", d:2, tag:"셰어런팅",
  q:"‘셰어런팅’이 무엇인지 쓰고, 셰어런팅을 반대하는 입장의 근거를 한 가지 서술하시오.",
  a:"셰어런팅은 부모가 SNS에 정기적으로 자녀의 일상에 대한 글이나 사진을 올리는 행위이다. 자녀의 의사와 무관하게 정보가 공개되어 자녀의 정보 자기 결정권을 침해하고, 공개된 정보가 범죄에 악용될 수 있기 때문에 반대한다.",
  rb:"① 뜻: 부모가 SNS에 자녀의 일상 글·사진을 올리는 것\n② 반대 근거: 정보 자기 결정권 침해, 범죄 악용 가능성, 훗날 자녀의 수치심 중 하나",
  ex:"(교과서 111쪽 서술형 5·6번 / 지도서 137쪽)" },
{ id:"C26", u:"C", p:"108-109", t:"essay", d:3, tag:"잊힐 권리",
  q:"‘가상공간에서 잊힐 권리를 인정해야 한다.’라는 논제에 대해 찬성 또는 반대 입장을 밝히고, 타당한 근거를 두 가지 들어 서술하시오.",
  a:"(찬성) 자기 정보에 대한 권리는 정보 당사자에게 있으므로 당사자가 원하면 삭제할 수 있어야 한다. 또 인터넷에 남은 개인 정보가 놀림이나 범죄에 악용될 수 있기 때문이다. / (반대) 모든 정보를 쉽게 지울 수 있으면 공익에 필요한 정보까지 차단되어 국민의 알 권리와 표현의 자유가 침해될 수 있다. 또 자신의 글에 대한 도덕적 책임 의식이 약해질 수 있기 때문이다.",
  rb:"① 찬성·반대 입장을 분명히 밝힘\n② 입장에 맞는 타당한 근거 두 가지 (정보 주체의 권리, 범죄 악용 / 알 권리, 표현의 자유, 책임 의식 약화 등)",
  ex:"(교과서 108~109쪽 / 지도서 136쪽, 139쪽 논술형 8번)" },

/* ── Ⅲ-1-1 인간 존엄성과 인권 ── */
{ id:"D1", u:"D", p:"116", t:"mc", d:1, tag:"인권의 의미",
  q:"어떤 조건이나 자격과 관계없이 사람이라면 누구나 인간다운 삶을 살며 존중받기 위해 마땅히 누려야 할 권리는?",
  c:["인권","사생활","지식 재산권","잊힐 권리","참정권"], a:1,
  ex:"인간은 모두 자유롭고 존엄한 존재로서 같은 권리를 가지고 태어나는데, 그 권리가 인권이다. 인종, 성별, 종교, 언어, 재산 등과 관계없다. (교과서 116쪽, 126쪽)" },
{ id:"D2", u:"D", p:"116", t:"mc", d:2, tag:"인권의 특징", fixed:true,
  ps:"(가) 오직 인간이라는 이유로 시대와 장소에 관계없이 모든 사람에게 주어진다.\n(나) 누구도 타인에게 넘겨주거나 스스로 포기할 수 없다.\n(다) 침해해서도, 침해당해서도 안 된다.\n(라) 모든 사람의 인권과 연결되어 서로 의지하며 존재한다.",
  q:"(가)~(라)에 해당하는 인권의 특징을 순서대로 옳게 짝지은 것은?",
  c:["보편성 - 양도 불가능성 - 불가침성 - 상호 의존성","보편성 - 불가침성 - 양도 불가능성 - 상호 의존성","상호 의존성 - 양도 불가능성 - 불가침성 - 보편성","불가침성 - 보편성 - 상호 의존성 - 양도 불가능성","양도 불가능성 - 보편성 - 불가침성 - 상호 의존성"], a:1,
  ex:"인권은 보편성, 양도 불가능성, 불가침성, 상호 의존성을 지닌다. (교과서 116쪽)" },
{ id:"D3", u:"D", p:"116", t:"mc", d:2, tag:"인권의 특징", fixed:true,
  q:"인권에 대한 설명으로 옳은 것만을 〈보기〉에서 고른 것은?",
  bg:["ㄱ. 개인의 인권은 다른 사람들의 인권과 독립되어 존재한다.","ㄴ. 다른 사람에게 자신의 인권을 넘겨줄 수 없다.","ㄷ. 생명을 가진 모든 존재에게 똑같이 주어지는 권리이다.","ㄹ. 모든 인간에게 적용되어야 하는 보편적 가치이다."],
  c:BG4, a:4,
  ex:"ㄱ. 인권은 서로 의지하며 존재한다(상호 의존성). ㄷ. 인권은 오직 인간이라는 이유로 인간에게 주어지는 권리이다. (교과서 116쪽, 지도서 160쪽)" },
{ id:"D4", u:"D", p:"116", t:"mc", d:3, tag:"인권의 특징",
  ps:"“저는 고무 공장에서 일하는 강주룡입니다. 회사가 우리 임금을 깎겠다고 해서 을밀대 지붕 위에 올라왔습니다. 우리 임금이 깎이면 평양에 있는 다른 고무 공장 노동자들의 임금도 깎일 것입니다. 내가 권리를 포기해서 다른 사람에게까지 피해를 줄 수는 없습니다.”",
  q:"이 주장에 가장 잘 나타난 인권의 특징은?",
  c:["상호 의존성","보편성","특수성","상대성","불가분성"], a:1,
  ex:"나의 권리를 지키려는 노력이 모두의 인권을 지키는 노력이 되는 것처럼, 개인의 인권은 모든 사람의 인권과 연결되어 서로 의지하며 존재한다(상호 의존성). (교과서 116쪽, 지도서 161쪽)" },
{ id:"D5", u:"D", p:"116", t:"mc", d:3, tag:"인권의 특징",
  ps:"모든 인권은 서로 연관되어 있어 나누어 떨어뜨릴 수 없다. 예를 들어 평등할 권리가 보장되지 않으면 자유가 제대로 보장될 수 없고, 자유가 보장되지 않으면 평등할 권리를 행사하기 어렵다. 그러므로 어느 권리를 더 소중하거나 덜 소중하게 여겨서는 안 된다.",
  q:"윗글에서 설명하는 인권의 특징은?",
  c:["불가분성","보편성","특수성","상대성","도덕성"], a:1,
  ex:"인권은 정치적·경제적·사회적 권리 등으로 나누어 이해되지만 본질적으로 나눌 수 없는 권리이다. 비엔나 인권 선언은 “모든 인권은 보편적이고, 나눌 수 없으며, 상호 의존적이다.”라고 규정한다. (교과서 116쪽, 지도서 147쪽, 160쪽)" },
{ id:"D6", u:"D", p:"116", t:"mc", d:1, tag:"인권이 추구하는 가치",
  ps:"모든 인간은 권리와 의무, 자격 등에서 동등하고 한결같다. 따라서 누구도 인종, 성별, 종교, 사회적 지위, 신체적·정신적 조건 등을 이유로 차별받아서는 안 된다.",
  q:"윗글에서 설명하는 인권의 가치로 가장 적절한 것은?",
  c:["평등","자유","안전","참여","건강"], a:1,
  ex:"평등은 권리와 의무, 자격 등에서 모든 인간이 동등하고 한결같음을 뜻한다. (교과서 116쪽, 지도서 160쪽)" },
{ id:"D7", u:"D", p:"116", t:"mc", d:2, tag:"인권이 추구하는 가치",
  q:"인권이 추구하는 가치인 ‘자유’에 대한 설명으로 가장 적절한 것은?",
  c:["다른 사람에게 해를 끼치지 않는 한 자유롭게 생각하고 표현하며 행동할 수 있어야 한다.","원하는 일이라면 남에게 피해를 주어도 할 수 있다.","모든 사람이 똑같은 행동을 하는 상태이다.","법이나 규칙이 전혀 없는 상태이다.","사회적 지위가 높은 사람만 누리는 권리이다."], a:1,
  ex:"자유란 구속에서 벗어나 자신의 의지대로 살아갈 수 있는 상태로, 다른 사람에게 해를 끼치지 않는 한 자유롭게 생각하고 표현하며 행동할 수 있어야 한다. (교과서 116쪽)" },
{ id:"D8", u:"D", p:"116", t:"mc", d:1, tag:"인권이 추구하는 가치",
  q:"인권에 담긴 가치로 보기 어려운 것은?",
  c:["생명 존중","안전과 건강","행복 추구","정치·사회적 참여","특정 집단의 특권 보장"], a:5,
  ex:"인권에는 자유와 평등을 비롯해 생명 존중, 안전과 건강, 행복 추구, 정치·사회적 참여 등 인간다운 삶을 위한 가치가 담겨 있다. 특권은 평등에 어긋난다. (교과서 116쪽)" },
{ id:"D9", u:"D", p:"118", t:"short", d:1, tag:"인간 존엄성",
  q:"인간이라는 이유만으로 누구나 가치 있고 소중한 존재로 존중받아야 한다는 것을 무엇이라고 하는지 쓰시오.",
  a:"인간 존엄성", acc:["인간존엄성","존엄성"],
  ex:"인간 존엄성을 개인이 누려야 할 권리를 통해 구체적으로 드러낸 것이 인권이다. (교과서 118쪽)" },
{ id:"D10", u:"D", p:"118", t:"mc", d:2, tag:"인권이 소중한 이유",
  ps:"“인간을 단지 수단으로만 대우하지 말고 언제나 동시에 목적으로 대우해야 한다.” - 칸트",
  q:"이 말과 가장 관련이 깊은, 인권이 소중한 도덕적 이유는?",
  c:["인간 존엄성의 실현","경제 성장의 실현","문화 사대주의의 실현","집단 지성의 실현","정보 전달의 효율화"], a:1,
  ex:"인권을 소중히 함으로써 사람들은 목적 그 자체인 인격체로 존중받으며 인간 존엄성이 실현되는 삶을 살게 된다. (교과서 118쪽)" },
{ id:"D11", u:"D", p:"118", t:"mc", d:2, tag:"인권이 소중한 이유",
  ps:"20세기 초 세계 박람회에서는 ‘인류학 전시’라는 명목으로 사람을 전시했다. ‘전시된’ 사람들은 날씨와 상관없이 전통 의상만 입어야 했고, 관객이 요구하면 언제든 춤추고 노래해야 했으며, 전투 모습을 재현하다 다치기도 했다.",
  q:"이 사례에 대한 설명으로 가장 적절한 것은?",
  c:["사람을 구경거리로 삼아 생명과 안전을 위협한 인권 침해 사례이다.","다른 문화를 존중한 모범 사례이다.","참여자의 자유가 충분히 보장된 사례이다.","문화 상대주의를 실천한 사례이다.","인권의 보편성을 잘 보여 주는 사례이다."], a:1,
  ex:"사례 속 사람들은 좁은 곳에 갇혀 구경거리가 되고 생명과 안전을 위협받으며 인간다운 삶을 살지 못했다. 왜 인권을 소중히 여겨야 하는지 생각하게 하는 인권 침해 사례이다. (교과서 118쪽)" },
{ id:"D12", u:"D", p:"118", t:"mc", d:2, tag:"인권이 소중한 이유", fixed:true,
  ps:"(가) 인권을 존중하면 모든 사람이 법 앞에서 평등하고 조건 때문에 차별받지 않는 사회가 된다.\n(나) 지구촌의 갈등과 폭력, 전쟁, 기아 문제를 해결하는 데 도움을 준다.\n(다) 안전을 보장받고, 자유롭게 선택하며, 교육과 문화생활을 누리는 인간다운 삶을 살 수 있다.",
  q:"(가)~(다)에 해당하는 인권이 소중한 이유를 순서대로 옳게 짝지은 것은?",
  c:["행복한 삶의 실현 - 평화의 실현 - 바람직한 사회의 실현","바람직한 사회의 실현 - 평화의 실현 - 행복한 삶의 실현","평화의 실현 - 바람직한 사회의 실현 - 행복한 삶의 실현","바람직한 사회의 실현 - 행복한 삶의 실현 - 평화의 실현","인간 존엄성의 실현 - 평화의 실현 - 바람직한 사회의 실현"], a:2,
  ex:"인권이 소중한 도덕적 이유는 인간 존엄성, 행복한 삶, 바람직한 사회, 평화의 실현이다. (교과서 118쪽)" },
{ id:"D13", u:"D", p:"118", t:"mc", d:2, tag:"인권이 소중한 이유",
  q:"인권이 소중한 도덕적 이유로 적절하지 않은 것은?",
  c:["인간 존엄성을 실현할 수 있기 때문이다.","각자의 개성을 존중받고 자아를 실현하는 행복한 삶을 살 수 있기 때문이다.","잘못된 관습과 제도를 개선하는 바람직한 사회를 만들 수 있기 때문이다.","인류 공동체의 평화를 실현하는 데 도움이 되기 때문이다.","힘 있는 나라가 다른 나라를 다스리는 데 도움이 되기 때문이다."], a:5,
  ex:"인권이 소중한 이유는 인간 존엄성, 행복한 삶, 바람직한 사회, 평화의 실현이다. (교과서 118쪽, 지도서 161쪽)" },
{ id:"D14", u:"D", p:"118", t:"mc", d:2, tag:"인권이 소중한 이유",
  ps:"산속에 계단 없이 완만한 경사로만으로 만든 ‘무장애 숲길’이 늘고 있다. 휠체어를 탄 사람, 노약자, 어린이, 임산부 등 보행 약자도 누구나 편하게 숲을 즐길 수 있도록 한 것이다.",
  q:"무장애 숲길을 만든 까닭으로 가장 적절한 것은?",
  c:["누구나 자유롭게 이동하고 시설을 이용할 권리를 보장하기 위해서","등산로를 더 험하게 만들기 위해서","보행 약자가 숲에 들어오지 못하게 하기 위해서","관광객 수를 줄이기 위해서","건강한 사람만 이용하게 하기 위해서"], a:1,
  ex:"성별, 연령, 국적, 장애 유무와 관계없이 모든 사람이 원하면 산을 오르고 공원을 이용할 수 있게 하려는 것이다. (교과서 118쪽, 지도서 149쪽)" },
{ id:"D15", u:"D", p:"116", t:"mc", d:2, tag:"인권의 의미",
  ps:"시각 장애 육상 선수와 선수의 눈 역할을 하는 ‘가이드 러너’는 한 개의 끈으로 서로의 손을 묶고 함께 달린다. 끈이 끊어지거나 가이드 러너가 규칙을 어기면 선수가 실격 처리된다.",
  q:"두 사람이 함께 잘 달리기 위해 필요한 자세로 가장 적절한 것은?",
  c:["서로의 능력과 한계를 존중하고 배려하며 발맞춘다.","각자 자기 속도대로만 달린다.","가이드 러너가 결승선을 먼저 통과한다.","선수의 장애를 이유로 결정을 모두 대신 내린다.","끈을 풀고 따로 달린다."], a:1,
  ex:"서로를 믿고 배려하며 서로의 능력과 한계를 존중하는 것은 모든 사람을 소중한 존재로 대우하는 인권 존중과 연결된다. (교과서 116쪽, 지도서 147쪽)" },
{ id:"D16", u:"D", p:"119", t:"mc", d:2, tag:"인권이 소중한 이유",
  ps:"미국 연방 대법관 루스 베이더 긴즈버그는 ‘똑같이 일했다면 같은 임금 지급하기’, ‘군사 학교에 여성 입학 허가하기’, ‘아내를 잃고 홀로 아이를 돌보는 남편에게 보육 수당 지급하기’ 등의 결과를 이끌어 냈다. 특히 ‘돌봄은 여성의 일’이라는 규정 때문에 오히려 남성이 차별받고 있음을 밝혔다.",
  q:"이 사례를 통해 알 수 있는 내용으로 가장 적절한 것은?",
  c:["성별에 근거한 법적 차별은 모두를 피해자로 만들 수 있다.","성차별은 여성에게만 피해를 준다.","법은 성별에 따라 다르게 적용되어야 한다.","돌봄은 여성만의 일이다.","인권은 개인이 노력해도 바꿀 수 없다."], a:1,
  ex:"긴즈버그는 남녀가 시민으로서 권리를 평등하게 누려야 한다는 헌법적 권리를 추구했고, 성별에 근거한 차별이 모두를 피해자로 만들 수 있음을 밝혔다. (교과서 119쪽)" },
{ id:"D17", u:"D", p:"119", t:"mc", d:2, tag:"인권이 소중한 이유",
  ps:"동요 ‘자전거’의 원래 가사 ‘저기 가는 저 영감 꼬부랑 영감’은 인권에 관한 생각이 개선되면서 ‘저기 가는 저 사람 조심하세요’로 바뀌었다.",
  q:"가사를 바꾼 까닭으로 가장 적절한 것은?",
  c:["노인에 대한 편견이 담긴 표현이 인권을 침해할 수 있기 때문이다.","노래의 박자를 맞추기 위해서이다.","자전거를 타는 사람을 비판하기 위해서이다.","동요에는 사람이 등장하면 안 되기 때문이다.","노인을 더 친근하게 부르기 위해서이다."], a:1,
  ex:"편견이 담긴 노랫말이 유행하면 잘못된 생각이 자연스럽게 퍼질 수 있다. 인권 존중의 관점에서 가사를 바꾸는 것은 인권 감수성을 기르는 일이다. (교과서 119쪽, 지도서 149쪽)" },
{ id:"D18", u:"D", p:"117", t:"short", d:1, tag:"세계 인권 선언",
  q:"인권 침해에 대한 반성과 인간의 기본적인 권리 존중을 위해 1948년 국제 연합 총회에서 채택된 선언을 무엇이라고 하는지 쓰시오.",
  a:"세계 인권 선언", acc:["세계인권선언","세계 인권 선언문","세계인권선언문"],
  ex:"세계 인권 선언 제1조는 “모든 인간은 태어날 때부터 자유로우며, 누구에게나 동등한 존엄성과 권리가 있다.”라고 명시한다. (교과서 117쪽, 127쪽)" },
{ id:"D19", u:"D", p:"117", t:"mc", d:2, tag:"세계 인권 선언",
  q:"세계 인권 선언에 담긴 권리로 보기 어려운 것은?",
  c:["사생활에 간섭받지 않고 자신의 명예를 지킬 권리","자유롭게 자기 생각을 표현할 권리","직업을 선택할 권리","힘들 때 사회 보장을 받을 권리","국적이나 인종에 따라 권리를 다르게 누릴 권리"], a:5,
  ex:"세계 인권 선언은 사생활·명예(12조), 표현의 자유(19조), 사회 보장(22조), 직업 선택(23조) 등을 담고 있으며, 모든 인간이 동등한 존엄성과 권리를 가진다고 밝힌다. (교과서 117쪽, 127쪽)" },
{ id:"D20", u:"D", p:"117", t:"mc", d:2, tag:"인권의 의미",
  ps:"거리에서 만난 노숙인이 도와 달라며 떨리는 손을 내밀었다. 가진 것이 없었던 나는 그의 손을 잡으며 “미안합니다. 아무것도 가진 것이 없어요.”라고 말했다. 그러자 노숙인은 미소를 띠며 “이만해도 정말 고마워요.”라고 말했다. 나는 거꾸로 이 사람에게서 도움받았다는 것을 깨달았다. - 투르게네프, “노숙인”",
  q:"이 글이 주는 깨달음으로 가장 적절한 것은?",
  c:["다른 사람을 존중하는 것은 곧 나도 존중받는 일이다.","돈이 없으면 남을 도울 수 없다.","노숙인은 도움을 받을 자격이 없다.","존중은 물질적인 도움으로만 표현된다.","모르는 사람과는 대화하지 않는 것이 좋다."], a:1,
  ex:"작은 행동도 타인을 존중하는 일이 될 수 있고, 다른 사람의 인권이 존중받을 때 내 인권도 존중받는다. (교과서 117쪽, 지도서 147쪽)" },
{ id:"D21", u:"D", p:"116", t:"mc", d:3, tag:"인권의 특징", fixed:true,
  ps:"인권은 ㉠ 오직 인간이라는 이유로 모든 사람에게 주어진다. ㉡ 인권은 스스로 포기하거나 남에게 넘겨줄 수 없다. 인권은 정치적·경제적·사회적 권리 등으로 나누어 이해되기도 하지만 ㉢ 정치적 권리가 가장 소중하므로 다른 권리보다 먼저 보장해야 한다. ㉣ 모두의 인권을 지키기 위한 노력이 곧 내 인권을 위한 노력이 된다. 또한 ㉤ 인권에는 생명 존중, 안전과 건강, 행복 추구 등 다양한 가치가 담겨 있다.",
  q:"밑줄 친 ㉠~㉤ 중 옳지 않은 것은?",
  c:UL5, a:3,
  ex:"인권은 본질적으로 나눌 수 없는 권리이므로 어느 것을 더 소중하거나 덜 소중하게 여겨서는 안 된다. (교과서 116쪽)" },
{ id:"D22", u:"D", p:"116", t:"mc", d:2, tag:"인권의 특징", fixed:true,
  ps:"갑: 인권은 조건이나 자격을 갖춘 사람에게만 주어져.\n을: 스스로 원한다면 자신의 인권을 포기할 수 있어.\n병: 모두의 인권을 지키려는 노력이 곧 내 인권을 위한 노력이야.\n정: 인권은 시대와 장소에 관계없이 모든 사람에게 주어져.",
  q:"인권에 대해 옳게 말한 사람만을 고른 것은?",
  c:["갑, 을","갑, 병","을, 정","병, 정","을, 병"], a:4,
  ex:"병은 상호 의존성, 정은 보편성을 옳게 말했다. 인권은 어떤 조건과도 관계없이 주어지며(갑 ×), 양도하거나 포기할 수 없다(을 ×). (교과서 116쪽)" },
{ id:"D23", u:"D", p:"116", t:"essay", d:2, tag:"인권의 특징",
  ps:"인권은 사람이면 누구나 존중받고 행복하게 살기 위해 마땅히 누려야 할 권리이며, ㉠ 보편성의 특징을 지닌다.",
  q:"밑줄 친 ㉠의 의미를 서술하시오.",
  a:"인권은 오직 인간이라는 이유로, 시대와 장소에 관계없이 누구에게나 예외 없이 주어진다는 뜻이다.",
  rb:"① ‘오직 인간이라는 이유로’와 비슷한 내용\n② ‘누구에게나 예외 없이’, ‘시대와 장소에 관계없이 모든 사람에게’와 비슷한 내용",
  ex:"(교과서 116쪽, 127쪽 서술형 1번 / 지도서 159쪽 채점 요소)" },
{ id:"D24", u:"D", p:"118", t:"essay", d:3, tag:"인권이 소중한 이유",
  q:"인권을 소중히 해야 하는 도덕적 이유를 두 가지 서술하시오.",
  a:"인권을 통해 인간은 누구나 목적 그 자체로 존중받아 인간 존엄성을 실현할 수 있다. 또 인권이 보장되면 자유롭게 선택하고 자아를 실현하는 행복한 삶을 살 수 있고, 법 앞에서 평등하고 차별 없는 바람직한 사회와 평화를 이룰 수 있다.",
  rb:"다음 중 두 가지를 이유와 함께 서술\n· 인간 존엄성의 실현 · 행복한 삶의 실현 · 바람직한 사회의 실현 · 평화의 실현",
  ex:"(교과서 118쪽, 127쪽 서술형 2번 / 지도서 159쪽)" },

{ id:"E1", u:"E", p:"120", t:"mc", d:1, tag:"다양한 인권 문제",
  q:"그 사람이 가진 어떤 특성을 이유로 사회 다수에 비해 열악한 환경에 놓여 있거나 고통을 받으며 살아가는 사람들을 무엇이라고 하는가?",
  c:["사회적 약자","외집단","귀화자","주류 집단","디지털 원주민"], a:1,

{ id:"E2", u:"E", p:"120", t:"mc", d:2, tag:"아동과 노인의 인권",
  ps:"더위 속에서 축구공을 만드는 사람은 열한 살 어린이다. 가죽 조각을 한 땀 한 땀 꿰매어 하루에 축구공 3개 정도를 만든다. 학교에 다닐 형편이 되지 않아 하루 종일 바느질만 하지만, 받는 돈은 겨우 2천 원 남짓이다.",
  q:"이 사례에 대한 설명으로 가장 적절한 것은?",
  c:["아동이 충분히 보살핌받지 못하는 아동 인권 침해 사례이다.","아동의 자유로운 직업 선택을 보장한 사례이다.","공정한 노동의 대가를 지급한 사례이다.","성차별로 인한 인권 문제 사례이다.","인종 차별로 인한 인권 문제 사례이다."], a:1,
  ex:"아동은 신체적·정신적으로 성장 중이므로 생존과 발달을 위해 특별히 다양한 보호와 지원을 받을 권리가 있다. (교과서 120쪽)" },
{ id:"E3", u:"E", p:"120", t:"mc", d:2, tag:"아동과 노인의 인권",
  q:"지도서에 소개된 유엔 아동 권리 협약의 내용으로 옳지 않은 것은?",
  c:["아동은 18세 미만의 모든 사람이다.","아동은 지금 우리 사회를 구성하는 권리의 주체이다.","아동의 생존과 발달에 관한 권리를 강조한다.","아동의 의견을 존중하고 아동의 이익을 최우선으로 해야 한다.","아동은 부모의 소유이므로 부모가 모든 권리를 대신 가진다."], a:5,
  ex:"유엔 아동 권리 협약은 아동이 부모의 소유나 미래를 준비하는 존재가 아니라 존엄한 권리의 주체라고 밝힌다. (지도서 153쪽)" },
{ id:"E4", u:"E", p:"120", t:"mc", d:2, tag:"아동과 노인의 인권",
  ps:"영유아와 어린이의 출입을 금지하는 ‘노키즈존’ 가게가 늘고 있다. 이에 대해 국가 인권 위원회는 아동의 출입을 전면 금지하는 것은 인권을 침해하는 차별 행위라고 판단하였다.",
  q:"국가 인권 위원회가 이렇게 판단한 까닭으로 가장 적절한 것은?",
  c:["합리적 이유 없이 아동의 행복 추구권과 평등권을 침해하기 때문이다.","가게 주인에게는 영업의 자유가 전혀 없기 때문이다.","아동은 어른보다 권리가 더 많기 때문이다.","모든 가게는 반드시 아동용 메뉴를 팔아야 하기 때문이다.","아동은 사회적 약자가 아니기 때문이다."], a:1,
  ex:"영업의 자유가 합리적 이유 없이 손님을 차별하는 과도한 사익 추구까지 허용하는 것은 아니다. 노키즈존은 아동의 행복 추구권과 평등권에 관련된 인권 문제이다. (교과서 120쪽, 지도서 153쪽)" },
{ id:"E5", u:"E", p:"120", t:"mc", d:2, tag:"장애인의 인권",
  q:"장애인의 인권 문제에 해당하지 않는 것은?",
  c:["휠체어를 탄 사람이 탈 수 없는 구조의 버스","계단으로만 이루어진 공공 도서관 입구","장애에 대한 편견 때문에 취업에 어려움을 겪는 것","장애를 이유로 교육·의료 혜택을 받지 못하는 것","일정 비율 이상 장애인을 고용하도록 한 제도"], a:5,
  ex:"장애인 의무 고용 제도는 장애인 인권을 보장하기 위한 제도이다. 시설 부족, 무관심, 편견과 선입견은 장애인 인권 문제의 원인이다. (교과서 120쪽, 122쪽)" },
{ id:"E6", u:"E", p:"127", t:"mc", d:2, tag:"다양한 인권 문제",
  ps:"신입 사원 모집\n· 연령: 30세 이하 성인\n· 담당 업무: 행정 사무\n· 조건: 용모 단정, 최종 학력 대학교 졸업 이상",
  q:"이 채용 공고의 문제점으로 가장 적절한 것은?",
  c:["업무와 관계없는 나이, 외모, 학력으로 응시 자격을 제한해 차별한다.","행정 사무를 담당할 사람을 뽑는다.","성인을 대상으로 모집한다.","모집 인원을 정해 두었다.","담당 업무를 미리 알려 준다."], a:1,
  ex:"외모, 나이, 학력과 관계없이 할 수 있는 업무인데도 이를 이유로 응시 자격을 제한하는 것은 인권 침해이다. (교과서 127쪽 서술형 3번, 지도서 159쪽)" },
{ id:"E7", u:"E", p:"120", t:"short", d:2, tag:"성차별과 인종 차별",
  q:"성별에 따라 사회적으로 기대하는 행동, 성격, 태도, 역할 등을 무엇이라고 하는지 쓰시오.",
  a:"성 역할", acc:["성역할"],
  ex:"사람을 성 역할 고정 관념을 가지고 대우하거나 성별을 이유로 취업·승진을 제한하는 것은 성차별로 인한 인권 침해이다. (교과서 120쪽)" },
{ id:"E8", u:"E", p:"121", t:"mc", d:2, tag:"성차별과 인종 차별", fixed:true,
  q:"“원래 그래.”라는 말로 정당화해 온 인권 문제와 이를 바꾼 말의 연결로 옳지 않은 것은?",
  c:["“원래 집안일은 여자가 하는 거야.” → 성차별 → “누구나 각자 잘하고 좋아하는 것을 하면 돼.”","“여학생들은 원래 수학을 못해.” → 성차별 → “자신 있는 과목은 사람마다 달라.”","“청소년은 어리니까 원래 받는 대가도 적어.” → 청소년 노동 인권 침해 → “누구든 노동에 대한 정당한 대가를 받아야 해.”","“어린 것이 뭘 알겠어.” → 아동 차별 → “아이들도 생각이 있고 존중받아야 해.”","“외국인 노동자는 원래 임금이 적어.” → 인종 차별 → “외국인은 한국인보다 덜 일하니 괜찮아.”"], a:5,
  ex:"⑤는 차별을 바꾼 말이 아니라 또 다른 편견이다. 인권을 존중하는 말은 “누구든 같은 일을 하면 같은 대우를 받아야 해.”와 같은 표현이다. (교과서 121쪽, 지도서 153쪽)" },
{ id:"E9", u:"E", p:"122", t:"mc", d:2, tag:"인권 감수성",
  ps:"1955년 미국에는 흑인이 백인에게 버스 좌석을 양보해야 한다는 법이 있었다. 로자 파크스는 이 법이 부당하다고 생각해 자리에서 일어나라는 요구를 거부했고, 체포되었다. 이를 계기로 버스 승차 거부 운동이 벌어져 결국 인종을 차별하는 법이 없어졌다.",
  q:"로자 파크스의 행동에 나타난 인권 감수성의 모습으로 적절하지 않은 것은?",
  c:["자신이 처한 상황이 인권 문제 상황임을 알아차렸다.","자기 행동이 관련된 사람들에게 어떤 결과를 가져올지 이해했다.","그 상황을 해결할 책임이 자신에게 있다고 생각했다.","인간의 존엄과 가치를 지키는 출발점이 되었다.","법으로 정해진 것이니 옳고 그름을 따지지 않고 따랐다."], a:5,
  ex:"로자 파크스는 부당한 법을 인권 문제로 알아차리고 행동했다. 인권 감수성을 발휘한 행동은 인권 보장을 위한 실천에 중요한 역할을 한다. (교과서 122쪽)" },
{ id:"E10", u:"E", p:"122", t:"short", d:1, tag:"인권 감수성",
  q:"어떤 상황을 인권 문제로 알아차리고, 자기 행동이 다른 사람에게 미칠 영향을 이해하며, 그 상황을 해결할 책임이 자신에게 있다고 느끼는 것을 무엇이라고 하는지 쓰시오.",
  a:"인권 감수성", acc:["인권감수성"],
  ex:"국가 인권 위원회는 인권 감수성을 ‘인권 문제 상황을 지각·해석하고, 자신의 행동이 미칠 영향을 알며, 해결할 책임이 자신에게 있다고 인식하는 심리 과정’이라고 하였다. (교과서 122쪽, 지도서 155쪽)" },
{ id:"E11", u:"E", p:"122", t:"mc", d:2, tag:"인권 의식의 성찰",
  ps:"1980년대까지만 해도 남자가 머리를 길게 기르거나 여자가 짧은 치마를 입으면 경찰의 단속 대상이었다. 가정과 학교의 체벌도 교육을 위한 것이라며 당연하게 여겨졌다. 지금은 이런 일들이 인권 침해라는 인식이 널리 퍼졌다.",
  q:"이 글이 강조하는 자세로 가장 적절한 것은?",
  c:["당연하게 여기던 것도 인권을 침해할 수 있으므로 자신과 사회의 인권 의식을 꾸준히 성찰해야 한다.","과거의 관습은 모두 옳으므로 그대로 따라야 한다.","인권의 영역은 이미 완성되어 바뀌지 않는다.","인권 문제는 국가만 해결할 수 있다.","체벌은 교육을 위해 반드시 필요하다."], a:1,
  ex:"인권은 많은 사람의 노력으로 얻은 결과이며 지금도 그 영역이 확장되고 있으므로, 사회와 내가 가진 인권에 관한 생각을 꾸준히 성찰해야 한다. (교과서 122쪽, 지도서 155쪽)" },
{ id:"E12", u:"E", p:"122", t:"mc", d:2, tag:"인권 보장 제도", fixed:true,
  q:"인권 보장을 위한 ‘사회적 차원’의 노력만을 〈보기〉에서 있는 대로 고른 것은?",
  bg:["ㄱ. 국제 인권 기구와 협력하여 인권 침해 사례를 조사하고 감시한다.","ㄴ. 국가 인권 위원회의 제안을 받아 인권 보장 정책을 만든다.","ㄷ. 인권에 대한 통념과 내 생각이 잘못되지 않았는지 스스로 성찰한다.","ㄹ. 자신과 타인의 권리를 알 수 있도록 학교에서 인권 교육을 한다."],
  c:BG34, a:2,
  ex:"ㄷ. 자신의 인권 의식을 성찰하는 것은 개인적 차원의 노력이다. 제도 마련, 정책 점검, 인권 교육은 사회적 차원의 노력이다. (교과서 122쪽, 지도서 161쪽)" },
{ id:"E13", u:"E", p:"122", t:"mc", d:2, tag:"인권 보장 제도",
  q:"비장애인에 비해 취업이 어려운 장애인을 위해 일정 규모 이상의 사업주에게 일정 비율 이상의 장애인을 고용하도록 의무를 부과하는 제도는?",
  c:["장애인 의무 고용 제도","국민 기초 생활 보장 제도","사회적 기업","잊힐 권리 보장 제도","국가 인권 위원회"], a:1,
  ex:"우리나라는 인권 보장을 위해 국가 인권 위원회를 설치하고, 국민 기초 생활 보장 제도, 장애인 의무 고용 제도 등을 시행하고 있다. (교과서 122쪽, 교사용 교과서 115쪽)" },
{ id:"E14", u:"E", p:"122", t:"short", d:2, tag:"인권 보장 제도",
  q:"우리나라가 국민의 인권을 보장하기 위해 설치하여 운영하는 국가 기관의 이름을 쓰시오.",
  a:"국가 인권 위원회", acc:["국가인권위원회","인권위원회"],
  ex:"변화하는 사회에서는 새로운 인권 문제가 생길 수 있으므로 관련 제도와 정책을 세우고 끊임없이 점검해야 한다. (교과서 122쪽, 지도서 154쪽)" },
{ id:"E15", u:"E", p:"123", t:"mc", d:2, tag:"인권 존중 실천",
  ps:"‘당신이 읽는 순간, 세상이 바뀝니다.’ A 기업은 기부나 자선 대신 노숙인이 잡지를 판매하고 수익금 일부를 가져가는 ‘작은 기업가’로 일하게 돕는 사회적 기업이다.",
  q:"A 기업의 방식이 인권 존중과 관련 있는 까닭으로 가장 적절한 것은?",
  c:["노동을 통해 존중받는 경험과 자신감을 얻고 경제적으로 자립하도록 돕기 때문이다.","노숙인에게 돈을 일방적으로 나누어 주기 때문이다.","노숙인이 사회에 나오지 않도록 막기 때문이다.","기업의 이익만을 추구하기 때문이다.","노숙인에게 정해진 일만 강요하기 때문이다."], a:1,
  ex:"사회적 약자를 존중하려면 일방적인 금전 지원뿐 아니라 사회 구성원으로 자립해 권리를 누리고 책임을 다하도록 돕는 다양한 노력이 필요하다. (교과서 123쪽, 지도서 155쪽)" },
{ id:"E16", u:"E", p:"124-125", t:"mc", d:2, tag:"모두를 위한 디자인", fig:"ethUD",
  q:"그림 (가)를 (나)처럼 바꾼 것에 담긴 생각으로 가장 적절한 것은?",
  c:["성별, 나이, 장애 유무와 관계없이 누구나 편리하게 이용할 수 있어야 한다.","평균 체격의 사람만 편하게 이용하면 된다.","장애인만을 위한 별도의 입구를 따로 만들어야 한다.","건물은 보기 좋은 모양이 가장 중요하다.","계단을 이용하지 못하는 사람은 건물에 들어오지 않아도 된다."], a:1,
  ex:"‘모두를 위한 디자인’은 누구나 편리하게 이용할 수 있는 제품과 환경을 설계하는 것이다. 계단과 경사로를 함께 두어 각자 원하는 방법으로 이용하게 한 것이 그 예이다. (교과서 124~125쪽)" },
{ id:"E17", u:"E", p:"124", t:"mc", d:2, tag:"모두를 위한 디자인",
  q:"‘모두를 위한 디자인 7원칙’에 해당하지 않는 것은?",
  c:["누구라도 사용할 수 있어야 한다.","사용법이 단순하고 이해하기 쉬워야 한다.","잘못 사용했을 때의 위험을 최소화해야 한다.","적은 힘으로 무리한 자세 없이 쓸 수 있어야 한다.","평균 체격의 사람에게 딱 맞는 크기로 만들어야 한다."], a:5,
  ex:"7원칙 중에는 ‘체형이나 자세와 관계없이 사용할 수 있는 적절한 크기와 공간을 제공해야 한다.’가 있다. 평균을 적용한 디자인은 평균에서 벗어난 많은 사람을 불편하게 한다. (교과서 124쪽)" },
{ id:"E18", u:"E", p:"124", t:"mc", d:3, tag:"모두를 위한 디자인",
  q:"‘배리어 프리 디자인’과 ‘모두를 위한 디자인(유니버설 디자인)’의 차이에 대한 설명으로 옳은 것은?",
  c:["배리어 프리 디자인은 장애의 종류와 정도에 따라 장벽을 없애고, 모두를 위한 디자인은 처음부터 모든 사람이 쉽게 이용하도록 설계한다.","배리어 프리 디자인은 모든 사람을, 모두를 위한 디자인은 장애인만을 대상으로 한다.","두 디자인은 이름만 다를 뿐 같은 것이다.","모두를 위한 디자인은 평균 체격을 기준으로 설계한다.","배리어 프리 디자인은 장벽을 더 많이 만드는 디자인이다."], a:1,
  ex:"모두를 위한 디자인은 ‘모든 사람은 인생의 어느 시점에서 어떤 장애를 가질 수 있다.’는 생각에서 출발해 장애 유무, 연령, 성별, 국적을 넘어 누구나 쓰기 쉽게 만드는 것을 목표로 한다. (지도서 158쪽)" },
{ id:"E19", u:"E", p:"127", t:"mc", d:2, tag:"다양한 인권 문제",
  ps:"한국 기업에서 10년 동안 성실하게 일한 이주 노동자 ○○ 씨는 같은 기간 일한 한국인 노동자보다 임금이 적고 승진도 늦다. 무엇보다 그를 힘들게 하는 것은 사람이 아니라 기계를 대하듯 효율성으로만 판단하는 태도이다.",
  q:"이 문제를 해결하기 위한 노력으로 적절하지 않은 것은?",
  c:["이주 노동자가 차별에서 보호받도록 법과 제도를 개선한다.","인권 교육을 강화해 사회적 인식을 바꾼다.","이주 노동자의 인권을 존중하는 사회 분위기를 만든다.","같은 일을 하면 같은 대우를 받도록 한다.","이주 노동자는 임금이 적은 것이 당연하다는 생각을 퍼뜨린다."], a:5,
  ex:"이주 노동자를 노동력을 얻는 수단으로만 취급하고 차별하는 것은 인권 침해이다. 법·제도 개선, 인권 교육, 존중하는 사회 분위기 조성이 필요하다. (교과서 127쪽, 지도서 159쪽)" },
{ id:"E20", u:"E", p:"122", t:"mc", d:3, tag:"인권 의식의 성찰", fixed:true,
  ps:"인간 존엄성을 존중하려면 ㉠ 인권 문제 상황을 알아차리는 인권 감수성을 길러야 한다. 또 ㉡ 인권에 관한 자신의 생각과 사회의 통념을 성찰해야 한다. ㉢ 국가는 인권 보장을 위한 제도를 마련하고, ㉣ 모든 사람이 자신의 권리를 알고 타인의 권리를 존중하도록 인권 교육을 해야 한다. 그리고 ㉤ 인권의 영역은 이미 완성되었으므로 새로운 인권 문제는 더 이상 생기지 않는다.",
  q:"밑줄 친 ㉠~㉤ 중 옳지 않은 것은?",
  c:UL5, a:5,
  ex:"인권은 지금도 그 영역이 확장되고 있으며, 변화하는 사회 속에서 언제든 새로운 인권 문제가 생길 수 있다. (교과서 122쪽)" },
{ id:"E21", u:"E", p:"122", t:"mc", d:2, tag:"인권 의식의 성찰",
  ps:"18세기 프랑스 혁명으로 신분 질서를 벗어나 자유와 평등의 개념이 발전했다. 19세기 후반에는 참정권 운동으로 여성이 남성과 동등하게 투표할 권리를 얻었다. 20세기 세계 대전 이후에는 세계 인권 선언이 발표되고 각국이 인권 보장을 위한 법과 제도를 마련했다.",
  q:"이 글을 통해 알 수 있는 내용으로 가장 적절한 것은?",
  c:["인권은 많은 사람의 노력으로 얻은 결과이며 그 영역이 점차 넓어지고 있다.","인권은 처음부터 모든 사람에게 완벽하게 보장되어 왔다.","인권은 한 나라 안에서만 보장되면 충분하다.","인권은 법으로 정해진 뒤로는 바뀌지 않았다.","인권은 전쟁을 일으키기 위해 만들어졌다."], a:1,
  ex:"인권은 인간의 존엄한 삶을 위해 많은 사람이 노력하여 얻은 결과로, 지금도 그 영역이 확장되고 있다. (교과서 122쪽, 지도서 161쪽)" },
{ id:"E22", u:"E", p:"121", t:"mc", d:2, tag:"인권 감수성",
  ps:"아무것도 볼 수 없는 어두운 체험 전시장에 갔다. 가게의 물건은 만져 보고 냄새를 맡으며 무엇일지 상상해야 했다. 캔 음료의 점자를 읽을 수 있다면 좋겠다고 하자, 안내자는 점자에도 ‘음료’, ‘탄산’이라고만 적혀 있어 어떤 음료인지 알 수 없다고 했다.",
  q:"체험자가 깨달았을 내용으로 가장 적절한 것은?",
  c:["내가 당연하게 누리던 것을 누리지 못하는 사람들이 있으며, 그들의 입장을 헤아려야 한다.","점자만 있으면 시각 장애인의 불편은 모두 해결된다.","시각 장애인은 음료를 마실 필요가 없다.","어두운 곳은 누구에게나 똑같이 편리하다.","장애인의 인권 문제는 나와 관계없다."], a:1,
  ex:"인권 침해 문제를 겪는 사람의 입장이 되어 보면 내가 생각지 못한 어려움을 알게 되고 인권 감수성을 기를 수 있다. (교과서 121쪽, 지도서 153쪽)" },
{ id:"E23", u:"E", p:"120", t:"essay", d:2, tag:"장애인의 인권",
  ps:"우리 마을에 있는 공공 도서관은 경사로 없이 모두 계단으로만 되어 있다.",
  q:"이 상황이 인권 문제인지 아닌지 판단하고, 그 까닭을 서술하시오.",
  a:"인권 문제이다. 공공 도서관은 누구나 자유롭게 이용하는 공공시설인데, 계단만 있으면 휠체어를 탄 사람이나 걷기 어려운 사람은 도서관을 이용할 수 없다. 누구나 자유롭게 이동하고 공공시설을 이용할 권리를 보장받지 못하므로 인권 문제이다.",
  rb:"① 인권 문제라고 판단\n② 휠체어 이용자·보행 약자가 공공시설을 이용할 권리를 보장받지 못한다는 까닭",
  ex:"(교과서 120쪽 / 지도서 160쪽 서술형 4번 변형)" },
{ id:"E24", u:"E", p:"122", t:"essay", d:3, tag:"인권 보장 제도",
  q:"인간 존엄성을 존중하기 위한 노력을 개인적 차원과 사회적 차원에서 각각 한 가지씩 서술하시오.",
  a:"개인적 차원: 인권 감수성을 길러 주변의 인권 문제를 알아차리고, 당연하게 여기던 생각이 인권을 침해하지 않는지 성찰한다. 사회적 차원: 국가 인권 위원회, 장애인 의무 고용 제도 같은 인권 보장 제도를 마련·점검하고 인권 교육을 실시한다.",
  rb:"① 개인적 차원: 인권 감수성 함양, 인권 의식 성찰 중 하나\n② 사회적 차원: 인권 보장 제도 마련·점검, 인권 교육 중 하나",
  ex:"(교과서 122쪽, 127쪽 서술형 4번 / 지도서 159쪽)" },

/* ── Ⅲ-2-1 다양한 문화·종교에 대한 이해 ── */
{ id:"F1", u:"F", p:"130", t:"mc", d:1, tag:"다문화 사회의 의미",
  q:"고유한 문화, 종교, 언어, 교육 등 다양한 생활 양식을 가진 사람들이 함께 살면서 다양한 문화가 공존하는 사회는?",
  c:["다문화 사회","정보 사회","산업 사회","단일 문화 사회","가상 사회"], a:1,
  ex:"다문화 사회는 다양한 생활 양식을 가진 사람들이 함께 살면서 다양한 문화가 공존하는 사회이다. (교과서 130쪽)" },
{ id:"F2", u:"F", p:"130", t:"mc", d:2, tag:"다문화 사회의 의미",
  q:"다문화 사회가 나타나게 된 배경과 가장 관련이 깊은 것은?",
  c:["세계화로 국가 간 교류가 활발해져 다른 지역이나 나라에서 살아가는 사람이 많아졌다.","모든 나라가 다른 나라와의 교류를 끊었다.","사람들이 태어난 곳을 떠나지 않게 되었다.","한 가지 문화만 남고 나머지 문화가 사라졌다.","외국 음식과 음악을 접하기 어려워졌다."], a:1,
  ex:"세계화로 국가 간 교류가 활발해지면서 다양한 문화를 가진 사람들이 늘어나고 여러 문화가 전파되어 자연스레 다문화 사회가 된다. (교과서 130쪽)" },
{ id:"F3", u:"F", p:"130", t:"mc", d:2, tag:"다문화 사회의 의미",
  q:"다음 중 ‘다른 나라의 국적을 얻어 우리나라 국민이 된 사람’을 가리키는 말은?",
  c:["귀화자","유학생","난민","이주 노동자","관광객"], a:1,
  ex:"우리나라에는 이주 노동자, 다문화 가정, 귀화자, 종교적·정치적 차이로 나라를 떠나온 외국인(난민), 유학생 등 다양한 사람들이 함께 살고 있다. (교과서 130쪽, 지도서 166쪽)" },
{ id:"F4", u:"F", p:"130", t:"mc", d:2, tag:"다문화 사회의 특징",
  q:"다문화 사회의 특징에 대한 설명으로 옳지 않은 것은?",
  c:["다양하고 새로운 문화를 접해 경험과 생각의 폭이 넓어진다.","새로운 문화가 만들어지는 데 도움을 주어 문화를 풍요롭게 한다.","선택의 기회가 늘어나 삶이 다채로워진다.","갈등이 생길 수 있지만 함께 살아가는 삶의 자세를 기를 수 있다.","내가 속한 집단만 중시하고 외집단을 배척할수록 갈등이 줄어든다."], a:5,
  ex:"내가 속한 집단만 중시하고 외집단을 배척하면 갈등이 생길 수밖에 없다. 외집단을 인정하고 존중해야 조화롭게 지낼 수 있다. (교과서 130쪽)" },
{ id:"F5", u:"F", p:"132", t:"mc", d:2, tag:"다문화 사회의 특징",
  ps:"오늘은 영국에서 전학 온 친구와 점심을 먹기로 했다. 새로 산 청재킷을 입고 나갔고, 점심 메뉴는 케밥과 쌀국수 중에서 고르기로 했다.",
  q:"이 글에 담긴 다문화 사회의 모습으로 가장 적절한 것은?",
  c:["일상에서 다양한 문화를 쉽게 접할 수 있다.","문화적 차이로 갈등이 생긴다.","다른 문화에 대해 배타적 태도를 보인다.","전통적인 관습이 사라져 경험의 폭이 좁아진다.","외국 문화를 경험하려면 반드시 외국에 가야 한다."], a:1,
  ex:"침대에서 자고 청바지를 입으며 다양한 나라 음식을 맛보는 것처럼, 우리는 예전보다 쉽게 다양한 문화를 경험하고 즐길 수 있다. (교과서 132쪽, 지도서 182쪽)" },
{ id:"F6", u:"F", p:"130", t:"short", d:2, tag:"다문화 사회의 특징",
  q:"내집단과 달리 나와 공통점이 없어 심리적으로 불편함을 느끼는 집단을 무엇이라고 하는지 쓰시오.",
  a:"외집단", acc:[],
  ex:"사람들은 공통점이 적은 외집단에 경계심을 보이기도 하지만, 외집단을 인정하고 존중하면 함께 살아가는 자세를 기를 수 있다. (교과서 130쪽)" },
{ id:"F7", u:"F", p:"130", t:"mc", d:3, tag:"다문화 사회의 의미", fig:"ethMigrant",
  q:"그림은 지도서에 소개된 우리나라의 이주 배경 인구 비율이다. 이에 대한 설명으로 가장 적절한 것은?",
  c:["우리나라는 OECD가 정한 다문화 국가 기준에 거의 다다랐다.","우리나라의 이주 배경 인구 비율은 이미 5%를 넘었다.","이주 배경 인구는 외국에 사는 한국인을 뜻한다.","우리나라는 다문화 사회와 관계가 없다.","OECD 기준으로는 이주 배경 인구가 10% 이상이어야 다문화 국가이다."], a:1,
  ex:"OECD 기준으로 전체 인구 중 이주 배경 인구가 5% 이상이면 다문화 국가이다. 우리나라는 2024년 4.89%로 점점 늘고 있다. 이주 배경 인구에는 귀화한 내국인, 이민자 2세, 국내 거주 외국인 등이 포함된다. (지도서 163쪽)" },
{ id:"F8", u:"F", p:"132", t:"mc", d:1, tag:"다양한 종교",
  q:"이슬람법에 따라 만들어져 이슬람교도가 먹고 쓸 수 있는 제품을 모두 일컫는 말로, 아랍어로 ‘허용된 것’이라는 뜻을 가진 것은?",
  c:["할랄","코셔","히잡","터번","연등"], a:1,
  ex:"할랄 음식점처럼 우리 사회에는 다양한 문화와 종교가 공존한다. 유대교에는 ‘코셔’라는 음식 규칙이 있다. (교과서 132쪽, 교사용 교과서 133쪽)" },
{ id:"F9", u:"F", p:"132", t:"mc", d:2, tag:"다양한 종교",
  q:"우리 사회 속의 다양한 종교에 대한 설명으로 옳지 않은 것은?",
  c:["종교의 가르침은 믿는 사람들의 생활 양식과 문화에 큰 영향을 준다.","토착 민간 신앙 외에도 불교, 유교, 크리스트교, 이슬람교 등이 공존한다.","종교의 자유가 보장되어 각자 원하는 종교를 가질 수 있다.","나와 다른 종교를 가진 사람들을 이해하고 존중해야 한다.","우리나라는 한 가지 종교만 인정하므로 다른 종교는 믿을 수 없다."], a:5,
  ex:"우리나라는 종교의 자유가 보장되므로 나와 다른 종교를 가진 사람들을 이해하고 서로 존중해야 한다. (교과서 132쪽)" },
{ id:"F10", u:"F", p:"132", t:"mc", d:2, tag:"다양한 종교", fixed:true,
  q:"지도서에 소개된 ‘종교의 자유’에 포함되는 내용으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
  bg:["ㄱ. 자신이 원하는 종교를 선택할 권리","ㄴ. 종교를 믿도록 강요받지 않을 권리","ㄷ. 다른 사람에게 내 종교를 믿으라고 강요할 권리"],
  c:BG5, a:4,
  ex:"헌법 제20조의 종교의 자유는 원하는 종교를 선택할 권리, 신앙을 강요받지 않을 권리, 종교 행사의 자유 등을 포함한다. 따라서 타인의 권리를 침해해서는 안 된다. (지도서 165쪽)" },
{ id:"F11", u:"F", p:"132", t:"mc", d:2, tag:"다양한 종교",
  ps:"성탄절을 맞아 한 불교 사찰에서 크리스마스트리 옆에 연등을 밝히고 캐럴을 틀었다.",
  q:"이처럼 다른 종교의 기념일을 함께 축하하는 까닭으로 가장 적절한 것은?",
  c:["종교적 다양성을 존중하고 평화롭게 공존하려는 뜻을 나타내기 위해서","자기 종교를 버리기 위해서","다른 종교를 흉내 내어 놀리기 위해서","한 가지 종교로 통합하기 위해서","종교의 자유를 제한하기 위해서"], a:1,
  ex:"종교가 달라도 기념일을 축하하며 서로를 이해하고 화목하게 지낼 수 있다. (교과서 132쪽, 지도서 165쪽)" },
{ id:"F12", u:"F", p:"133", t:"mc", d:2, tag:"다양한 문화",
  ps:"우리 학교에는 돼지고기를 먹지 않는 이슬람교 학생, 소고기를 먹지 않는 힌두교 학생, 육식을 멀리하는 불교 학생이 함께 다닌다. ‘세계 문화 다양성의 날(5월 21일)’을 맞아 모두가 함께 먹을 수 있는 급식 메뉴를 정하려고 한다.",
  q:"주요리로 가장 적절한 것은?",
  c:["콩고기 스테이크","돼지고기 김치찌개","소불고기","돈가스","소고기뭇국"], a:1,
  ex:"문화와 종교에 따라 꺼리는 음식이 있으므로, 이를 고려해 모두가 함께 먹을 수 있는 식단을 짜는 것이 다양성을 존중하는 방법이다. (교과서 133쪽, 지도서 165쪽)" },
{ id:"F13", u:"F", p:"132", t:"mc", d:2, tag:"다양한 문화",
  ps:"A 가게의 메뉴판에는 튀김만두 옆에 작은 돼지 그림이, 소고기뭇국 옆에는 소 그림이 그려져 있다. 주인은 “돼지고기를 먹지 않는 이슬람교도와 소를 신성하게 여기는 힌두교도를 위해 만들었어요.”라고 말한다.",
  q:"A 가게 주인에게서 본받을 자세로 가장 적절한 것은?",
  c:["다양한 문화를 가진 사람들을 열린 마음으로 이해하고 존중한다.","자기 문화와 다른 문화를 비교해 더 나은 문화만 받아들인다.","다른 문화를 가진 손님은 받지 않는다.","모든 손님에게 한 가지 음식만 권한다.","다른 종교의 음식 규칙은 무시한다."], a:1,
  ex:"다른 문화와 종교의 차이를 열린 마음으로 이해하고 존중하려는 노력이다. (교과서 132쪽, 지도서 183쪽)" },
{ id:"F14", u:"F", p:"133", t:"mc", d:2, tag:"다문화 사회의 특징",
  ps:"이주민들에게서 각 민족의 신화와 민담을 조사한 연구원들은 “이야기를 나눌수록 부정적인 이미지가 사라지고 각 나라에 호기심을 갖게 되었다.”, “이주 여성들은 한국 사회를 새롭게 발전시킬 원동력 같았다.”라고 말했다.",
  q:"연구원들의 인식이 바뀐 까닭으로 가장 적절한 것은?",
  c:["이주민을 직접 만나 이야기를 경청하며 그들의 삶과 문화를 깊이 이해했기 때문이다.","이주민과 거리를 두고 지냈기 때문이다.","대중 매체의 부정적인 묘사를 많이 보았기 때문이다.","연구 결과만 중요하게 여겼기 때문이다.","자기 문화가 가장 우수하다고 믿었기 때문이다."], a:1,
  ex:"다른 문화를 직접 접하면 편견을 버리고 다양성을 존중하게 되며, 그 문화와 우리 문화를 조화시켜 새로운 문화를 만들어 갈 수 있다. (교과서 133쪽, 지도서 165쪽)" },
{ id:"F15", u:"F", p:"132", t:"mc", d:3, tag:"다양한 문화",
  ps:"밥을 햄버거처럼 만든 ‘밥버거’처럼, 서로 다른 사회의 문화 요소가 결합하여 기존 문화와는 다른 새로운 문화가 만들어지기도 한다.",
  q:"지도서에서 이와 같은 문화 변동의 모습을 무엇이라고 하는가?",
  c:["문화 융합","문화 동화","문화 병존","문화 사대주의","자문화 중심주의"], a:1,
  ex:"다른 사회의 영향을 받은 문화 변동에는 한 문화가 흡수·대체되는 문화 동화, 여러 문화가 각각 존재하는 문화 병존, 결합해 새 문화가 생기는 문화 융합이 있다. (지도서 165쪽)" },
{ id:"F16", u:"F", p:"131", t:"mc", d:2, tag:"다문화 사회의 특징",
  ps:"다문화 사회는 김밥과 같다. 김밥 속 재료들은 저마다의 맛을 잃지 않으면서도 하나의 조화로운 맛을 만들어 낸다.",
  q:"이 비유가 나타내는 다문화 사회의 모습으로 가장 적절한 것은?",

{ id:"F18", u:"F", p:"130", t:"mc", d:3, tag:"다문화 사회의 특징", fixed:true,

{ id:"G3", u:"G", p:"134", t:"mc", d:2, tag:"문화를 바라보는 관점",
