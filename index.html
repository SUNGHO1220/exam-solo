  c:["과거에는 이주민에게 한국 문화를 받아들이도록 요구하는 동화주의 정책을 썼지만, 오늘날에는 서로의 문화를 존중하는 사회 환경 만들기에 힘쓰고 있다.","과거부터 지금까지 이주민 문화를 전혀 고려하지 않는다.","처음부터 샐러드 볼 모델만 사용해 왔다.","오늘날에는 이주민에게 한국어 배우기를 금지한다.","다문화 정책을 아예 시행하지 않는다."], a:1,

{ id:"H9", u:"H", p:"138", t:"mc", d:3, tag:"다문화 정책 사례",

  ex:"이 지수는 국적 접근성, 차별 보호, 교육, 가족 재결합, 보건, 취업, 영주권, 정치 참여 등 8개 영역을 평가한다. 우리나라는 2020년 기준 평균보다 약간 높았다. (지도서 175쪽)" },
{ id:"H10", u:"H", p:"140", t:"mc", d:2, tag:"공존하는 자세",

{ id:"H11", u:"H", p:"140", t:"short", d:1, tag:"공존하는 자세",

  c:["㉠은 수진이 소속감과 안정감을 느끼는 집단이다.","㉡과 ㉢은 수진에게 같은 종류의 집단이다.","같은 사람이라도 상황에 따라 내집단 구성원이 되기도 하고 외집단 구성원이 되기도 한다.","한 사람이 속할 수 있는 내집단은 하나뿐이다.","외집단 구성원은 나와 다른 집단이므로 차별해도 된다."], a:3,
  ex:"㉠·㉡은 외집단, ㉢은 내집단이다. 같은 지호라도 피구 대회에서는 외집단, 국가 대표 응원에서는 내집단 구성원이 된다. 사람은 여러 내집단에 속하며, 외집단이라는 이유로 차별해서는 안 된다. (교과서 137쪽)" },
{ id:"T12", u:"C", p:"139-140", t:"mc", tag:"차별 해결 노력", fixed:true,
  q:"차별을 줄이기 위한 노력으로 적절한 것만을 〈보기〉에서 고른 것은?",
  bg:["ㄱ. 키가 작은 사람도 잡을 수 있도록 지하철 손잡이 높이를 다양하게 만든다.","ㄴ. 특정 지역 출신이라는 이유로 승진 기회를 제한한다.","ㄷ. 다른 문화권 학생과 함께하는 모둠 활동으로 대화하고 협력할 기회를 늘린다.","ㄹ. 차별을 당한 사람이 스스로 해결하도록 하고 다른 사람은 관여하지 않는다."],
  c:BG4, a:2,
  ex:"ㄱ은 누구나 쓰기 쉬운 범용 디자인, ㄷ은 대화·협력으로 편견을 줄이는 노력이다. ㄴ은 지역 차별 사례이고, ㄹ처럼 차별에 무관심한 사회에서는 누구나 피해를 입을 수 있다. (교과서 139~140쪽)" },
{ id:"T13", u:"C", p:"136-139", t:"mc", tag:"갈등과 차별의 영향",
  q:"사회 갈등과 차별에 대한 설명으로 옳은 것은?",
  c:["갈등은 언제나 사회를 무너뜨리므로 드러나지 않게 억눌러야 한다.","차별은 피해를 입은 집단만의 문제이므로 다른 구성원에게는 영향이 없다.","차별은 구성원 사이의 신뢰를 약하게 하고 소통을 어렵게 한다.","성 역할에 대한 고정 관념은 사회 혼란과 아무 관계가 없다.","집단들이 같은 가치를 추구할 때에만 갈등이 생긴다."], a:3,
  ex:"사회는 갈등을 합리적으로 조정·해결하며 발전한다. 차별은 신뢰를 약화하고 소통을 어렵게 하며, 무관심한 사회에서는 누구나 피해를 입을 수 있다. 집단은 서로 다른 가치를 추구하거나 경쟁하면서 갈등을 겪는다. (교과서 136~139쪽)" },
{ id:"T14", u:"D", p:"146", t:"mc", tag:"넓은 의미와 좁은 의미의 문화", fixed:true,
  q:"‘문화’가 넓은 의미로 쓰인 것만을 〈보기〉에서 고른 것은?",
  bg:["ㄱ. 우리 반에는 서로 별명 대신 이름을 불러 주는 문화가 있다.","ㄴ. 그는 클래식 공연을 즐기는 교양 있는 문화인이다.","ㄷ. 온돌 문화는 추운 겨울을 견디기 위해 만들어졌다.","ㄹ. 주말에는 미술관에 가서 문화생활을 즐겼다."],
  c:BG4, a:2,
  ex:"넓은 의미의 문화는 구성원이 환경에 적응하며 공유하게 된 생활양식이다(ㄱ, ㄷ). ㄴ ‘문화인’, ㄹ ‘문화생활’은 교양이나 예술을 뜻하는 좁은 의미의 문화이다. (교과서 146쪽)" },
{ id:"T15", u:"D", p:"149", t:"mc", tag:"문화의 속성",
  ps:"스마트폰이 널리 퍼지자 사람들은 종이 지도 대신 지도 앱으로 길을 찾게 되었다. 택시를 부르는 방법, 음식을 주문하는 방법, 친구와 약속을 잡는 방법까지 함께 달라졌다.",
  q:"이 사례에 가장 잘 드러난 문화의 속성은?",
  c:["공유성","학습성","축적성","전체성","보편성"], a:4,
  ex:"스마트폰이라는 한 요소가 바뀌자 길 찾기, 교통, 주문, 약속 잡기 등 다른 생활 영역도 함께 바뀌었다. 문화 요소들이 서로 연결되어 한 부분이 변하면 다른 부분도 변하는 전체성(총체성)이다. 보편성은 속성이 아니라 문화의 특징이다. (교과서 149쪽)" },
{ id:"T16", u:"D", p:"148-149", t:"mc", tag:"문화의 속성", fixed:true,
  ps:"(가) 한국에서 태어나 프랑스에서 자란 입양인 에밀리는 한국을 방문했을 때 젓가락질이 어색했다.\n(나) 조상들이 남긴 『동의보감』의 지식을 바탕으로 오늘날 한의학이 더욱 발전하였다.\n(다) 우리 사회 사람들은 빨간불이 켜지면 다른 사람들도 멈출 것이라고 예측하고 행동한다.",
  q:"(가)~(다)에 나타난 문화의 속성을 옳게 짝 지은 것은?",
  c:["(가) 학습성 (나) 변동성 (다) 공유성","(가) 공유성 (나) 축적성 (다) 학습성","(가) 학습성 (나) 축적성 (다) 공유성","(가) 학습성 (나) 축적성 (다) 전체성","(가) 변동성 (나) 축적성 (다) 공유성"], a:3,
  ex:"(가) 문화는 태어난 뒤 배워서 익힌다(학습성). (나) 말과 글로 전달되며 새로운 지식이 더해진다(축적성). (다) 구성원이 함께 나누므로 서로의 행동을 예측할 수 있다(공유성). (교과서 148~149쪽)" },
{ id:"T17", u:"D", p:"147", t:"mc", tag:"보편성과 특수성", fixed:true,
  q:"문화의 특수성을 보여 주는 사례만을 〈보기〉에서 고른 것은?",
  bg:["ㄱ. 세계 어느 사회에나 결혼을 축하하는 의례가 있다.","ㄴ. 인도의 일부 지역에서는 손으로, 우리나라에서는 숟가락과 젓가락으로 식사한다.","ㄷ. 모든 사회에는 의사소통을 위한 언어가 있다.","ㄹ. 몽골의 유목민은 이동식 집 게르에, 이누이트는 눈으로 만든 이글루에 산다."],
  c:BG4, a:4,
  ex:"특수성은 각 사회의 문화가 고유한 특성을 지니는 것이다(ㄴ, ㄹ). ㄱ, ㄷ은 모든 사회에 공통으로 나타나는 보편성의 사례이다. (교과서 147쪽)" },
{ id:"T18", u:"E", p:"154", t:"mc", tag:"잘못된 정보와 허위 정보",
  ps:"(가) 갑은 ‘○○를 먹으면 감기가 하루 만에 낫는다’는 글이 사실이라고 믿고 가족 대화방에 공유했지만, 근거 없는 내용이었다.\n(나) ◇◇ 업체는 자사 제품을 더 팔기 위해 경쟁사 제품에서 유해 물질이 나왔다는 가짜 기사를 만들어 퍼뜨렸다.",
  q:"(가), (나)에 대한 설명으로 옳은 것은?",
  c:["(가)는 잘못된 정보, (나)는 허위 정보에 해당한다.","(가)는 사람들을 속이려고 일부러 만든 정보이다.","(나)는 사용자가 사실이라고 믿고 공유한 정보이다.","(가)는 속일 의도가 없었으므로 확인하지 않고 공유해도 문제가 없다.","(가), (나)는 모두 미디어 리터러시와 관계가 없다."], a:1,
  ex:"잘못된 정보는 사실이라고 믿고 공유하지만 틀린 정보(가), 허위 정보는 이익을 얻거나 속이려고 일부러 만든 정보(나)이다. 의도가 없더라도 사실 여부를 확인한 뒤 공유해야 한다. (교과서 154쪽)" },
{ id:"T19", u:"E", p:"153-155", t:"mc", tag:"맞춤형 서비스와 편향",
  ps:"동영상 플랫폼은 사용자가 본 영상과 비슷한 영상을 계속 추천한다. 한 정당을 비판하는 영상 몇 편을 본 갑의 화면에는 어느새 그 정당을 비판하는 영상만 가득하다.",
  q:"이 현상의 문제점과 대처 방법을 옳게 짝 지은 것은?",
  c:["정보가 줄어 필요한 정보를 찾기 쉬워진다 – 추천 영상만 본다.","제한된 정보만 얻어 편향된 관점을 갖기 쉽다 – 같은 주제를 다룬 여러 미디어를 비교한다.","정보가 일방향으로만 전달된다 – 영상을 직접 만들어 올린다.","콘텐츠의 상업적 성격이 사라진다 – 광고를 더 많이 본다.","추천이 많은 영상은 이미 검증되었다 – 확인하지 않고 공유한다."], a:2,
  ex:"사용자 맞춤형 서비스는 제한된 정보만 제공해 편향된 관점을 갖게 하기 쉽다. 같은 정보를 다룬 여러 미디어를 비교하고, 사실 여부를 확인해야 한다. (교과서 153~155쪽)" },
{ id:"T20", u:"E", p:"153-154", t:"mc", tag:"미디어 속 정보의 특징", fixed:true,
  q:"미디어와 광고에 대한 설명으로 옳은 것만을 〈보기〉에서 고른 것은?",
  bg:["ㄱ. 광고에는 정보를 전달하는 기능과 설득하는 기능이 함께 있다.","ㄴ. 광고에 유명인이나 전문가를 모델로 쓰는 것은 사람들이 그들을 더 잘 믿기 때문이다.","ㄷ. 미디어는 사건의 모든 측면을 빠짐없이 그대로 보여 준다.","ㄹ. 미디어가 어떤 문제를 비중 있게 보도하면 사람들은 그것을 중요한 문제로 여기게 된다."],
  c:BG34, a:2,
  ex:"광고는 정보 + 설득이다(ㄱ). 유명인·전문가 모델을 쓰는 까닭은 신뢰 때문이다(ㄴ). 미디어는 알리고 싶은 일부를 선택해 해석을 덧붙여 보여 주며(ㄷ 틀림), 비중 있게 보도하면 중요한 문제로 여기게 된다(ㄹ). (교과서 153~154쪽)" },
{ id:"T21", u:"E", p:"155", t:"mc", tag:"미디어 리터러시",
  q:"미디어 리터러시를 가장 잘 발휘한 학생은?",
  c:["갑: 조회 수가 100만 회가 넘는 영상이니 믿을 만하다고 보고 바로 공유했다.","을: 의사가 나오는 광고는 설득하려는 목적이 없으니 그대로 믿었다.","병: 충격적인 기사를 보고 다른 언론사의 보도와 공공 기관의 발표를 확인한 뒤 공유했다.","정: 정보가 너무 많아 헷갈리니 처음 본 정보만 믿기로 했다.","무: 플랫폼이 추천해 주는 영상만 보면 편향되지 않는다고 생각했다."], a:3,
  ex:"미디어 리터러시는 정보를 분석·평가·활용하는 능력이다. 여러 미디어를 비교하고, 사실 여부를 확인한 뒤 공유해야 한다. 혼자 확인하기 어려우면 공공 기관의 도움을 받는다. (교과서 155쪽)" },
{ id:"T22", u:"F", p:"157-158", t:"mc", tag:"문화를 이해하는 태도", fixed:true,
  ps:"(가) “우리 음식이 최고야. 곤충을 먹는 나라는 미개해.”\n(나) “그 지역 사람들이 곤충을 먹는 건 다른 단백질을 구하기 어려운 환경 때문일 거야.”\n(다) “서양 음식은 세련됐는데 우리 음식은 촌스러워.”",
  q:"(가)~(다)에 대한 설명으로 옳은 것만을 〈보기〉에서 고른 것은?",
  bg:["ㄱ. (가)는 구성원의 결속력을 높일 수 있지만, 지나치면 다른 문화와 갈등을 일으킬 수 있다.","ㄴ. (나)는 그 사회의 환경과 맥락 속에서 문화를 이해하려는 태도이다.","ㄷ. (다)는 고유문화를 지키고 주체성을 높이는 데 도움이 된다.","ㄹ. (가)와 (다)는 모두 문화 상대주의에 해당한다."],
  c:BG4, a:1,
  ex:"(가) 자문화 중심주의: 결속력 강화 / 차별·갈등. (나) 문화 상대주의. (다) 문화 사대주의: 주체성을 잃고 고유문화가 사라질 수 있다(ㄷ 틀림). (교과서 157~158쪽)" },
{ id:"T23", u:"F", p:"158", t:"mc", tag:"문화 상대주의의 한계",
  ps:"어떤 사회에는 어린 여자아이를 일찍 결혼시키는 풍습이 있다. 이 이야기를 들은 학생 갑은 “그 사회가 오랫동안 지켜 온 문화니까 우리가 옳고 그름을 따져서는 안 돼.”라고 말했다.",
  q:"갑에게 해 줄 조언으로 가장 적절한 것은?",
  c:["다른 사회의 문화는 모두 열등하므로 우리 문화로 바꾸도록 해야 해.","우리 문화는 낮고 다른 문화는 훌륭하니 그 풍습도 본받아야 해.","문화를 맥락 속에서 이해하되, 인간 존엄성 같은 보편적 가치를 해치는 관습까지 인정해서는 안 돼.","문화의 우열을 가려 순서를 매기면 쉽게 판단할 수 있어.","그 사회의 환경이나 맥락은 알 필요 없이 겉모습만 보고 판단하면 돼."], a:3,
  ex:"문화 상대주의는 문화를 그 사회의 환경과 맥락 속에서 이해하는 태도이지만, 인간 존엄성 같은 보편적 가치를 해치는 관습(조혼 풍습 등)까지 인정해서는 안 된다. (교과서 158쪽)" },
{ id:"T24", u:"F", p:"156-157", t:"mc", tag:"문화가 다양한 까닭",
  ps:"• 이슬람교에서는 돼지고기를 먹지 않는다. 건조한 지역에서 물을 많이 먹는 돼지를 기르면 사람이 마실 물이 부족해지기 때문이라는 해석이 있다.\n• 힌두교에서는 소고기를 먹지 않는다. 소는 농사와 생활에 꼭 필요해서 잡아먹으면 생계가 어려워지기 때문이라는 해석이 있다.",
  q:"두 사례에서 공통으로 알 수 있는 것은?",
  c:["음식 금기는 모든 사회에 똑같이 나타난다.","문화는 사람들이 처한 환경과 상황에 적응하는 과정에서 만들어진다.","다른 사회의 음식 문화는 우리 문화보다 뒤떨어져 있다.","음식 문화는 한번 만들어지면 변하지 않는다.","종교는 자연환경과 아무 관계가 없다."], a:2,
  ex:"사람들은 자신이 처한 환경과 상황에 적응하며 독특한 생활 방식과 가치관을 만들어 왔기 때문에 문화가 다양하다. (교과서 156~157쪽)" },
{ id:"T25", u:"F", p:"157", t:"mc", tag:"문화의 다양성",
  ps:"우리나라에 사는 외국인 인구\n2010년  약 114만 명\n2022년  약 226만 명",
  q:"이 자료와 관련된 설명으로 가장 적절한 것은?",
  c:["12년 사이 외국인 인구가 약 3배로 늘었다.","외국인 인구가 줄어 문화의 다양성도 줄어들고 있다.","외국인 인구가 약 2배로 늘어 다른 문화를 이해하고 존중하는 태도가 더 중요해졌다.","다양한 문화가 늘어날수록 문화의 우열을 가려 하나로 맞춰야 한다.","외국인 인구가 늘수록 자문화 중심주의를 강화하는 것이 바람직하다."], a:3,
  ex:"약 114만 명 → 약 226만 명으로 약 2배가 되었다. 문화 교류가 많아질수록 문화의 우열을 가리기보다 다양성을 이해하고 존중하는 태도가 필요하다. (교과서 157쪽)" },
{ id:"T26", u:"G", p:"164-165", t:"mc", tag:"넓은 의미와 좁은 의미의 정치", fixed:true,
  q:"넓은 의미의 정치에는 해당하지만 좁은 의미의 정치에는 해당하지 않는 것만을 〈보기〉에서 고른 것은?",
  bg:["ㄱ. 아파트 주민 회의에서 주차 문제를 두고 의견을 모아 규칙을 정했다.","ㄴ. 국회가 청소년 보호를 위한 법률을 만들었다.","ㄷ. 학급 회의에서 체육 대회 종목을 두고 토론한 뒤 결정했다.","ㄹ. 혼자 방에서 일기를 썼다."],
  c:BG4, a:2,
  ex:"ㄱ, ㄷ은 구성원 간 갈등을 조정해 합의하는 넓은 의미의 정치이다. ㄴ은 정치권력을 행사하는 활동으로 좁은 의미·넓은 의미 모두에 해당한다. ㄹ은 정치가 아니다. (교과서 164~165쪽)" },
{ id:"T27", u:"G", p:"165", t:"mc", tag:"정치가 필요한 까닭",
  ps:"마을에 하나뿐인 빈터를 두고 어른들은 주차장을, 아이들은 놀이터를, 상인들은 장터를 만들자고 주장하며 다투고 있다.",
  q:"이 갈등이 생긴 까닭과 바람직한 해결 방향을 옳게 짝 지은 것은?",
  c:["원하는 것은 충분하지 않고 중요하게 여기는 가치가 서로 달라서 – 대화와 타협으로 합의를 이룬다.","원하는 것이 무한히 많아서 – 각자 원하는 대로 땅을 나누어 쓴다.","모두 같은 가치를 추구해서 – 힘이 가장 센 집단이 결정한다.","갈등은 저절로 사라지므로 – 아무것도 하지 않고 기다린다.","다수가 원하는 것이 정해져 있어서 – 소수의 의견은 듣지 않는다."], a:1,
  ex:"가지고 싶은 것은 충분하지 않고 중요하게 여기는 가치도 달라 갈등이 생긴다. 정치는 갈등을 합리적으로 조정해 합의를 이루어 사회 통합과 질서를 유지한다. (교과서 165쪽)" },
{ id:"T28", u:"G", p:"167", t:"mc", tag:"다수결과 소수 존중",
  ps:"학급 회의에서 현장 체험 학습 장소를 다수결로 정했더니 놀이공원이 뽑혔다. 그런데 휠체어를 타는 친구 지민이는 “놀이 기구 대부분을 이용할 수 없어 걱정돼.”라고 말했다.",
  q:"민주적인 문제 해결 방법으로 가장 적절한 것은?",
  c:["다수결로 정했으니 지민이의 의견은 고려하지 않는다.","지민이 한 명 때문에 결정을 바꿀 수는 없으므로 지민이만 학교에 남게 한다.","다수결의 결정을 존중하되, 소수 의견을 존중하여 지민이도 함께 즐길 수 있는 방안을 함께 찾는다.","반장이 혼자 판단해서 장소를 새로 정한다.","다수결은 민주적이지 않으므로 앞으로는 투표를 하지 않는다."], a:3,
  ex:"다수결의 원칙을 따르되 소수 의견을 존중해야 한다. 관용과 타협으로 모두가 받아들일 수 있는 방안을 찾는 것이 민주적 태도이다. (교과서 167쪽)" },
{ id:"T29", u:"G", p:"166-167", t:"mc", tag:"생활 방식으로서의 민주주의", fixed:true,
  q:"생활 방식으로서의 민주주의를 실천한 사례만을 〈보기〉에서 고른 것은?",
  bg:["ㄱ. 동아리 회장이 회원들과 상의하지 않고 혼자 규칙을 정했다.","ㄴ. 가족회의에서 막내도 어른과 동등하게 의견을 내고 함께 결정했다.","ㄷ. 친구와 의견이 다를 때 상대의 생각을 인정하고 포용했다.","ㄹ. 힘센 학생 몇 명이 반 청소 당번을 마음대로 정했다."],

{ id:"T30", u:"G", p:"166", t:"mc", tag:"민주주의의 필요성",
  ps:"옛날 어느 나라에서는 왕이 모든 권력을 가지고 있었다. 왕이 마음대로 세금을 올리고 백성의 땅을 빼앗아도 백성은 반대할 방법이 없었다.",
  q:"이 사례를 통해 민주주의가 필요한 까닭을 바르게 추론한 것은?",

],

{ id:"W2", u:"B", p:"134-135", t:"essay", tag:"역할 갈등 해결",

{ id:"W3", u:"C", p:"137-140", t:"essay", tag:"편견과 차별",

{ id:"W4", u:"D", p:"149", t:"essay", tag:"문화의 속성",

{ id:"W5", u:"E", p:"154-155", t:"essay", tag:"미디어 리터러시",

{ id:"W6", u:"F", p:"158", t:"essay", tag:"문화 상대주의의 한계",

{ id:"W7", u:"F", p:"157-158", t:"essay", tag:"자문화 중심주의와 문화 사대주의",

  q:"두꺼운 일반 유리컵에 뜨거운 물을 갑자기 부으면 깨지기 쉽다. 그 까닭으로 가장 적절한 것은?",
  c:["유리의 비열이 커서 온도가 잘 변하지 않기 때문이다.","유리 입자 하나하나가 커지면서 서로 부딪치기 때문이다.","컵의 안쪽은 많이 팽창하고 바깥쪽은 조금 팽창하여 팽창 정도에 차이가 생기기 때문이다.","컵의 바깥쪽이 안쪽보다 먼저 뜨거워져 더 많이 팽창하기 때문이다.","뜨거운 물과 유리컵이 곧바로 열평형을 이루기 때문이다."], a:3,
  ex:"뜨거운 물에 닿은 안쪽은 많이 팽창하지만 바깥쪽은 아직 덜 데워져 조금 팽창한다. 이 차이 때문에 유리가 깨진다. 그래서 열팽창 정도가 작은 내열 유리를 쓴다. (교과서 95쪽)" },
{ id:"T12", u:"C", p:"97-99", t:"mc", tag:"열평형", fig:"topEq", fixed:true,
  q:"그림은 뜨거운 물체 A와 차가운 물체 B를 접촉시켜 놓았을 때 두 물체의 온도를 나타낸 것이다. 이에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은? (단, 열은 A와 B 사이에서만 이동한다.)",
  bg:["ㄱ. 0~6분 동안 열은 A에서 B로 이동한다.","ㄴ. 6분 이후 A와 B는 열평형 상태이다.","ㄷ. 0~6분 동안 A의 입자 운동은 점점 활발해진다."],
  c:BG5, a:4,
  ex:"열은 온도가 높은 A에서 낮은 B로 이동하고, 6분에 두 물체의 온도가 40 ℃로 같아져 열평형을 이룬다. 열을 잃는 A의 입자 운동은 둔해지고, 열을 얻는 B의 입자 운동은 활발해진다(ㄷ 틀림). (교과서 97~99쪽)" },
{ id:"T13", u:"C", p:"100-101", t:"mc", tag:"열의 이동 방식", fixed:true,
  q:"캠핑장에서 일어나는 현상과 열의 이동 방식을 옳게 짝 지은 것만을 〈보기〉에서 고른 것은?",
  bg:["ㄱ. 모닥불 가까이 앉으면 얼굴이 따뜻해진다. – 복사","ㄴ. 버너 위 코펠의 금속 손잡이가 뜨거워진다. – 대류","ㄷ. 텐트 안 난로에서 데워진 공기가 위로 올라가며 텐트 안 전체가 따뜻해진다. – 대류","ㄹ. 침낭 속 핫팩에 닿은 발이 따뜻해진다. – 복사"],
  c:BG4, a:2,
  ex:"ㄱ 복사(물질 없이 직접 이동), ㄷ 대류(데워진 공기가 직접 이동). ㄴ, ㄹ은 맞닿은 물체의 입자 운동이 차례로 전달되는 전도이다. (교과서 100~101쪽)" },
{ id:"T14", u:"C", p:"97-99", t:"mc", tag:"열평형과 입자 운동",
  q:"온도가 다른 두 물체를 접촉시켰을 때에 대한 설명으로 옳지 않은 것은?",
  c:["열은 온도가 높은 물체에서 낮은 물체로 이동한다.","열을 잃는 물체는 입자 운동이 점점 둔해진다.","열을 얻는 물체는 입자 운동이 점점 활발해진다.","열평형 상태가 되면 두 물체의 입자 운동이 모두 멈춘다.","시간이 지나면 두 물체의 온도가 같아진다."], a:4,
  ex:"열평형 상태는 두 물체의 온도가 같아진 상태일 뿐, 입자 운동이 멈추는 것이 아니다. 입자는 계속 운동한다. (교과서 97~99쪽)" },
{ id:"T15", u:"E", p:"110-112", t:"mc", tag:"증발과 확산의 예", fixed:true,
  q:"확산의 예만을 〈보기〉에서 고른 것은?",
  bg:["ㄱ. 비 온 뒤 아스팔트 위의 물웅덩이가 사라진다.","ㄴ. 방 한쪽에 둔 방향제 향기가 방 전체에 퍼진다.","ㄷ. 옆집에서 굽는 생선 냄새가 우리 집까지 난다.","ㄹ. 바닷가에서 오징어를 햇볕에 말린다."],
  c:BG4, a:3,
  ex:"확산은 입자가 스스로 운동하여 모든 방향으로 퍼져 나가는 현상이다(ㄴ, ㄷ). ㄱ, ㄹ은 액체 표면에서 기체로 변하는 증발이다. (교과서 110~112쪽)" },
{ id:"T16", u:"E", p:"112-113", t:"mc", tag:"확산", fixed:true,
  ps:"긴 유리관 한쪽 끝에 식초를 묻힌 솜을 넣고, 관 속에 푸른색 리트머스 종이 ㉠, ㉡, ㉢을 솜에서 가까운 순서대로 놓은 뒤 입구를 막았다. 같은 장치를 실험 Ⅰ은 20 ℃, 실험 Ⅱ는 40 ℃에서 진행하였다.",
  q:"이에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
  bg:["ㄱ. 리트머스 종이는 ㉠ → ㉡ → ㉢ 순서로 붉게 변한다.","ㄴ. ㉢이 붉게 변하는 데 걸리는 시간은 실험 Ⅱ가 실험 Ⅰ보다 짧다.","ㄷ. 식초 입자는 리트머스 종이가 있는 쪽으로만 이동한다."],
  c:BG5, a:4,
  ex:"식초 입자가 스스로 운동하여 퍼지므로 가까운 종이부터 붉게 변한다. 온도가 높을수록 입자 운동이 활발해 확산이 빠르다. 입자는 특정 방향이 아니라 모든 방향으로 퍼진다(ㄷ 틀림). (교과서 112~113쪽)" },
{ id:"T17", u:"E", p:"111", t:"mc", tag:"증발",
  ps:"손 소독제 2.0 g을 시계 접시에 덜어 전자저울에 올려놓았더니, 5분 뒤 저울의 눈금이 1.2 g을 가리켰다.",
  q:"이 실험 결과에 대한 해석으로 가장 적절한 것은?",
  c:["손 소독제 입자 0.8 g어치가 공기 중에서 사라져 없어졌다.","손 소독제 입자의 크기가 작아져 질량이 0.8 g 줄었다.","손 소독제 입자가 스스로 운동하여 0.8 g만큼 공기 중으로 날아갔다.","누군가 바람을 불어 주어야만 이런 변화가 일어난다.","손 소독제가 응고하여 질량이 줄었다."], a:3,
  ex:"증발은 입자가 스스로 운동하여 액체 표면에서 기체로 변하는 현상이다. 줄어든 0.8 g만큼 입자가 공기 중으로 날아갔을 뿐, 입자가 사라지거나 작아진 것이 아니다. (교과서 111쪽)" },
{ id:"T18", u:"E", p:"113", t:"mc", tag:"증발과 확산의 이용",
  q:"새로 지은 집에 입주하기 전 난방으로 실내 온도를 높인 뒤 창문을 열어 환기하는 ‘베이크 아웃’을 하면 유해 물질을 줄일 수 있다. 그 원리로 가장 적절한 것은?",
  c:["온도를 낮추어 유해 물질이 응고하게 한다.","온도를 높여 유해 물질의 증발을 활발하게 하고, 환기로 실외로 확산시킨다.","온도를 높이면 유해 물질 입자의 크기가 작아진다.","환기를 하면 유해 물질 입자가 사라진다.","온도를 높이면 입자 운동이 둔해져 유해 물질이 바닥에 가라앉는다."], a:2,
  ex:"온도가 높을수록 입자 운동이 활발해져 증발과 확산이 빨라진다. 증발한 유해 물질을 환기로 밖으로 확산시킨다. (교과서 113쪽)" },
{ id:"T19", u:"F", p:"114-117", t:"mc", tag:"고체·액체·기체", fixed:true,
  ps:"(가) 입자가 제자리에서 진동하며 규칙적으로 배열되어 있다.\n(나) 입자 사이의 거리가 매우 멀고 입자가 자유롭게 매우 활발히 움직인다.\n(다) 입자의 배열이 불규칙하고 입자가 비교적 자유롭게 움직인다.",
  q:"(가)~(다)에 대한 설명으로 옳은 것만을 〈보기〉에서 고른 것은?",
  bg:["ㄱ. (나)는 압력을 가하면 부피가 크게 줄어든다.","ㄴ. (다)는 담는 그릇에 따라 모양과 부피가 모두 변한다.","ㄷ. 입자 운동의 활발한 정도는 (나) > (다) > (가)이다.","ㄹ. 밀가루는 그릇에 따라 모양이 변하므로 (가)에 해당하지 않는다."],
  c:BG4, a:2,
  ex:"(가) 고체, (나) 기체, (다) 액체. 기체는 입자 사이가 멀어 압축된다(ㄱ). 액체는 모양은 변하지만 부피는 일정하다(ㄴ 틀림). 입자 운동은 기체 > 액체 > 고체(ㄷ). 밀가루도 알갱이 하나하나의 모양과 부피가 일정한 고체이다(ㄹ 틀림). (교과서 114~117쪽)" },
{ id:"T20", u:"F", p:"116", t:"mc", tag:"입자 모형",
  q:"공기를 넣은 주사기와 물을 넣은 주사기의 끝을 막고 피스톤을 누르면, 공기는 부피가 크게 줄지만 물은 거의 줄지 않는다. 그 까닭으로 옳은 것은?",
  c:["공기 입자의 크기가 눌려서 작아지기 때문이다.","공기 입자의 개수가 줄어들기 때문이다.","기체는 입자 사이의 거리가 멀지만, 액체는 입자 사이의 거리가 가까워 더 줄어들 공간이 거의 없기 때문이다.","물 입자는 공기 입자보다 훨씬 크기 때문이다.","물은 입자 운동을 하지 않기 때문이다."], a:3,
  ex:"기체는 입자 사이의 거리가 매우 멀어 압력을 가하면 부피가 크게 줄어든다. 고체와 액체는 입자 사이가 가까워 거의 줄지 않는다. 입자의 크기와 개수는 변하지 않는다. (교과서 116쪽)" },
{ id:"T21", u:"G", p:"118-120", t:"mc", tag:"상태 변화의 종류", fixed:true,
  ps:"겨울 아침, ㉠유리창 안쪽에 성에가 생겼다. 햇빛이 비치자 ㉡성에가 녹아 물방울이 되었고, 한낮이 되자 ㉢물방울이 말라 사라졌다. 저녁에 국을 끓이자 ㉣냄비 뚜껑 안쪽에 물방울이 맺혔다.",
  q:"㉠~㉣에서 일어난 상태 변화를 옳게 짝 지은 것은?",
  c:["㉠ 응고 ㉡ 융해 ㉢ 기화 ㉣ 액화","㉠ 승화 ㉡ 액화 ㉢ 기화 ㉣ 액화","㉠ 승화 ㉡ 융해 ㉢ 승화 ㉣ 액화","㉠ 승화 ㉡ 융해 ㉢ 기화 ㉣ 액화","㉠ 액화 ㉡ 융해 ㉢ 기화 ㉣ 응고"], a:4,
  ex:"㉠ 수증기가 바로 얼음 결정(성에)이 됨: 승화(기체 → 고체). ㉡ 고체 → 액체: 융해. ㉢ 액체 → 기체: 기화(증발). ㉣ 수증기 → 물방울: 액화. (교과서 118~120쪽)" },
{ id:"T22", u:"G", p:"122-124", t:"mc", tag:"질량·부피 변화", fixed:true,
  q:"드라이아이스 조각을 지퍼 백에 넣고 밀봉한 뒤 전자저울 위에 올려 두었더니 드라이아이스가 모두 사라지고 지퍼 백이 부풀었다. 이에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
  bg:["ㄱ. 저울이 가리키는 질량은 처음과 같다.","ㄴ. 지퍼 백이 부푼 것은 승화로 입자 사이의 거리가 멀어졌기 때문이다.","ㄷ. 지퍼 백이 부푼 것은 입자의 개수가 늘어났기 때문이다."],
  c:BG5, a:4,
  ex:"상태가 변해도 입자의 개수가 그대로이므로 질량은 같다. 드라이아이스가 승화하면 입자 사이의 거리가 멀어져 부피가 커진다. (교과서 122~124쪽)" },
{ id:"T23", u:"G", p:"122-125", t:"mc", tag:"성질 변화", fixed:true,
  q:"초콜릿을 중탕하여 녹였을 때 변하지 않는 것만을 〈보기〉에서 고른 것은?",
  bg:["ㄱ. 초콜릿의 맛","ㄴ. 초콜릿의 질량","ㄷ. 초콜릿 입자의 종류","ㄹ. 초콜릿 입자의 배열"],
  c:BG34, a:1,
  ex:"상태가 변해도 입자의 종류(→ 성질, 맛)와 개수(→ 질량)는 그대로이다. 융해하면 입자 배열이 불규칙해지므로 ㄹ은 변한다. (교과서 122~125쪽)" },
{ id:"T24", u:"I", p:"130-132", t:"mc", tag:"가열 곡선", fig:"topHeatX", fixed:true,
  q:"그림은 고체 물질 X를 가열할 때의 온도 변화를 나타낸 것이다. 이에 대한 설명으로 옳은 것만을 〈보기〉에서 고른 것은?",
  bg:["ㄱ. ㉠ 구간에서는 고체와 액체가 함께 있다.","ㄴ. ㉠ 구간에서 흡수한 열에너지는 온도를 높이는 데 쓰이지 않고 상태를 바꾸는 데 쓰인다.","ㄷ. ㉡ 구간에서는 입자 배열이 불규칙해지는 상태 변화가 일어나 온도가 올라간다.","ㄹ. ㉢ 구간에서는 열에너지를 흡수하지 않기 때문에 온도가 일정하다."],
  c:BG4, a:1,
  ex:"㉠(50 ℃) 융해 구간: 고체+액체, 흡수한 열이 상태 변화에 쓰여 온도 일정. ㉡ 액체의 온도가 올라가는 구간(상태 변화 아님). ㉢(80 ℃) 끓는 구간: 열을 계속 흡수하지만 기화에 쓰여 온도가 일정하다. (교과서 130~132쪽)" },
{ id:"T25", u:"I", p:"134-135", t:"mc", tag:"냉각 곡선", fig:"topCoolX",
  q:"그림은 액체 물질 Y를 냉각할 때의 온도 변화를 나타낸 것이다. 이에 대한 설명으로 옳은 것은?",
  c:["㉡ 구간에서 Y는 열에너지를 방출하면서 응고한다.","㉡ 구간에서 온도가 일정한 것은 냉각을 잠시 멈추었기 때문이다.","㉡ 구간에서는 액체만 존재한다.","㉢ 구간에서 입자 배열은 점점 불규칙해진다.","㉡ 구간에서 Y는 주위의 열에너지를 흡수한다."], a:1,
  ex:"㉡ 구간은 응고 구간이다. 응고하면서 열에너지를 방출하므로 계속 냉각해도 온도가 일정하고, 액체와 고체가 함께 있다. ㉢은 고체가 식는 구간으로 입자 배열은 규칙적이다. (교과서 134~135쪽)" },
{ id:"T26", u:"K", p:"136-138", t:"mc", tag:"흡수하는 상태 변화", fixed:true,
  q:"상태 변화가 일어나며 주위의 온도를 낮추는 데 이용한 것만을 〈보기〉에서 고른 것은?",
  bg:["ㄱ. 운동 중 다친 부위에 액체 냉각 스프레이를 뿌리면 금세 시원해진다.","ㄴ. 겨울철 비닐하우스 안에 물을 담은 통을 놓아 작물이 어는 것을 막는다.","ㄷ. 생선을 운반할 때 얼음 위에 올려 둔다.","ㄹ. 수증기(스팀)를 뿜어 옷의 주름을 편다."],

  ps:"(가) 고민 상담 게시판에서 학생들은 이름을 밝히지 않고 털어놓기 어려운 고민을 솔직하게 나눈다.\n(나) 나이·국적·직업과 관계없이 누구나 참여하는 온라인 백과사전은 수많은 사람이 함께 고치고 덧붙이며 만들어진다.\n(다) 검색 한 번에 수많은 자료가 쏟아져서, 정확한 정보를 골라내는 능력이 중요해졌다.",
  q:"(가)~(다)에 가장 잘 드러난 가상공간의 특성을 옳게 짝 지은 것은?",
  c:["(가) 개방성 (나) 익명성 (다) 다양성","(가) 익명성 (나) 다양성 (다) 개방성","(가) 다양성 (나) 개방성 (다) 익명성","(가) 익명성 (나) 개방성 (다) 다양성","(가) 개방성 (나) 다양성 (다) 익명성"], a:4,
  ex:"(가) 자신이 누구인지 드러나지 않는 익명성, (나) 누구에게나 열린 개방성(→ 집단 지성), (다) 다양한 정보가 존재하는 다양성. (교과서 97~98쪽)" },
{ id:"T2", u:"A", p:"97", t:"mc", tag:"익명성", fixed:true,
  q:"가상공간의 익명성이 가진 긍정적인 측면만을 〈보기〉에서 고른 것은?",
  bg:["ㄱ. 사회적 지위와 관계없이 솔직한 의견을 낼 수 있어 민주적 토론이 가능하다.","ㄴ. 거짓 정보를 퍼뜨려도 죄책감을 덜 느낀다.","ㄷ. 현실에서 드러내기 어려운 다양한 정체성을 표현할 수 있다.","ㄹ. 다른 사람을 비방하는 무책임한 행동이 늘어난다."],
  c:BG4, a:2,
  ex:"익명성의 긍정적 측면: 솔직한 의견, 민주적 토론, 다양한 정체성 표현(ㄱ, ㄷ). 부정적 측면: 비방·거짓 정보에 죄책감이 적어 무책임한 행동이나 폭력으로 이어질 수 있음(ㄴ, ㄹ). (교과서 97쪽)" },
{ id:"T3", u:"A", p:"98", t:"mc", tag:"집단 지성",
  ps:"온라인 백과사전의 한 항목은 처음에 짧은 몇 줄이었지만, 전 세계 수많은 사용자가 자발적으로 내용을 고치고 출처를 보태면서 전문 서적 못지않게 풍부해졌다. 이를 본 갑은 “결국 그중 가장 똑똑한 사람 한 명이 다 정리한 거겠지.”라고 말했다.",
  q:"갑의 생각을 바로잡는 말로 가장 적절한 것은?",
  c:["가상공간에서는 정보가 전문가에게서만 한 방향으로 전달돼.","여러 사람이 자발적으로 협력하면 가장 똑똑한 한 사람보다 더 큰 지혜를 얻을 수 있어.","익명성 때문에 아무도 정보를 고칠 수 없어.","정보가 많아질수록 정확한 정보를 찾을 필요가 없어져.","가상공간은 특정한 자격을 갖춘 사람에게만 열려 있어."], a:2,
  ex:"집단 지성은 여러 사람이 협력하면 가장 똑똑한 한 사람보다 더 큰 지혜를 얻는다는 뜻으로, 가상공간의 개방성 덕분에 가능하다. (교과서 98쪽)" },
{ id:"T4", u:"A", p:"96", t:"mc", tag:"가상공간과 삶의 변화", fixed:true,
  q:"가상공간이 우리 삶에 가져온 변화로 옳은 것만을 〈보기〉에서 고른 것은?",
  bg:["ㄱ. 누구나 정보의 생산자이자 소비자가 될 수 있다.","ㄴ. 정보가 소수의 생산자에게서 대중에게 한 방향으로만 전달된다.","ㄷ. 가상 현실 기술로 화재 대피처럼 위험한 상황도 안전하게 훈련할 수 있다.","ㄹ. 공통 관심사를 중심으로 한 관계 맺기가 줄어들었다."],
  c:BG4, a:2,
  ex:"가상공간에서는 모두가 정보 생산자이자 소비자이며 정보가 쌍방향으로 전달된다(ㄱ). VR·AR로 경험의 폭이 넓어졌다(ㄷ). 공통 관심사로 관계를 맺는 등 사회적 관계가 다양해졌다(ㄹ 틀림). (교과서 96쪽)" },
{ id:"T5", u:"B", p:"100-102", t:"mc", tag:"가상공간의 도덕적 문제", fixed:true,
  q:"가상공간의 도덕적 문제 가운데 사회적 문제에 해당하는 것만을 〈보기〉에서 고른 것은?",
  bg:["ㄱ. 관심 있는 정보만 골라 보다가 생각이 한쪽으로 치우쳤다.","ㄴ. 딥페이크로 만든 정치인의 가짜 연설 영상이 퍼져 사회가 혼란스러워졌다.","ㄷ. 게임을 하느라 밤을 새워 학업 능률이 떨어졌다.","ㄹ. 유료 글꼴을 허락 없이 내려받아 홍보물을 만들었다."],
  c:BG4, a:4,
  ex:"사회적 문제: 허위 조작 정보(ㄴ), 타인의 권리 침해(ㄹ 지식 재산권 침해), 가상공간의 폭력. 개인적 문제: 정보 편식(ㄱ), 디지털 중독(ㄷ), 자아 정체성 혼란. (교과서 100~102쪽)" },
{ id:"T6", u:"B", p:"101", t:"mc", tag:"필터 버블과 확증 편향", fixed:true,
  ps:"갑은 알고리즘이 추천하는 영상만 보다가 특정 지역 사람들을 비하하는 영상을 계속 접하게 되었다. 갑은 점점 그런 영상만 믿게 되었고, 결국 그 지역 출신 친구를 따돌리는 데 동참하였다.",
  q:"이 사례에 대한 분석으로 옳은 것만을 〈보기〉에서 고른 것은?",
  bg:["ㄱ. 갑은 걸러진 정보만 얻어 자신만의 생각에 갇히는 필터 버블에 빠졌다.","ㄴ. 정보 편식이 계속되면서 자기 생각에 맞는 정보만 믿는 확증 편향이 강해졌다.","ㄷ. 정보 편식은 개인적 문제이므로 다른 사람에게는 아무 영향을 주지 않는다.","ㄹ. 반대 의견을 일부러 찾아보고 자신의 생각을 스스로 비판해 보는 것이 해결에 도움이 된다."],
  c:BG34, a:2,
  ex:"정보 편식 → 필터 버블·확증 편향 → 고정 관념과 편견 → 차별과 갈등으로 이어질 수 있다(ㄷ 틀림). 사용 기록 삭제, 반대 의견 검색, 스스로 비판해 보기로 벗어날 수 있다. (교과서 101쪽)" },
{ id:"T7", u:"B", p:"101", t:"mc", tag:"디지털 중독", fixed:true,
  ps:"(가) 휴대 전화를 집에 두고 나오자 하루 종일 불안해서 아무것도 손에 잡히지 않았다.\n(나) 휴대 전화가 울리지 않았는데도 진동이 느껴져서 자꾸 화면을 확인한다.\n(다) 친구들 단체 대화방의 대화를 놓치면 나만 소외될까 봐 밤늦게까지 확인한다.",
  q:"(가)~(다)에 해당하는 디지털 중독 관련 증상을 옳게 짝 지은 것은?",
  c:["(가) 노모포비아 (나) 유령 진동 증후군 (다) 포모(FOMO)","(가) 포모(FOMO) (나) 유령 진동 증후군 (다) 노모포비아","(가) 노모포비아 (나) 포모(FOMO) (다) 유령 진동 증후군","(가) 유령 진동 증후군 (나) 노모포비아 (다) 포모(FOMO)","(가) 디지털 격리 증후군 (나) 노모포비아 (다) 포모(FOMO)"], a:1,
  ex:"노모포비아: 휴대 전화가 없으면 불안함. 유령 진동 증후군: 울리지 않았는데 진동을 느낌. 포모(FOMO): 소외될까 두려움. (교과서 101쪽)" },
{ id:"T8", u:"B", p:"102", t:"mc", tag:"가상공간의 폭력",
  q:"가상공간에서의 폭력이 현실의 폭력보다 피해를 더 키울 수 있는 까닭으로 가장 적절한 것은?",
  c:["가상공간의 폭력은 법으로 처벌할 수 없기 때문이다.","직접 만나지 않아 가해자가 죄책감을 덜 느끼고, 한 번 퍼진 정보는 삭제하기 어려워 피해가 오래가기 때문이다.","가상공간에서는 피해자가 스스로 원해서 폭력을 당하기 때문이다.","가상공간에서는 모든 사람의 실명이 공개되기 때문이다.","가상공간의 폭력은 피해자만의 문제이기 때문이다."], a:2,
  ex:"직접 만나지 않아 가해자가 죄책감을 덜 느끼고, 한 번 퍼진 정보는 삭제하기 어려워 피해가 오래간다. (교과서 102쪽)" },
{ id:"T9", u:"B", p:"102", t:"mc", tag:"가상공간 범죄 예방",
  ps:"게임에서 알게 된 상대가 몇 주 동안 다정하게 대해 주며 게임 아이템을 선물하더니, 어느 날 “우리 사이니까 너 사진 좀 보내 줘. 아무한테도 말하지 마.”라고 했다.",
  q:"이 상황에서 가장 바람직한 행동은?",
  c:["그동안 받은 선물이 고마우니 사진을 보낸다.","부끄러우니 아무에게도 알리지 않고 혼자 해결한다.","상대의 기분이 상하지 않게 집 주소를 대신 알려 준다.","대화를 멈추고 대화 내용을 남겨 둔 뒤, 믿을 수 있는 어른에게 알려 도움을 요청한다.","상대를 달래기 위해 다른 친구의 사진을 보낸다."], a:4,
  ex:"그루밍 같은 범죄 예방: 개인 정보를 노출하지 않고, 이유 없는 접근이나 선물을 경계하며, 대화를 멈추고 믿을 수 있는 사람에게 알려 도움을 요청한다. (교과서 102쪽)" },
{ id:"T10", u:"C", p:"105-106", t:"mc", tag:"가상공간의 도덕적 원칙", fixed:true,
  ps:"(가) 인공지능이 써 준 답을 그대로 베끼지 않고, 근거를 따져 본 뒤 스스로 판단해 과제를 썼다.\n(나) 시각 장애인도 내용을 알 수 있도록 학급 누리집의 사진마다 설명 글을 달았다.\n(다) 내 댓글 하나가 가상공간 전체의 문화에 영향을 준다고 생각하고 신중하게 글을 쓴다.",
  q:"(가)~(다)와 가장 관련 깊은 도덕적 원칙을 옳게 짝 지은 것은?",
  c:["(가) 포용성 (나) 자율성 (다) 책임성","(가) 자율성 (나) 책임성 (다) 포용성","(가) 자율성 (나) 포용성 (다) 책임성","(가) 진정성 (나) 호혜성 (다) 공정성","(가) 책임성 (나) 포용성 (다) 자율성"], a:3,
  ex:"(가) 자율성: 행동을 주체적으로 결정하고 AI 정보를 비판 없이 받아들이지 않음. (나) 포용성: 누구나 쉽게 접근하도록 함. (다) 책임성: 내 행동이 가상공간 전체에 영향을 줌을 앎. (교과서 105~106쪽)" },
{ id:"T11", u:"C", p:"106", t:"mc", tag:"개인정보", fixed:true,
  q:"개인정보에 해당하는 것만을 〈보기〉에서 고른 것은?",
  bg:["ㄱ. 휴대 전화 잠금을 풀 때 쓰는 지문","ㄴ. 온라인 쇼핑몰에 남은 나의 결제 기록","ㄷ. 학교 누리집에 공개된 이번 달 급식 식단표","ㄹ. 출입 인증에 쓰는 나의 홍채 정보"],
  c:BG34, a:2,
  ex:"개인정보는 특정한 사람을 알아볼 수 있는 모든 정보로, 생체 정보(지문·홍채)와 온라인 활동 정보(결제 기록)도 포함된다. 급식 식단표는 특정 개인을 알아볼 수 있는 정보가 아니다. (교과서 106쪽)" },
{ id:"T12", u:"C", p:"107", t:"mc", tag:"잊힐 권리", fixed:true,
  q:"‘잊힐 권리’를 법으로 강하게 보장하는 것에 반대하는 입장의 근거만을 〈보기〉에서 고른 것은?",
  bg:["ㄱ. 자신에 관한 정보에 대한 권리는 당사자에게 있어야 한다.","ㄴ. 다른 사람의 알 권리와 표현의 자유를 침해할 수 있다.","ㄷ. 인터넷에 남은 정보가 범죄나 놀림에 악용되는 것을 막을 수 있다.","ㄹ. 공익을 위해 알려져야 할 정보까지 가려질 수 있다."],
  c:BG4, a:4,
  ex:"반대: 공익 정보 차단, 알 권리·표현의 자유 침해(ㄴ, ㄹ). 찬성: 자기 정보 권리는 당사자에게, 범죄·놀림에 악용 방지(ㄱ, ㄷ). (교과서 107쪽)" },
{ id:"T13", u:"C", p:"107", t:"mc", tag:"셰어런팅",
  ps:"갑의 부모님은 갑이 아기였을 때부터 목욕하는 모습, 우는 모습, 학교 이름이 보이는 사진까지 SNS에 꾸준히 올려 왔다. 중학생이 된 갑은 친구들이 그 사진을 찾아내 놀리자 몹시 속상해하였다.",
  q:"이 사례에서 문제가 되는 점을 가장 잘 지적한 것은?",
  c:["부모는 자녀의 보호자이므로 자녀의 사진을 마음대로 올려도 된다.","자녀의 정보 자기 결정권을 침해하고, 개인정보가 범죄 등에 악용될 수 있다.","사진을 올린 것은 지식 재산권 침해에 해당한다.","가상공간의 개방성 때문에 생긴 집단 지성의 사례이다.","SNS에 올린 사진은 언제든 완전히 지울 수 있으므로 문제가 없다."], a:2,
  ex:"셰어런팅은 부모가 자녀의 일상을 SNS에 정기적으로 올리는 행위로, 자녀의 정보 자기 결정권을 침해하고 범죄에 악용될 수 있다. (교과서 107쪽)" },
{ id:"T14", u:"C", p:"108", t:"mc", tag:"생성형 인공지능과 디지털 문해력",
  ps:"갑은 생성형 인공지능에게 역사 숙제를 물어보았다. 인공지능은 존재하지 않는 책 제목과 쪽수까지 붙여 그럴듯한 답을 내놓았다.",
  q:"갑에게 필요한 태도로 가장 적절한 것은?",
  c:["인공지능은 사람보다 정확하므로 답을 그대로 제출한다.","인공지능도 근거 없는 내용을 사실처럼 답할 수 있고, 치우친 데이터를 배우면 편견이 담길 수 있으므로 다른 자료로 확인한다.","출처가 적혀 있으면 반드시 사실이므로 확인할 필요가 없다.","인공지능의 답이 틀릴 수 있으니 가상공간의 정보는 아예 이용하지 않는다.","인공지능의 답을 친구들에게 먼저 공유해 반응을 보고 판단한다."], a:2,
  ex:"할루시네이션: 생성형 AI가 근거 없는 거짓 정보를 사실처럼 답하는 현상. AI가 치우친 데이터를 배우면 편견도 담긴다. 맹신하지 말고 다른 자료로 확인하는 디지털 문해력이 필요하다. (교과서 108쪽)" },
{ id:"T15", u:"C", p:"108-109", t:"mc", tag:"바람직한 활용을 위한 노력", fixed:true,
  ps:"(가) 하루 스마트폰 사용 시간을 정해 두고, 주말에는 친구들과 운동을 한다.\n(나) 기사를 공유하기 전에 작성자와 출처, 다른 언론의 보도를 확인한다.\n(다) 나와 다른 의견의 글도 끝까지 읽고, 내가 한쪽으로 치우치지 않았는지 돌아본다.",
  q:"(가)~(다)에 나타난 노력을 옳게 짝 지은 것은?",
  c:["(가) 타인 존중하기 (나) 디지털 문해력 키우기 (다) 절제력 갖추기","(가) 절제력 갖추기 (나) 열린 자세로 합리적 사고하기 (다) 디지털 문해력 키우기","(가) 절제력 갖추기 (나) 타인 존중하기 (다) 열린 자세로 합리적 사고하기","(가) 디지털 문해력 키우기 (나) 절제력 갖추기 (다) 타인 존중하기","(가) 절제력 갖추기 (나) 디지털 문해력 키우기 (다) 열린 자세로 합리적 사고하기"], a:5,
  ex:"(가) 이용 계획과 가상공간 밖 취미로 균형: 절제력. (나) 진위 확인: 디지털 문해력. (다) 다른 의견을 편견 없이, 스스로 돌아봄: 열린 자세로 합리적 사고. (교과서 108~109쪽)" },
{ id:"T16", u:"D", p:"116-117", t:"mc", tag:"인권의 특징", fixed:true,
  ps:"(가) “본인이 서명했더라도 평생 주인의 명령에 따르겠다는 노예 계약은 무효이다.”\n(나) “먹고사는 문제가 급하니 표현의 자유는 나중에 보장해도 된다는 주장은 옳지 않다.”\n(다) “먼 나라 아이들의 노동 착취 문제를 해결하려는 노력은 결국 나의 인권을 지키는 일이기도 하다.”",
  q:"(가)~(다)에 나타난 인권의 특징을 옳게 짝 지은 것은?",
  c:["(가) 불가침성 (나) 보편성 (다) 상호 의존성","(가) 양도 불가능성 (나) 불가분성 (다) 상호 의존성","(가) 양도 불가능성 (나) 상호 의존성 (다) 불가분성","(가) 보편성 (나) 불가분성 (다) 양도 불가능성","(가) 불가분성 (나) 양도 불가능성 (다) 보편성"], a:2,
  ex:"(가) 인권은 남에게 넘겨주거나 스스로 포기할 수 없다(양도 불가능성). (나) 인권은 나눌 수 없어 어느 권리가 더 소중하다고 여기면 안 된다(불가분성). (다) 개인의 인권은 모든 사람의 인권과 연결된다(상호 의존성). (교과서 116~117쪽)" },
{ id:"T17", u:"D", p:"116", t:"mc", tag:"인권의 보편성",
  q:"인권의 보편성에 비추어 볼 때 옳지 않은 주장은?",
  c:["난민도 인간이라는 이유만으로 인권을 지닌다.","노예 제도는 그것이 허용되던 시대에도 인권 침해였다.","아동은 부모의 소유물이 아니라 권리의 주체이다.","세금을 내는 국민에게만 인권이 온전히 보장되어야 한다.","이주 노동자도 우리와 똑같이 인간다운 대우를 받아야 한다."], a:4,
  ex:"인권은 오직 인간이라는 이유로 시대와 장소, 조건이나 자격과 관계없이 모든 사람에게 주어진다(보편성). 세금 납부 같은 자격을 조건으로 내세우는 것은 보편성에 어긋난다. (교과서 116쪽)" },
{ id:"T18", u:"D", p:"118", t:"mc", tag:"인권이 추구하는 가치",
  ps:"밤 11시, 갑은 “내 집에서 내 마음대로 음악을 크게 트는 건 나의 자유야.”라며 이웃의 항의를 무시했다.",
  q:"갑에게 해 줄 수 있는 조언으로 가장 적절한 것은?",
  c:["자유는 무한하므로 갑의 행동은 정당하다.","자유는 남에게 해를 끼치지 않는 범위 안에서 누릴 수 있다.","평등은 모든 사람이 똑같은 음악을 들어야 한다는 뜻이다.","이웃의 권리보다 자신의 권리가 언제나 더 중요하다.","인권은 법으로 정해진 것만 보장되므로 갑의 행동은 문제가 없다."], a:2,
  ex:"자유는 구속에서 벗어나 자신의 의지대로 사는 것이지만, 남에게 해를 끼치지 않는 한에서 누릴 수 있다. (교과서 118쪽)" },
{ id:"T19", u:"E", p:"124-125", t:"mc", tag:"인권 감수성", fixed:true,
  ps:"학교 승강기는 교직원만 이용할 수 있다. 다리를 다쳐 깁스를 한 학생이 매일 4층 교실까지 계단을 오르는 모습을 보고, 갑은 “규칙이 원래 그래.”라고 했다. 을은 “다친 친구가 안전하게 이동할 권리가 지켜지지 않는 것 같아.”라고 말하며 학생회에 건의서를 냈다.",
  q:"이에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
  bg:["ㄱ. 을은 이 상황을 인권 문제로 알아차렸다.","ㄴ. 을은 문제를 해결할 책임이 자신에게도 있다고 여겼다.","ㄷ. 갑의 “원래 그래.”라는 말은 당연하게 여기던 생각을 성찰한 태도이다."],
  c:BG5, a:4,
  ex:"인권 감수성은 상황을 인권 문제로 알아차리고, 내 행동이 남에게 미칠 영향을 이해하며, 해결할 책임이 나에게 있다고 느끼는 것이다(을). ‘원래 그래’는 차별을 정당화하는 말로, 성찰과 거리가 멀다. (교과서 124~125쪽)" },
{ id:"T20", u:"E", p:"125-126", t:"mc", tag:"인권 보장을 위한 노력", fixed:true,
  q:"인권 보장을 위한 사회적 차원의 노력만을 〈보기〉에서 고른 것은?",
  bg:["ㄱ. 국가 인권 위원회를 설치하여 인권 침해 사건을 조사한다.","ㄴ. 내가 평소에 쓰는 말 가운데 차별적인 표현이 없는지 돌아본다.","ㄷ. 장애인 의무 고용 제도가 잘 지켜지는지 점검한다.","ㄹ. 인권 감수성을 기르기 위해 인권 관련 책을 읽는다."],
  c:BG4, a:2,
  ex:"사회적 차원: 제도 마련·점검(ㄱ, ㄷ), 인권 교육. 개인적 차원: 인권 감수성 기르기, 당연하게 여기던 생각을 성찰하기(ㄴ, ㄹ). (교과서 125~126쪽)" },
{ id:"T21", u:"E", p:"126", t:"mc", tag:"모두를 위한 디자인",
  ps:"(가) 계단만 있던 오래된 도서관 입구 옆에 휠체어 리프트를 새로 설치하였다.\n(나) 새로 짓는 도서관을 설계할 때부터 문턱 없는 출입구, 높낮이를 조절할 수 있는 책상, 그림 안내판을 넣었다.",
  q:"(가), (나)에 대한 설명으로 옳은 것은?",
  c:["(가)는 모두를 위한 디자인, (나)는 배리어 프리에 해당한다.","(가)는 장애에 따른 장벽을 없애는 배리어 프리, (나)는 처음부터 누구나 편리하게 쓰도록 한 모두를 위한 디자인이다.","(가), (나)는 모두 평균 체격의 사람에게 딱 맞추어 설계한 것이다.","(나)는 장애인만을 위한 시설이므로 비장애인에게는 불편하다.","(가), (나)는 모두 인권 문제의 사례이다."], a:2,
  ex:"배리어 프리는 장애에 따라 장벽을 없애는 것이고, 모두를 위한 디자인(유니버설 디자인)은 성별·나이·장애와 관계없이 처음부터 누구나 편리하게 쓰도록 설계하는 것이다. (교과서 126쪽)" },
{ id:"T22", u:"E", p:"122-126", t:"mc", tag:"사회적 약자와 인권",
  q:"사회적 약자의 인권에 대한 설명으로 가장 적절한 것은?",
  c:["사회적 약자는 돈만 지원하면 인권이 충분히 보장된다.","아동은 부모의 소유이므로 부모가 모든 것을 결정해야 한다.","사회적 약자가 스스로 설 수 있도록 도와 권리와 책임을 함께 누리게 해야 한다.","이주 노동자는 노동력을 얻는 수단이므로 인권 보장 대상이 아니다.","인권은 이미 완성되었으므로 새로운 인권 문제는 생기지 않는다."], a:3,
  ex:"사회적 약자를 존중한다는 것은 일방적인 지원만이 아니라 자립해 권리와 책임을 누리도록 돕는 것이다. 아동은 권리의 주체이고, 이주 노동자를 수단으로만 대하는 것은 인권 침해이다. 인권의 영역은 지금도 넓어지고 있다. (교과서 122~126쪽)" },
{ id:"T23", u:"F", p:"131-132", t:"mc", tag:"종교의 자유", fixed:true,
  q:"종교의 자유에 대한 설명으로 옳은 것만을 〈보기〉에서 고른 것은?",
  bg:["ㄱ. 원하는 종교를 선택할 수 있고, 신앙을 강요받지 않을 권리가 있다.","ㄴ. 종교 행사의 자유는 다른 사람의 권리를 침해하더라도 무제한 보장된다.","ㄷ. 학교 급식에서 종교적 이유로 먹지 못하는 음식을 고려하는 것은 종교를 존중하는 노력이다.","ㄹ. 국가는 국민이 한 가지 종교를 믿도록 정할 수 있다."],
  c:BG4, a:2,
  ex:"헌법 제20조: 종교 선택의 자유, 신앙을 강요받지 않을 권리, 종교 행사의 자유. 단, 타인의 권리를 침해해서는 안 된다. 우리나라는 한 가지 종교만 인정하지 않는다. (교과서 131~132쪽)" },
{ id:"T24", u:"F", p:"130", t:"mc", tag:"문화 동화·병존·융합", fixed:true,
  ps:"(가) 이주민 가족의 고유 언어가 점점 사라지고, 자녀들은 주류 사회의 언어만 쓰게 되었다.\n(나) 한 거리에 베트남 음식점, 인도 음식점, 한식당이 각각의 모습을 지키며 함께 영업한다.\n(다) 한국의 불고기와 멕시코의 타코가 만나 ‘불고기 타코’라는 새로운 음식이 생겼다.",
  q:"(가)~(다)에 나타난 문화 변동의 모습을 옳게 짝 지은 것은?",
  c:["(가) 문화 융합 (나) 문화 병존 (다) 문화 동화","(가) 문화 동화 (나) 문화 융합 (다) 문화 병존","(가) 문화 병존 (나) 문화 동화 (다) 문화 융합","(가) 문화 동화 (나) 문화 병존 (다) 문화 융합","(가) 문화 융합 (나) 문화 동화 (다) 문화 병존"], a:4,
  ex:"문화 동화: 한 문화가 다른 문화에 흡수·대체됨. 문화 병존: 여러 문화가 각각 존재함. 문화 융합: 결합해 새로운 문화가 생김. (교과서 130쪽)" },
{ id:"T25", u:"F", p:"129-130", t:"mc", tag:"다문화 사회",
  ps:"• OECD는 이주 배경 인구가 전체 인구의 5% 이상이면 다문화 국가로 본다.\n• 우리나라의 이주 배경 인구 비율: 2024년 4.89%",
  q:"이 자료와 관련된 설명으로 가장 적절한 것은?",
  c:["우리나라는 이주 배경 인구 비율이 이미 10%를 넘었다.","우리나라는 OECD 다문화 국가 기준에 가까워졌으며, 다양한 문화를 이해하고 존중하는 자세가 더욱 필요하다.","이주 배경 인구가 늘수록 외집단을 배척해야 갈등이 줄어든다.","세계화가 진행되면서 국가 간 교류가 줄어들었다.","다문화 사회가 되면 새로운 문화가 만들어질 기회가 사라진다."], a:2,
  ex:"4.89%는 OECD 기준 5%에 가깝다. 세계화로 교류가 활발해지면서 다문화 사회가 되었고, 다양한 문화 경험으로 생각의 폭이 넓어지고 새로운 문화가 창조될 수 있다. 외집단을 배척하면 갈등이 커진다. (교과서 129~130쪽)" },
{ id:"T26", u:"G", p:"134-135", t:"mc", tag:"문화를 바라보는 태도", fixed:true,
  ps:"(가) “메뉴판을 외국어로만 써야 고급스러워 보여.”\n(나) “우리 명절 음식이 최고지. 다른 나라 명절 음식은 이상해.”\n(다) “손으로 음식을 먹는 문화도 그 지역에서는 나름의 의미가 있을 거야.”",
  q:"(가)~(다)에 대한 설명으로 옳은 것만을 〈보기〉에서 고른 것은?",
  bg:["ㄱ. (가)와 (나)는 모두 특정 기준으로 문화를 평가하는 문화 절대주의에 속한다.","ㄴ. (나)는 사회 통합에 도움이 될 수 있지만 지나치면 다른 문화를 배척하게 된다.","ㄷ. (다)는 보편 규범에 어긋나는 문화까지 무조건 인정하는 극단적 문화 상대주의이다.","ㄹ. (가)는 자기 문화를 기준으로 다른 문화를 낮게 평가하는 태도이다."],
  c:BG4, a:1,
  ex:"(가) 문화 사대주의: 다른 문화를 높이고 자기 문화를 낮게 봄(ㄹ 틀림). (나) 자문화 중심주의. 둘 다 문화 절대주의이다. (다)는 맥락을 고려해 이해하는 문화 상대주의로, 보편 규범을 해치는 문화를 인정한 것이 아니다(ㄷ 틀림). (교과서 134~135쪽)" },
{ id:"T27", u:"G", p:"136-137", t:"mc", tag:"외집단에 대한 편견", fixed:true,

    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = { ok: [660, 880], bad: [220, 180], up: [523, 659, 784, 1047] }[kind];

/* ═════════════ 기록 · 점수 ═════════════ */
function qStats() {
  const m = {};
  for (const e of S().log) {
    const s = m[e.q] || (m[e.q] = { tries: 0, correct: 0, wrong: 0, streak: 0, last: 0 });
    s.tries++; s.last = e.t;
    if (e.r === "correct") { s.correct++; s.streak++; } else { s.wrong++; s.streak = 0; }
  }
  return m;
}
/* 진도: 단원별로 풀어 본 문항 수와 한 번 이상 맞힌 문항 수 */
function progressOf(code, db) {
  const bank = BANKS[code], log = ((db || DB).subj[code] || {}).log || [];
  const tried = new Set(log.map(e => e.q)), right = new Set(log.filter(e => e.r === "correct").map(e => e.q));
  const units = {};
  Object.keys(bank.units).forEach(k => { units[k] = { total: 0, tried: 0, right: 0 }; });
  bank.qs.forEach(q => { const u = units[q.u]; if (!u) return; u.total++; if (tried.has(q.id)) u.tried++; if (right.has(q.id)) u.right++; });
  const all = { total: 0, tried: 0, right: 0 };
  Object.values(units).forEach(u => { all.total += u.total; all.tried += u.tried; all.right += u.right; });
  return { units, ...all };
}
function nextUnit(code) { const e = Object.entries(progressOf(code).units).find(([, u]) => u.tried < u.total); return e ? e[0] : null; }
function progBar(tried, right, total) {
  return `<span class="pbar" aria-hidden="true"><i style="width:${total ? tried / total * 100 : 0}%"></i><b style="width:${total ? right / total * 100 : 0}%"></b></span>`;
}
function wrongList(includeMastered) {
  return Object.entries(qStats()).filter(([id, s]) => QMAP[id] && s.wrong > 0 && (includeMastered || s.streak < 2))
    .map(([id, s]) => ({ id, ...s, mastered: s.streak >= 2 })).sort((a, b) => b.wrong - a.wrong || b.last - a.last);
}
function groupStats(keyFn) {
  const m = {};
  for (const e of S().log) { const q = QMAP[e.q]; if (!q) continue; const k = keyFn(q); const s = m[k] || (m[k] = { k, n: 0, c: 0 }); s.n++; s.c += score(e.r); }
  return Object.values(m).map(s => ({ ...s, rate: s.c / s.n }));
}

/* 문제 한 개를 채점 기록하고 점수·콤보·도장을 계산 */
function record(qid, r, opts = {}) {
  const q = QMAP[qid];
  S().log.push({ q: qid, r, t: Date.now() });
  if (!G.days.includes(today())) G.days.push(today());
  let pts = r === "correct" ? 10 + (q.d - 1) * 5 : r === "partial" ? 5 : 2;
  if (!opts.silentCombo) {
    if (r === "correct") { G.combo++; if (G.combo >= 3) pts += 5; } else G.combo = 0;
    G.best = Math.max(G.best, G.combo);
  }
  const before = levelOf(G.xp);
  G.xp += pts; addWeekXp(pts);
  const up = levelOf(G.xp) > before ? levelOf(G.xp) : null;
  const newB = checkBadges();
  save();
  return { pts, combo: G.combo, up, newB };
}
function checkBadges(extra = []) {
  const got = [];
  const give = id => { if (!G.badges[id]) { G.badges[id] = Date.now(); got.push(id); } };
  const log = S().log, st = qStats();
  if (log.length) give("first");
  if (G.best >= 5) give("combo5");
  if (G.best >= 10) give("combo10");
  if (log.filter(e => e.r === "correct" && QMAP[e.q]?.d === 3).length >= 10) give("hard10");
  if (log.filter(e => e.r === "correct" && QMAP[e.q] && (QMAP[e.q].bg || QMAP[e.q].ps)).length >= 20) give("bogi10");
  if (log.filter(e => e.r === "correct" && QMAP[e.q]?.t === "essay").length >= 5) give("essay5");
  if (wrongList(true).filter(w => w.mastered).length >= 10) give("redeem10");
  if (Object.keys(UNITS).some(u => QS.some(q => q.u === u) && QS.filter(q => q.u === u).every(q => st[q.id]?.correct))) give("unit");
  if (QS.length && QS.every(q => st[q.id])) give("all");
  if (dayStreak() >= 3) give("days3");
  if (dayStreak() >= 7) give("days7");
  extra.forEach(give);
  return got;
}
function celebrate(res) {
  if (res.up != null) { sfx("up"); confetti(); banner(`레벨 업! Lv.${res.up + 1}`, LEVELS[res.up].name, `Lv.${res.up + 1}`); }
  res.newB.forEach((id, i) => setTimeout(() => banner(`새 도장: ${BMAP[id].name}`, BMAP[id].desc, BMAP[id].seal.replace("\n", "<br>")), 600 + i * 1400));
  drawChrome();
}

/* ═════════════ 랭킹 ═════════════ */
/* 온라인 랭킹: GitHub Pages 버전에서 web/online-config.json에 Supabase 주소·키를 넣고
   build-site.mjs를 실행하면 켜집니다. 비어 있으면 '이 기기' 랭킹만 보여 줍니다. */
const ONLINE = { url: "", key: "", group: "" };
const SOLO = true;   // 혼자용 링크(build-solo.mjs)에서만 true: 랭킹을 숨김
const onlineOn = () => !!(ONLINE.url && ONLINE.key);
const GROUP = () => ONLINE.group || "all";   // 모임 코드를 따로 정하지 않으면 이 앱을 쓰는 모든 사람이 한 랭킹
const PTS_PER_Q = 15;   // 문제 하나를 맞히면 받는 평균 점수 (따라잡기 안내용)
function weekId(d = new Date()) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y = t.getUTCFullYear(), w = Math.ceil(((t - Date.UTC(y, 0, 1)) / 864e5 + 1) / 7);
  return `${y}-W${String(w).padStart(2, "0")}`;
}
function addWeekXp(pts) { const w = weekId(); if (!G.week || G.week.id !== w) G.week = { id: w, xp: 0 }; G.week.xp += pts; }
function streakOf(days) {
  const set = new Set(days || []); let n = 0; const d = new Date();
  if (!set.has(today())) d.setDate(d.getDate() - 1);
  while (set.has(`${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`)) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
/* 한 사람의 기록을 랭킹용 숫자로 요약 */
function summary(db, name) {
  const g = db.game || {}; let n = 0, c = 0, solved = 0;
  for (const k in db.subj || {}) {
    const log = db.subj[k].log || []; n += log.length;
    c += log.reduce((a, e) => a + score(e.r), 0); solved += new Set(log.map(e => e.q)).size;
  }
  return { name, xp: g.xp || 0, week_xp: g.week && g.week.id === weekId() ? g.week.xp : 0, level: levelOf(g.xp || 0) + 1,
    solved, accuracy: n ? c / n : null, streak: streakOf(g.days),
    progress: Object.fromEntries(Object.keys(BANKS).filter(code => BANKS[code].qs.length).map(code => { const p = progressOf(code, db); return [code, { tried: p.tried, right: p.right, total: p.total, units: p.units }]; })) };
}
function localBoard() { return profiles.map(p => p.name === who ? summary(DB, who) : summary(readJSON(profileKey(p.name), freshDB()), p.name)); }

let boardCache = { rows: null, at: 0, err: null }, lastPush = 0;
function apiHeaders(extra) { return Object.assign({ apikey: ONLINE.key, Authorization: `Bearer ${ONLINE.key}` }, extra || {}); }
async function pushScore(force) {
  if (!onlineOn() || !who) return;
  if (!force && Date.now() - lastPush < 20000) return;
  lastPush = Date.now();
  const s = summary(DB, who);
  try {
    await fetch(`${ONLINE.url}/rest/v1/leaderboard`, {
      method: "POST",
      headers: apiHeaders({ "Content-Type": "application/json", Prefer: "resolution=merge-duplicates,return=minimal" }),
      body: JSON.stringify({ group_code: GROUP(), name: who, xp: s.xp, week_id: weekId(), week_xp: s.week_xp, level: s.level,
        solved: s.solved, accuracy: s.accuracy, streak: s.streak, progress: s.progress, updated_at: new Date().toISOString() }),
    });
  } catch (e) { /* 인터넷이 끊겨도 문제 풀기는 계속됨 */ }
}
/* 관리자 화면(admin.html)용 활동 기록: 접속과 끝낸 세트를 한 줄씩 보냄.
   인터넷이 끊기면 이 기기에 모아 두었다가 다음에 함께 보냄. 읽기는 관리자 계정만 가능. */
const LOGQ_KEY = "exam-solo-logq";
function deviceKind() { const u = navigator.userAgent; return /iPad|Tablet|Android(?!.*Mobile)/i.test(u) || (/Macintosh/.test(u) && navigator.maxTouchPoints > 1) ? "태블릿" : /Mobi|iPhone|Android/i.test(u) ? "휴대폰" : "컴퓨터"; }
let flushing = false;
async function logActivity(row) {
  if (!onlineOn()) return;
  const q = readJSON(LOGQ_KEY, []);
  if (row) q.push({ group_code: GROUP(), device: deviceKind(), created_at: new Date().toISOString(), ...row });
  writeJSON(LOGQ_KEY, q.slice(-300));
  if (flushing || !q.length) return;
  flushing = true;
  try {
    const batch = readJSON(LOGQ_KEY, []);
    const r = await fetch(`${ONLINE.url}/rest/v1/activity_log`, {
      method: "POST", headers: apiHeaders({ "Content-Type": "application/json", Prefer: "return=minimal" }), body: JSON.stringify(batch),
    });
    if (r.ok) writeJSON(LOGQ_KEY, readJSON(LOGQ_KEY, []).slice(batch.length));
  } catch (e) { /* 다음에 다시 보냄 */ }

}
const visited = new Set();
function logVisit() {
  if (!who || visited.has(who)) return;
  visited.add(who);
  logActivity({ name: who, kind: "visit" });
}
function logSession(s) {
  const items = s.qids.map(id => { const a = s.ans[id] || {}; return { q: id, r: a.r || "wrong", ua: String(a.ua || "").slice(0, 300) }; });
  logActivity({ name: who, kind: "session", subject, mode: s.mode, n: s.qids.length, score: sessScore(s),
    units: [...new Set(s.qids.map(id => QMAP[id]?.u).filter(Boolean))], duration_ms: s.end - s.start, xp: s.xp || 0, items });
}
async function fetchBoard() {
  const r = await fetch(`${ONLINE.url}/rest/v1/leaderboard?group_code=eq.${encodeURIComponent(GROUP())}&select=*`, { headers: apiHeaders() });
  if (!r.ok) throw new Error(`랭킹 서버 응답 오류 (${r.status})`);
  const rows = await r.json();
  const wk = weekId();
  boardCache = { rows: rows.map(x => ({ ...x, week_xp: x.week_id === wk ? x.week_xp : 0 })), at: Date.now(), err: null };
  return boardCache.rows;
}
/* 지금 보여 줄 명단: 온라인 명단(있으면) + 이 기기 사람들의 최신 기록 */
function currentBoard(scope) {
  const local = localBoard();
  if (scope !== "online" || !boardCache.rows) return local;
  const map = new Map(boardCache.rows.map(r => [r.name, { ...r }]));
  local.forEach(l => { if (l.name === who || map.has(l.name)) map.set(l.name, { ...map.get(l.name), ...l }); });
  return [...map.values()];
}
function ranked(rows, key) {
  const list = rows.slice().sort((a, b) => (b[key] || 0) - (a[key] || 0) || (b.xp || 0) - (a.xp || 0) || String(a.name).localeCompare(b.name));
  let prev = null, rank = 0;
  list.forEach((r, i) => { const v = r[key] || 0; if (v !== prev) { rank = i + 1; prev = v; } r.rank = rank; });
  return list;
}
function myPlace(rows, key) {
  const list = ranked(rows, key), me = list.find(r => r.name === who);
  if (!me) return null;
  const ahead = list.filter(r => (r[key] || 0) > (me[key] || 0)).pop();
  return { rank: me.rank, total: list.length, me, ahead, gap: ahead ? (ahead[key] || 0) - (me[key] || 0) : 0, list };
}
function chaseText(p, unit) {
  if (!p) return "";
  if (p.total < 2) return onlineOn() ? "아직 다른 참여자가 없어요. 먼저 점수를 쌓아 1등 자리를 차지해요!" : "아직 이 기기에서는 나 혼자예요. 문제를 풀어 점수를 먼저 쌓아 두세요!";
  if (p.rank === 1) return `${unit} 1등이에요! 자리를 지키려면 오늘도 몇 문제 풀어 볼까요?`;
  const k = Math.max(1, Math.ceil((p.gap + 1) / PTS_PER_Q));
  return `${p.ahead.name}님까지 ${p.gap + 1}점! 약 ${k}문제만 더 맞히면 ${p.rank - 1}등으로 올라가요.`;
}

/* ═════════════ 오늘의 복습 · 시험 계획 ═════════════ */
/* 오늘의 복습: 마지막으로 푼 날부터, 연속으로 맞힌 횟수에 따라 간격을 두고 다시 낸다.
   틀림 1일 → 1번 맞힘 2일 → 2번 4일 → 3번 7일 → 4번 이상 14일 */
const GAPS = [1, 2, 4, 7, 14], DAY = 864e5;
function dayStart(t) { const d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }
function subjOf(code) { return DB.subj[code] || (DB.subj[code] = { log: [], sessions: [], current: null }); }
function dueList(code = subject) {
  const ids = new Set(BANKS[code].qs.map(q => q.id)), m = {};
  for (const e of (DB.subj[code] || {}).log || []) {
    if (!ids.has(e.q)) continue;
    const s = m[e.q] || (m[e.q] = { streak: 0, last: 0 });
    s.last = e.t; s.streak = e.r === "correct" ? s.streak + 1 : 0;
  }
  const now = dayStart(Date.now());
  return Object.entries(m).map(([id, s]) => ({ id, due: dayStart(s.last) + GAPS[Math.min(s.streak, GAPS.length - 1)] * DAY }))
    .filter(x => x.due <= now).sort((a, b) => a.due - b.due).map(x => x.id);
}
/* 시험까지 남은 날 (시험 날짜가 없으면 null, 오늘이 시험이면 0) */
function examDate(code = subject) { const ex = (DB.subj[code] || {}).exam; if (!ex) return null; const [y, m, d] = ex.split("-").map(Number); return new Date(y, m - 1, d); }
function daysLeft(code = subject) { const d = examDate(code); return d ? Math.round((d - dayStart(Date.now())) / DAY) : null; }
function isoToday() { const d = new Date(), p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; }
function fmtExam(d) { return `${d.getMonth() + 1}월 ${d.getDate()}일(${"일월화수목금토"[d.getDay()]})`; }
/* 오늘 공부할 단원: 아직 다 풀어 보지 않은 단원을 남은 날에 나눔 (시험 전날은 모의고사·오답 정리).
   하루 동안은 계획을 고정해서, 단원을 끝내도 목표가 바뀌지 않게 함 */
function todayPlan(code = subject) {
  const st = subjOf(code), dl = daysLeft(code);
  if (dl == null || dl < 0) return null;
  const p = progressOf(code);
  const left = Object.keys(BANKS[code].units).filter(u => p.units[u].tried < p.units[u].total);
  const studyDays = dl >= 2 ? dl - 1 : 1;
  if (!st.plan || st.plan.day !== today() || st.plan.exam !== st.exam) {
    st.plan = { day: today(), exam: st.exam, units: dl === 0 ? [] : left.slice(0, Math.ceil(left.length / studyDays)) };
    save();
  }
  return { dl, units: st.plan.units, left: left.length, perDay: Math.ceil(left.length / studyDays), wrap: dl === 1 || (dl > 1 && !left.length) };
}
/* 허브·과목 화면에 쓰는 한 줄 요약 */
function todaySummary(code) {
  const plan = todayPlan(code), due = dueList(code).length, p = progressOf(code), parts = [];
  if (plan?.dl === 0) parts.push("오늘 시험!");
  const undone = plan ? plan.units.filter(u => p.units[u].tried < p.units[u].total).length : 0;
  if (undone) parts.push(`단원 ${undone}개`);
  if (plan?.wrap) parts.push("모의고사·오답 정리");
  if (due) parts.push(`복습 ${due}문제`);
  return { dl: plan ? plan.dl : null, text: parts.join(" · ") };
}
function ddayText(dl) { return dl === 0 ? "D-day" : `D-${dl}`; }

let examEdit = false;
function todayCard() {
  const st = S(), dl = daysLeft(), plan = todayPlan(), due = dueList(), p = progressOf(subject);
  const rows = [];

  const ed = examDate();

    : dl < 0 ? "시험 날짜가 지났어요. 다음 시험 날짜를 넣어 주세요."
    : dl === 0 ? `${fmtExam(ed)} 시험`
    : `${fmtExam(ed)} 시험 · ${plan.left ? `남은 단원 ${plan.left}개, 하루 ${plan.perDay}단원씩` : "모든 단원을 한 번씩 풀어 봤어요"}${dl >= 2 ? " · 시험 전날은 모의고사·오답 정리" : ""}`;
  return `<section class="sheet stack today">
    <div class="row"><h2 style="font-size:1.1rem">오늘 할 일</h2>${dl != null && dl >= 0 ? `<span class="dday">${ddayText(dl)}</span>` : ""}<span class="spacer"></span>

    ${examEdit ? `<div class="row"><input type="date" class="answer" id="t-date" value="${st.exam || ""}" min="${isoToday()}" aria-label="${BANKS[subject].name} 시험 날짜" style="width:auto;min-height:44px">
      <button class="btn small primary" id="t-save">저장</button>${st.exam ? `<button class="btn small" id="t-clear">날짜 지우기</button>` : ""}<button class="btn small ghost" id="t-cancel">취소</button></div>` : ""}

/* 최상위 대비: 덜 풀어 본 문제부터 n개를 골라 단원 순서로 */
function topPick(list, n) {
  const st = qStats();
  return shuffle(list).sort((a, b) => (st[a.id]?.tries || 0) - (st[b.id]?.tries || 0)).slice(0, n)
    .sort((a, b) => a.u.localeCompare(b.u) || a.id.localeCompare(b.id, "en", { numeric: true })).map(q => q.id);
}
/* 한 단원 문제를 덜 풀어 본 것부터 골라 풀기 */
function startUnit(u) {
  const st = qStats();
  const p = shuffle(QS.filter(q => q.u === u)).sort((a, b) => (st[a.id]?.tries || 0) - (st[b.id]?.tries || 0));
  startSession("normal", shuffle(p.slice(0, pickCount)).map(q => q.id));
}

/* ═════════════ 단원 내용 요약 ═════════════ */
let noteHide = false;                       // 가리고 외우기: 용어 뜻을 가렸다가 누르면 보여 줌
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
const fmtB = fmt;
const fmtK = s => esc(s).replace(/\*\*(.+?)\*\*/g, `<b class="kx" role="button" tabindex="0" title="눌러서 보기">$1</b>`);
let studyHide = false;                       // 기말 공부 화면: 핵심어 가리기
/* 기말고사 과목은 과학 공부방처럼 공부 → 암기 카드 → 문제 순서로 */
function isStudy(code = subject) { return termOf(code) === "final" && !!NOTES[code]; }

/* ═════════════ 암기 카드 (기말) ═════════════ */
let FC = null;
function deckOf(k) {
  const src = CARDS[subject] || {}, ks = k === "all" ? Object.keys(UNITS) : [k];
  return ks.flatMap(u => (src[u] || NOTES[subject]?.[u]?.terms || []).map(([f, b], i) => ({ id: u + i, u, f, b })));
}
function startCards(k) {
  const list = shuffle(deckOf(k));
  FC = { subject, k, list, total: list.length, known: 0, back: false, saved: false };
  go("cards", k);
}
function cards(k) {
  if (!k || !FC || FC.subject !== subject || FC.k !== k) return cardsHome();
  const c = FC.list[0];
  if (!c) {
    if (!FC.saved) { const d = S().cardsDone || (S().cardsDone = {}); d[k] = Date.now(); FC.saved = true; save(); sfx("up"); confetti(); }
    app.innerHTML = `<div class="stack">
      <section class="sheet empty stack" style="justify-items:center"><h2>${FC.total}장을 모두 외웠어요!</h2>
        <p style="margin:0">${k === "all" ? "전체 카드" : esc(UNITS[k].name)}를 끝냈어요. 이제 문제로 확인해 볼까요?</p>
        <div class="row" style="justify-content:center"><button class="btn" id="c-list">카드 목록</button><button class="btn" id="c-again">카드 다시 보기</button>
        <button class="btn primary" id="c-quiz">${k === "all" ? "문제 풀러 가기" : "이 단원 문제 풀기"}</button></div></section></div>`;
    $("#c-list").onclick = () => go("cards");
    $("#c-again").onclick = () => startCards(k);
    $("#c-quiz").onclick = () => k === "all" ? go("home") : startUnit(k);
    return;

/* ═════════════ 퀴즈 ═════════════ */
function startSession(mode, qids) {
  const orders = {};
  for (const id of qids) { const q = QMAP[id]; if (q.t === "mc") orders[id] = q.fixed ? [1, 2, 3, 4, 5] : shuffle([1, 2, 3, 4, 5]); }
  S().current = { id: Date.now(), mode, qids, orders, ans: {}, idx: 0, start: Date.now(), limit: EXAM_SEC[mode] || null, xp: 0 };
  G.combo = 0; save(); go("quiz");
}
function gradeAuto(q, ua) {
  if (q.t === "mc") return +ua === q.a ? "correct" : "wrong";
  if (q.t === "short") { const u = norm(ua); return u && [q.a, ...(q.acc || [])].some(a => norm(a) === u) ? "correct" : "wrong"; }
  if (q.kw) return gradeEssay(q, ua).r;
  return "pending";
}
/* 서술형 자동 채점: 핵심 내용 묶음마다 인정 표현이 하나라도 들어갔는지 본다 ("A&B"는 둘 다) */
/* 수학 답안: 음수 부호(-)와 = / ∠ 같은 기호는 남기고 띄어쓰기·쉼표만 지운다 */
function normMath(s) { return String(s || "").toLowerCase().replace(/[−–—]/g, "-").replace(/[\s,·]/g, ""); }
function gradeEssay(q, ua) {
  const nf = q.math ? normMath : norm, u = nf(ua);
  const hit = q.kw.map(([, alts]) => !!u && alts.some(a => a.split("&").every(p => u.includes(nf(p)))));
  const n = hit.filter(Boolean).length;
  return { hit, r: n === hit.length ? "correct" : n && n * 2 >= hit.length ? "partial" : "wrong" };
}
function kwHtml(q, ua) {
  const { hit } = gradeEssay(q, ua);
  return `<div><b>핵심 내용 채점</b><ul class="kwlist">${q.kw.map(([k], i) => `<li class="${hit[i] ? "ok" : "no"}">${hit[i] ? "✓" : "✗"} ${esc(k)}</li>`).join("")}</ul></div>`;
}
function qHead(q, n) {
  return `<div class="row"><span class="qno">${n}</span><span class="tag ${q.t}">${kind(q)}</span>
    ${q.top ? `<span class="tag top">최상위</span>` : ""}<span class="tag">${esc(UNITS[q.u].name)}</span><span class="spacer"></span><span class="small muted" aria-label="난이도 ${q.d}">${stars(q.d)}</span></div>`;
}
function qBody(q) {
  return (q.fig && FIGS[q.fig] ? `<figure class="fig">${FIGS[q.fig]()}</figure>` : "") + (q.ps ? `<div class="passage">${esc(q.ps)}</div>` : "") + `<div class="stem">${esc(q.q)}</div>` +
    (q.bg ? `<div class="bogi"><span class="bl">보기</span><ul>${q.bg.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "");
}
function answerInput(q, s, a) {
  const locked = a && a.r !== undefined && !isExam(s.mode);
  if (q.t === "mc") return `<div class="choices">${s.orders[q.id].map((orig, i) => `<button class="choice ${a && +a.ua === orig ? "sel" : ""}" data-v="${orig}" ${locked ? "disabled" : ""}>
      <span class="bubble">${i + 1}</span><span>${esc(q.c[orig - 1])}</span></button>`).join("")}</div>`;
  if (q.t === "short") return `<label class="small muted" for="ans">답</label><input class="answer" id="ans" autocomplete="off" value="${esc(a?.ua || "")}" ${locked ? "disabled" : ""} placeholder="낱말로 쓰세요">`;
  return `<label class="small muted" for="ans">답안</label><textarea class="answer" id="ans" ${locked ? "disabled" : ""} placeholder="조건에 맞게 문장으로 써 보세요">${esc(a?.ua || "")}</textarea>`;
}
function bindChoices(onPick) { $$(".choice").forEach(b => b.onclick = () => { $$(".choice").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); onPick(b.dataset.v); }); }
function answerText(q, ua, s) {
  if (!ua) return "(답 없음)";
  if (q.t === "mc") { const pos = s ? s.orders[q.id].indexOf(+ua) : +ua - 1; return `${NUM[pos] || ""} ${q.c[+ua - 1] || ""}`; }
  return ua;
}
function rightText(q, s) {
  if (q.t === "mc") { const pos = s ? s.orders[q.id].indexOf(q.a) : q.a - 1; return `${NUM[pos]} ${q.c[q.a - 1]}`; }
  return q.a;
}

function quiz() {
  const s = S().current;
  if (!s) return go("home");
  if (isExam(s.mode)) return mockView(s);
  if (s.idx >= s.qids.length) return finish();
  const qid = s.qids[s.idx], q = QMAP[qid], a = s.ans[qid];
  app.innerHTML = `
  <div class="stack">
    <div class="progress"><div class="bar"><i style="width:${s.idx / s.qids.length * 100}%"></i></div>
      ${G.combo >= 2 ? `<span class="combo">${G.combo}연속</span>` : ""}<div class="count">${s.idx + 1} / ${s.qids.length}</div></div>
    <article class="sheet stack qcard" id="card" aria-live="polite">
      ${qHead(q, s.idx + 1)}${qBody(q)}${answerInput(q, s, a)}
      <div id="fb"></div>
      <div class="row" id="act"><span class="spacer"></span><button class="btn primary big" id="submit">제출</button></div>
    </article>
    <p class="small muted" style="margin:0">객관식은 키보드 숫자 1~5로도 고를 수 있어요.</p>
  </div>`;
  let picked = null;
  bindChoices(v => { picked = v; });
  const inp = $(".answer");
  if (inp && q.t === "short") inp.addEventListener("keydown", e => { if (e.key === "Enter") $("#submit")?.click(); });
  if (a && a.r !== undefined) return showFeedback(s, q, null);
  $("#submit").onclick = () => {
    const ua = q.t === "mc" ? picked : inp.value.trim();
    if (!ua) return toast(q.t === "mc" ? "답을 골라 주세요." : "답을 써 주세요.");
    const r = gradeAuto(q, ua);
    s.ans[qid] = { ua, r };
    let res = null;
    if (r !== "pending") { res = record(qid, r); s.xp += res.pts; }
    save(); showFeedback(s, q, res);
  };
}

const PRAISE = ["참 잘했어요", "훌륭해요", "정확해요", "멋져요"];
function feedbackHtml(q, a, res) {
  if (q.t === "essay" && a.r === "pending") {
    return `<div class="fb pending">
      <div><span class="mark">?</span> <b>모범답안·채점 기준과 비교해서 스스로 채점해 보세요</b></div>
      <dl class="kv"><dt>모범답안</dt><dd>${esc(q.a)}</dd><dt>채점 기준</dt><dd>${esc(q.rb)}</dd></dl>
      <div class="self" role="group" aria-label="스스로 채점"><button data-self="correct">O 다 썼어요</button><button data-self="partial">△ 일부만</button><button data-self="wrong">X 못 썼어요</button></div></div>`;
  }
  const head = a.r === "correct"
    ? `<span class="mark">O</span> <b>정답!</b> ${res ? `<span class="gain">+${res.pts}점</span>${res.combo >= 3 ? ` <span class="combo">${res.combo}연속 콤보 보너스!</span>` : ""}` : ""}`
    : a.r === "partial" ? `<span class="mark">△</span> <b>조금만 더!</b> ${res ? `<span class="gain">+${res.pts}점</span>` : ""}`
    : `<span class="mark">X</span> <b>아깝다!</b> <span class="small">오답노트에 저장했어요. 해설을 읽으면 다음엔 맞힐 수 있어요.</span> ${res ? `<span class="gain">+${res.pts} 도전 점수</span>` : ""}`;
  return `<div class="fb ${a.r}">
    <div>${head}</div>
    ${q.t !== "mc" ? `<dl class="kv"><dt>${q.t === "essay" ? "모범답안" : "정답"}</dt><dd>${esc(q.a)}</dd>
      ${q.t === "short" && q.acc?.length ? `<dt>인정 답</dt><dd>${esc(q.acc.join(", "))}</dd>` : ""}
      ${q.rb ? `<dt>채점 기준</dt><dd>${esc(q.rb)}</dd>` : ""}</dl>` : ""}
    ${q.kw ? kwHtml(q, a.ua) : ""}
    <div><b>해설</b> ${esc(q.ex)}</div>
    ${a.r !== "correct" && noteLink(q) ? `<div class="row">${noteLink(q)}<span class="small muted">개념을 다시 보고 오면 기억에 더 오래 남아요.</span></div>` : ""}
    ${(q.t === "short" || q.kw) && a.r !== "correct" && a.ua ? `<div><button class="btn small" id="accept">뜻이 같은 답이면 정답으로 바꾸기</button></div>` : ""}
  </div>`;
}
function showFeedback(s, q, res) {
  const a = s.ans[q.id];
  if (q.t === "mc") $$(".choice").forEach(b => {
    b.disabled = true;
    if (+b.dataset.v === q.a) b.classList.add("right"); else if (+b.dataset.v === +a.ua) b.classList.add("wrong");
  });
  else $(".answer").disabled = true;
  $("#fb").innerHTML = feedbackHtml(q, a, res);
  const card = $("#card");
  $$(".stamp", card).forEach(x => x.remove());
  if (res) {
    if (a.r === "correct") {
      card.insertAdjacentHTML("beforeend", `<div class="stamp" aria-hidden="true">${PRAISE[Math.floor(Math.random() * PRAISE.length)].replace(" ", "<br>")}</div>`);
      sfx("ok"); if (res.combo >= 3 && res.combo % 3 === 0) confetti();
    } else if (a.r === "wrong") { sfx("bad"); card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake"); }
    celebrate(res);
  } else if (a.r === "correct") card.insertAdjacentHTML("beforeend", `<div class="stamp" aria-hidden="true">참<br>잘했어요</div>`);
  $$("[data-self]").forEach(b => b.onclick = () => { a.r = b.dataset.self; const r2 = record(q.id, a.r); s.xp += r2.pts; save(); showFeedback(s, q, r2); });
  bindNoteLinks();
  const acc = $("#accept");
  if (acc) acc.onclick = () => {
    a.r = "correct";
    const log = S().log;
    for (let i = log.length - 1; i >= 0; i--) if (log[i].q === q.id) { log[i].r = "correct"; break; }
    const bonus = 10 + (q.d - 1) * 5 - 2; G.xp += bonus; addWeekXp(bonus); s.xp += bonus;
    save(); showFeedback(s, q, { pts: bonus, combo: G.combo, up: null, newB: checkBadges() }); toast("정답으로 바꿨어요.");
  };
  const last = s.idx === s.qids.length - 1;
  $("#act").innerHTML = a.r === "pending" ? "" : `<span class="spacer"></span><button class="btn primary big" id="next">${last ? "결과 보기" : "다음 문제"}</button>`;
  const nx = $("#next");
  if (nx) { nx.focus({ preventScroll: true }); nx.onclick = () => { s.idx++; save(); if (s.idx >= s.qids.length) finish(); else quiz(); window.scrollTo(0, 0); }; }
}

/* 모의고사 */
function mockView(s) {
  const n = s.qids.length;
  if (s.idx >= n) s.idx = n - 1;
  const qid = s.qids[s.idx], q = QMAP[qid];
  const done = s.qids.filter(id => (s.ans[id]?.ua || "").trim()).length;
  app.innerHTML = `
  <div class="stack">
    <div class="progress"><div class="bar"><i style="width:${done / n * 100}%"></i></div><span class="timer" id="timer"></span></div>
    ${s.mode === "topw" ? `<p class="small muted" style="margin:0">핵심 용어를 쓰고, 그 뜻이나 까닭까지 문장으로 풀어 쓰세요. 핵심 내용이 모두 들어가면 정답, 절반 이상이면 부분 정답이에요.</p>` : ""}
    <article class="sheet stack">
      ${qHead(q, s.idx + 1)}${qBody(q)}${answerInput(q, s, s.ans[qid])}
      <div class="row"><button class="btn" id="prev" ${s.idx === 0 ? "disabled" : ""}>이전</button><span class="spacer"></span>
        ${s.idx < n - 1 ? `<button class="btn primary" id="next">다음</button>` : ""}</div>
    </article>
    <section class="sheet stack">
      <div class="row"><b>답안지</b><span class="small muted">${done} / ${n} 작성</span></div>
      <div class="palette">${s.qids.map((id, i) => `<button class="${(s.ans[id]?.ua || "").trim() ? "done" : ""} ${i === s.idx ? "cur" : ""}" data-i="${i}" aria-label="${i + 1}번">${i + 1}</button>`).join("")}</div>
      <button class="btn primary big block" id="submit-all">제출하고 채점하기</button>
    </section>
  </div>`;
  const put = v => { s.ans[qid] = { ua: v }; save(); };
  bindChoices(v => { put(v); mockView(s); });
  const inp = $(".answer");
  if (inp) inp.addEventListener("input", () => put(inp.value));
  const moveTo = i => { s.idx = i; save(); mockView(s); window.scrollTo(0, 0); };
  $("#prev").onclick = () => moveTo(s.idx - 1);
  if ($("#next")) $("#next").onclick = () => moveTo(s.idx + 1);
  $$(".palette button").forEach(b => b.onclick = () => moveTo(+b.dataset.i));
  const sub = $("#submit-all");
  sub.onclick = () => {
    const left = n - s.qids.filter(id => (s.ans[id]?.ua || "").trim()).length;
    if (left && !sub.dataset.armed) { sub.dataset.armed = "1"; sub.textContent = `${left}문항이 비어 있어요. 한 번 더 누르면 제출`; return; }
    finish();
  };
  clearInterval(timerId);
  const el = $("#timer");
  const tick = () => {
    const left = Math.max(0, Math.round(s.limit - (Date.now() - s.start) / 1000));
    el.textContent = `${String(Math.floor(left / 60)).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`;
    el.classList.toggle("low", left <= 300);
    if (left <= 0) { clearInterval(timerId); toast("시간이 끝나서 자동으로 제출했어요."); finish(); }
  };
  tick(); timerId = setInterval(tick, 1000);
}

function finish() {
  clearInterval(timerId);
  const st = S(), s = st.current; if (!s) return go("home");
  const before = levelOf(G.xp), gotB = [];
  if (isExam(s.mode)) {
    G.combo = 0;
    for (const id of s.qids) {
      const q = QMAP[id], ua = (s.ans[id]?.ua || "").trim();
      const r = q.t === "essay" && !q.kw ? (ua ? "pending" : "wrong") : gradeAuto(q, ua);
      s.ans[id] = { ua, r };
      if (r !== "pending") { const res = record(id, r); s.xp += res.pts; gotB.push(...res.newB); }
    }
  } else {
    for (const id of s.qids) if (!s.ans[id]) { s.ans[id] = { ua: "", r: "wrong" }; const res = record(id, "wrong"); s.xp += res.pts; }
  }
  s.end = Date.now();
  st.sessions.unshift(s); st.sessions = st.sessions.slice(0, 60);
  st.current = null; save(); pushScore(true); logSession(s);
  const up = levelOf(G.xp) > before ? levelOf(G.xp) : null;
  go("result", s.id);
  if (up != null || gotB.length) celebrate({ up, newB: gotB });
}

/* ═════════════ 결과 ═════════════ */
function sessScore(s) { return s.qids.reduce((a, id) => a + score(s.ans[id]?.r), 0); }
function result(sid) {
  const s = S().sessions.find(x => x.id === sid);
  if (!s) return go("home");
  const sc = sessScore(s), n = s.qids.length, hundred = Math.round(sc / n * 100);
  const notRight = s.qids.filter(id => s.ans[id]?.r !== "correct");
  const pending = s.qids.filter(id => s.ans[id]?.r === "pending").length;
  if (s.mode === "mock" && !pending) {
    const extra = []; if (hundred >= 80) extra.push("mock80"); if (hundred === 100) extra.push("mock100");
    const nb = checkBadges(extra); if (nb.length) { save(); celebrate({ up: null, newB: nb }); }
  }
  const msg = hundred >= 90 ? "완벽에 가까워요!" : hundred >= 70 ? "잘했어요! 틀린 것만 다시 보면 돼요." : hundred >= 50 ? "절반 넘게 맞혔어요. 오답을 정리해 봐요." : "해설을 읽고 다시 도전하면 쑥 올라요.";
  app.innerHTML = `
  <div class="stack">
    <section class="sheet score">
      <span class="label">${MODE[s.mode]} 결과</span>
      ${isExam(s.mode) ? `<div class="big"><em>${hundred}</em>점</div><div class="muted">${fmtScore(sc)} / ${n}문항</div>` : `<div class="big"><em>${fmtScore(sc)}</em> / ${n}</div>`}
      <div><b>${msg}</b></div>
      <div class="muted small">정답률 ${hundred}% · 걸린 시간 ${fmtDur(s.end - s.start)} · 이번에 얻은 점수 <span class="gain">+${s.xp || 0}</span></div>
      ${(rl => rl ? `<div class="small">${rl}</div>` : "")(SOLO ? null : rankLine())}
      ${s.mode === "topw" ? `<div class="small muted">핵심 내용이 모두 들어가면 정답(1점), 절반 이상이면 부분 정답(0.5점)으로 자동 채점했어요.</div>` : ""}
      ${pending ? `<div class="notice" style="margin-top:6px">서술형 ${pending}문항은 아래에서 모범답안과 비교해 스스로 채점해 주세요.</div>` : ""}
      <div class="row" style="justify-content:center;margin-top:8px">
        ${notRight.length ? `<button class="btn primary" id="retry">틀린 문제 다시 풀기 (${notRight.length})</button>` : ""}
        <button class="btn" id="to-wrong">오답노트</button><button class="btn" id="to-home">처음으로</button></div>
    </section>
    <div class="row"><b>문항별 결과</b><span class="spacer"></span>
      <label class="small row" style="gap:6px"><input type="checkbox" id="only-wrong"> 틀린 문제만</label></div>
    <div class="stack" id="items">${s.qids.map((id, i) => itemHtml(QMAP[id], s.ans[id], s, i + 1)).join("")}</div>
  </div>`;
  if (!isExam(s.mode) && hundred >= 90 && !pending) confetti();
  $("#to-home").onclick = () => go("home");
  $("#to-wrong").onclick = () => go("wrong");
  bindNoteLinks();
  if ($("#retry")) $("#retry").onclick = () => startSession("retry", shuffle(notRight));
  $("#only-wrong").onchange = e => $$(".item").forEach(el => el.hidden = e.target.checked && el.classList.contains("correct"));
  $$("[data-self]").forEach(b => b.onclick = () => {
    const id = b.closest("[data-q]").dataset.q;
    s.ans[id].r = b.dataset.self; const res = record(id, b.dataset.self, { silentCombo: true }); s.xp = (s.xp || 0) + res.pts; save();
    result(sid); celebrate(res);
  });
  $$("[data-accept]").forEach(b => b.onclick = () => {
    const id = b.closest("[data-q]").dataset.q, log = S().log;
    s.ans[id].r = "correct";
    for (let i = log.length - 1; i >= 0; i--) if (log[i].q === id) { log[i].r = "correct"; break; }
    const bonus = 10 + (QMAP[id].d - 1) * 5 - 2; G.xp += bonus; addWeekXp(bonus); s.xp = (s.xp || 0) + bonus;
    checkBadges(); save(); result(sid); toast("정답으로 바꿨어요.");
  });
}
function itemHtml(q, a, s, n) {
  a = a || { r: "wrong", ua: "" };
  return `<article class="sheet item ${a.r} stack" data-q="${q.id}">
    <div class="row"><span class="ox ${a.r}">${MARK[a.r]}</span><b>${n}번</b><span class="tag ${q.t}">${kind(q)}</span><span class="tag">${esc(q.tag)}</span></div>
    ${qBody(q)}
    ${q.t === "mc" ? `<ol class="choice-list">${(s ? s.orders[q.id] : [1, 2, 3, 4, 5]).map((o, i) => `<li class="${o === q.a ? "ans" : ""}">${NUM[i]} ${esc(q.c[o - 1])}</li>`).join("")}</ol>` : ""}
    <dl class="kv"><dt>내 답</dt><dd>${esc(answerText(q, a.ua, s))}</dd><dt>${q.t === "essay" ? "모범답안" : "정답"}</dt><dd>${esc(rightText(q, s))}</dd>
      ${q.rb ? `<dt>채점 기준</dt><dd>${esc(q.rb)}</dd>` : ""}</dl>
    ${q.kw ? kwHtml(q, a.ua) : ""}
    ${q.kw && a.r !== "correct" && a.ua ? `<div><button class="btn small" data-accept>뜻이 같은 답이면 정답으로 바꾸기</button></div>` : ""}
    ${a.r === "pending" ? `<div class="self" role="group" aria-label="스스로 채점"><button data-self="correct">O 다 썼어요</button><button data-self="partial">△ 일부만</button><button data-self="wrong">X 못 썼어요</button></div>` : ""}
    <details ${a.r !== "correct" ? "open" : ""}><summary>해설</summary><p style="margin:0">${esc(q.ex)}</p></details>
    ${a.r !== "correct" && a.r !== "pending" && noteLink(q) ? `<div>${noteLink(q)}</div>` : ""}
  </article>`;
}

/* ═════════════ 오답노트 ═════════════ */
let showMastered = false;
function wrongView() {
  const list = wrongList(showMastered);
  const masteredN = wrongList(true).filter(w => w.mastered).length;
  app.innerHTML = `
  <div class="stack">
    <section class="hero"><span class="label">오답노트</span><h1>틀린 문제 모아 보기</h1>
      <p>연속 2번 맞히면 ‘졸업’해서 목록에서 빠져요. 지금까지 졸업한 문제: <b>${masteredN}개</b></p></section>
    <div class="row"><label class="small row" style="gap:6px"><input type="checkbox" id="mastered" ${showMastered ? "checked" : ""}> 졸업한 문제도 보기</label>
      <span class="spacer"></span><button class="btn primary" id="review" ${wrongList(false).length ? "" : "disabled"}>오답 복습 시작</button></div>
    ${list.length ? list.map(w => {
      const q = QMAP[w.id];
      return `<article class="sheet item ${w.mastered ? "correct" : "wrong"} stack">
        <div class="row"><span class="tag" style="color:var(--bad)">${w.wrong}번 틀림</span>
          ${w.mastered ? `<span class="tag" style="color:var(--ok)">졸업</span>` : w.streak ? `<span class="tag" style="color:var(--ok)">졸업까지 ${2 - w.streak}번</span>` : ""}
          <span class="tag ${q.t}">${kind(q)}</span><span class="tag">${esc(q.tag)}</span></div>
        ${qBody(q)}
        ${q.t === "mc" ? `<ol class="choice-list">${q.c.map((c, i) => `<li>${NUM[i]} ${esc(c)}</li>`).join("")}</ol>` : ""}
        <details><summary>정답과 해설</summary>
          <dl class="kv"><dt>정답</dt><dd>${esc(rightText(q))}</dd>${q.rb ? `<dt>채점 기준</dt><dd>${esc(q.rb)}</dd>` : ""}</dl>
          <p style="margin:8px 0 0">${esc(q.ex)}</p></details>
        ${w.mastered ? "" : noteLink(q) ? `<div>${noteLink(q)}</div>` : ""}
      </article>`;
    }).join("") : `<div class="sheet empty">틀린 문제가 없어요. 문제를 풀면 여기에 모여요.</div>`}
  </div>`;
  $("#mastered").onchange = e => { showMastered = e.target.checked; wrongView(); };
  bindNoteLinks();
  $("#review").onclick = () => { const w = wrongList(false); if (w.length) startSession("wrong", shuffle(w.slice(0, 20).map(x => x.id))); };
}

/* ═════════════ 기록 ═════════════ */
function records() {
  const us = Object.fromEntries(groupStats(q => q.u).map(s => [s.k, s]));
  const ks = groupStats(kind).sort((a, b) => a.rate - b.rate);
  const tags = groupStats(q => q.tag).sort((a, b) => a.rate - b.rate || b.n - a.n);
  const sess = S().sessions;
  app.innerHTML = `
  <div class="stack">
    <section class="hero"><span class="label">기록</span><h1>얼마나 알고 있을까</h1>
      <p>이 기기에서 푼 기록이에요. 부모님도 이 화면에서 확인할 수 있어요.</p></section>
    <section class="sheet stack"><h2 style="font-size:1.05rem">단원별 정답률</h2>
      <div class="scroll"><table><thead><tr><th>단원</th><th class="num">풀어 봄</th><th class="num">맞힘</th><th class="num">정답률</th><th></th></tr></thead><tbody>
      ${Object.entries(UNITS).map(([k, u]) => { const s = us[k]; const r = s ? s.rate : null;
        const pu = progressOf(subject).units[k];
        return `<tr><td>${u.big} ${esc(u.name)}</td><td class="num">${pu.tried}/${pu.total}</td><td class="num">${pu.right}</td><td class="num">${pct(r)}</td><td style="width:28%"><div class="meter"><i style="width:${r == null ? 0 : r * 100}%"></i></div></td></tr>`; }).join("")}
      </tbody></table></div></section>
    ${ks.length ? `<section class="sheet stack"><h2 style="font-size:1.05rem">문제 유형별 정답률</h2>
      <div class="scroll"><table><thead><tr><th>유형</th><th class="num">풀이</th><th class="num">정답률</th></tr></thead><tbody>
      ${ks.map(t => `<tr><td>${esc(t.k)}</td><td class="num">${t.n}</td><td class="num">${pct(t.rate)}</td></tr>`).join("")}</tbody></table></div></section>` : ""}
    ${tags.length ? `<section class="sheet stack"><h2 style="font-size:1.05rem">개념별 정답률 <span class="small muted">낮은 순</span></h2>
      <div class="scroll"><table><thead><tr><th>개념</th><th class="num">풀이</th><th class="num">정답률</th></tr></thead><tbody>
      ${tags.slice(0, 12).map(t => `<tr><td>${esc(t.k)}</td><td class="num">${t.n}</td><td class="num">${pct(t.rate)}</td></tr>`).join("")}</tbody></table></div></section>` : ""}
    <section class="sheet stack"><h2 style="font-size:1.05rem">회차별 점수</h2>
      ${sess.length ? `<div class="scroll"><table><thead><tr><th>날짜</th><th>종류</th><th class="num">점수</th><th class="num">시간</th><th></th></tr></thead><tbody>
      ${sess.map(s => `<tr><td>${fmtDate(s.start)}</td><td>${MODE[s.mode]}</td><td class="num"><b>${fmtScore(sessScore(s))}</b> / ${s.qids.length}</td><td class="num">${fmtDur(s.end - s.start)}</td>
        <td><button class="btn small" data-s="${s.id}">보기</button></td></tr>`).join("")}</tbody></table></div>` : `<p class="muted" style="margin:0">아직 끝낸 회차가 없어요.</p>`}</section>
    <div class="row"><span class="spacer"></span><button class="btn ghost small" id="reset" style="color:var(--bad)">${BANKS[subject].name} 기록 모두 지우기</button></div>
  </div>`;
  $$("[data-s]").forEach(b => b.onclick = () => go("result", +b.dataset.s));
  const r = $("#reset");
  r.onclick = () => {
    if (r.dataset.armed) { DB.subj[subject] = { log: [], sessions: [], current: null, exam: S().exam }; save(); toast(`${BANKS[subject].name} 기록을 지웠어요. 레벨과 도장은 그대로예요.`); records(); return; }
    r.dataset.armed = "1"; r.textContent = "정말 지울까요? 한 번 더 누르세요";
    setTimeout(() => { if (r.isConnected) { delete r.dataset.armed; r.textContent = `${BANKS[subject].name} 기록 모두 지우기`; } }, 3500);
  };
}

/* ═════════════ 도장판 ═════════════ */
function stamps() {
  const n = Object.keys(G.badges).length;
  app.innerHTML = `
  <div class="stack">
    <section class="hero"><span class="label">도장판</span><h1>${n}개의 도장을 모았어요</h1>
      <p>목표를 이루면 선생님 채점 도장처럼 쾅! 찍혀요. 남은 도장: ${BADGES.length - n}개</p></section>
    <section class="sheet"><div class="stamps">
      ${BADGES.map(b => { const got = G.badges[b.id];
        return `<div class="badge ${got ? "" : "locked"}"><div class="seal">${got ? b.seal.replace("\n", "<br>") : "?"}</div>
          <b>${esc(b.name)}</b><span>${esc(b.desc)}</span>${got ? `<span>${fmtDate(got)}</span>` : ""}</div>`; }).join("")}
    </div></section>
  </div>`;
}

/* 객관식 숫자키 1~5 */
document.addEventListener("keydown", e => {
  if (view !== "quiz" || e.target.matches("input, textarea")) return;
  const n = +e.key;
  if (n >= 1 && n <= 5) { const b = $$(".choice")[n - 1]; if (b && !b.disabled) b.click(); }
});

if (SOLO) $("#nav-rank").remove();
if (who) { checkBadges(); save(); }
render();
</script>

</body>
